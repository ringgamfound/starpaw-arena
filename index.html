      const d = U.dist(x, y, this.tx, this.ty);
      this.dur = Math.max(0.08, d / this.cfg.speed);
      if (this.cfg.teamTint) { this.color = C.TEAM[team].light; this.trailCol = C.TEAM[team].glow; }
      else { this.color = this.cfg.color; this.trailCol = this.cfg.trailCol; }
    }
    update(dt) {
      const c = this.cfg;
      this.t += dt;
      this.rot += (c.spin || 0) * dt;
      if (!c.lob && this.target && !this.target.dead) {
        this.tx = this.target.x; this.ty = this.target.y;
        this.tz = this.target.z + (this.target.kind === 'unit' ? 18 * this.target.size : this.target.kind === 'tower' ? 40 : 20);
      }
      if (c.lob) {
        const k = Math.min(1, this.t / this.dur);
        this.x = U.lerp(this.sx0, this.tx, k); this.y = U.lerp(this.sy0, this.ty, k);
        this.z = U.lerp(this.sz0, this.tz, k) + Math.sin(k * Math.PI) * c.arc;
        if (k >= 1) this.impact();
      } else {
        const dx = this.tx - this.x, dy = this.ty - this.y, dz = this.tz - this.z;
        const d = Math.hypot(dx, dy, dz);
        const step = c.speed * dt;
        if (d <= step + 2) { this.x = this.tx; this.y = this.ty; this.z = this.tz; this.impact(); }
        else {
          this.x += (dx / d) * step; this.y += (dy / d) * step; this.z += (dz / d) * step;
          if (c.arc) this.z += Math.sin(Math.min(1, this.t / this.dur) * Math.PI) * c.arc * dt * 2;
        }
      }
      // trails
      this.trailT -= dt;
      if (this.trailT <= 0 && !this.done) {
        this.trailT = c.fire ? 0.012 : c.big ? 0.03 : 0.025;
        if (c.fire) {
          for (let i = 0; i < 2; i++) FX.p({ x: this.x, y: this.y, z: this.z, vx: U.rand(-50, 50), vy: U.rand(-50, 50), vz: U.rand(-10, 40), life: 0.45, size: U.rand(14, 22), size1: 4, shape: 'glowheart', color: U.pick(FX.PAL.fire), add: true, drag: 3, layer: 1 });
        } else {
          FX.p({ x: this.x + U.rand(-3, 3), y: this.y + U.rand(-3, 3), z: this.z + U.rand(-3, 3), vx: U.rand(-15, 15), vy: U.rand(-15, 15), vz: U.rand(-5, 15), life: c.big ? 0.6 : 0.35,
            size: c.big ? 20 : 10, size1: 2, shape: c.trail, color: this.trailCol, add: c.trail !== 'smoke' && c.trail !== 'circle', drag: 2, layer: 1, vr: 3 });
        }
      }
    }
    impact() {
      if (this.done) return;
      this.done = true;
      const M = this.M;
      if (this.splash > 0) {
        M.damageArea(this.team, this.tx, this.ty, this.splash, this.dmg, { element: this.element, targets: this.targets, source: this.owner, slow: this.slow, primary: this.target });
      } else if (this.target && !this.target.dead) {
        M.damage(this.target, this.dmg, this.owner, { element: this.element });
        if (this.slow) M.applySlow(this.target, this.slow.pct, this.slow.dur);
      }
      const pw = this.cfg.big ? 1.3 : this.splash > 0 ? 0.9 : 0.6;
      FX.hit(this.element, this.tx, this.ty, this.tz, pw);
      if (this.type === 'cannonBall') { FX.screenShake(8); FX.doHitStop(0.04); A().sfx('boom', { x: this.tx }); }
      else A().sfx('hit_' + this.element, { x: this.tx });
    }
    draw(ctx) {
      if (this.done) return;
      const c = this.cfg;
      const X = sx(this.x), Y = sy(this.y) - this.z;
      const G = NK.G;
      if (c.lob) {
        ctx.globalAlpha = 0.25;
        ctx.beginPath(); ctx.ellipse(X, sy(this.y), 10, 5, 0, 0, TAU); ctx.fillStyle = '#3c1e5a'; ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.7;
      const gs = c.size * 2.0;
      ctx.drawImage(G.tex('glow', this.trailCol || this.color), X - gs / 2, Y - gs / 2, gs, gs);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.save();
      ctx.translate(X, Y);
      if (c.orient) {
        const vx = (this.tx - this.x) * C.SX, vy = (this.ty - this.y) * C.SY - (this.tz - this.z);
        ctx.rotate(Math.atan2(vy, vx) + Math.PI / 2);
      } else ctx.rotate(this.rot);
      const s = c.size;
      if (this.type === 'cannonBall') {
        ctx.beginPath(); ctx.arc(0, 0, s * 0.55, 0, TAU); ctx.fillStyle = '#ff94bb'; ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = C.INK; ctx.stroke();
        G.softStarPath(ctx, 0, 0, s * 0.35, s * 0.17); ctx.fillStyle = '#ffe066'; ctx.fill();
        ctx.beginPath(); ctx.arc(-s * 0.2, -s * 0.2, s * 0.12, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill();
      } else if (c.shape === 'glow') {
        // solid magic orb: coloured shell, bright core, soft rim
        ctx.beginPath(); ctx.arc(0, 0, s * 0.36, 0, TAU);
        const og = ctx.createRadialGradient(-s * 0.1, -s * 0.1, 1, 0, 0, s * 0.36);
        og.addColorStop(0, '#ffffff'); og.addColorStop(0.45, U.shade(this.color, 0.3)); og.addColorStop(1, this.color);
        ctx.fillStyle = og; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = U.shade(this.color, -0.35); ctx.stroke();
        G.sparklePath(ctx, 0, 0, s * 0.3, 0.18); ctx.fillStyle = '#ffffff'; ctx.fill();
      } else {
        ctx.drawImage(G.tex(c.shape, this.color), -s / 2, -s / 2, s, s);
      }
      ctx.restore();
      if (c.swirl) {
        for (let i = 0; i < 3; i++) {
          const a = this.t * 14 + (i * TAU) / 3;
          ctx.drawImage(G.tex('sparkle', '#ffffff'), X + Math.cos(a) * 12 - 5, Y + Math.sin(a) * 7 - 5, 10, 10);
        }
      }
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  NK.Unit = Unit; NK.Structure = Structure; NK.Projectile = Projectile; NK.PROJ = PROJ; NK.drawHpBar = drawHpBar;
})();

/* ---- 09_spells.js ---- */
/* =====================================================================
   Spells: Shooting Star, Healing Blossom, Thunder Paw, Bubble Shield.
   Each spell is a short-lived object with update + ground/top drawing.
   ===================================================================== */
'use strict';
(() => {
  const U = NK.U, C = NK.C, FX = NK.FX, G = NK.G, TAU = U.TAU;
  const sx = C.toScreenX, sy = C.toScreenY;
  const A = () => NK.Audio;

  class Spell {
    constructor(M, card, team, x, y) {
      this.M = M; this.card = card; this.team = team; this.x = x; this.y = y;
      this.t = 0; this.done = false; this.fired = false;
      this.kind = card.spell;
      this.r = card.radius;
      this.seed = Math.random() * 1000;
      const init = INIT[this.kind]; if (init) init(this);
    }
    update(dt) { this.t += dt; UPDATE[this.kind](this, dt); }
    drawGround(ctx) { const f = DRAW_G[this.kind]; if (f) f(this, ctx); }
    drawTop(ctx) { const f = DRAW_T[this.kind]; if (f) f(this, ctx); }
  }

  const INIT = {
    star(s) {
      FX.circle(s.x, s.y, s.r, '#ffe066', s.card.delay + 0.15, { spin: 1.5, fill: true, points: 5, alpha: 0.95 });
      FX.circle(s.x, s.y, s.r * 0.55, '#ff9fd0', s.card.delay + 0.15, { spin: -2.5, points: 6 });
      A().sfx('starWarn', { x: s.x });
    },
    blossom(s) {
      s.flowers = [];
      for (let i = 0; i < 38; i++) {
        const a = Math.random() * TAU, d = Math.sqrt(Math.random()) * s.r * 0.95;
        s.flowers.push({ x: s.x + Math.cos(a) * d, y: s.y + Math.sin(a) * d, delay: Math.random() * 0.5, s: U.rand(0.7, 1.3), col: U.pick(['#ffb3d9', '#ffffff', '#fff3a3', '#ffc2dc', '#d9c8ff']), rot: Math.random() * TAU });
      }
      s.flowers.sort((a, b) => a.y - b.y);
      s.tickT = 0;
      FX.ring(s.x, s.y, 10, s.r, '#9fffb4', 0.6, 6);
      A().sfx('blossom', { x: s.x });
    },
    thunder(s) {
      FX.circle(s.x, s.y, s.r, '#fff27a', s.card.delay + 0.1, { spin: 4, fill: true, points: 4 });
      A().sfx('thunderWarn', { x: s.x });
    },
    bubble(s) {
      let n = 0;
      s.M.forAllies(s.team, s.x, s.y, s.r, (e) => {
        if (e.kind !== 'unit') return;
        e.shield = s.card.shield; e.shieldMax = s.card.shield; e.shieldT = s.card.duration;
        FX.burst(e.x, e.y, e.z + 24 * e.size, 8, { speed: 70, size: 14, life: 0.6, shape: ['ring', 'sparkle'], color: ['#bfe9ff', '#ffc2f0', '#ffffff'], add: true, drag: 3 });
        n++;
      });
      FX.ring(s.x, s.y, 10, s.r, '#bfe9ff', 0.6, 6);
      FX.circle(s.x, s.y, s.r, '#bfe9ff', 0.7, { spin: 2, fadeOut: true, fill: true, points: 6 });
      for (let i = 0; i < 18; i++) {
        const a = Math.random() * TAU, d = Math.random() * s.r;
        FX.p({ x: s.x + Math.cos(a) * d, y: s.y + Math.sin(a) * d, z: 5, vz: U.rand(40, 90), g: -10, drag: 1, life: U.rand(0.8, 1.4), size: U.rand(10, 20), size1: 14, shape: 'ring', color: U.pick(['#bfe9ff', '#ffd6f5', '#d6fff4']), add: true });
      }
      A().sfx('bubble', { x: s.x });
      s.done = true;
    },
  };

  const UPDATE = {
    star(s, dt) {
      const delay = s.card.delay;
      // falling star trail during last part
      const fallStart = delay - 0.5;
      if (s.t >= fallStart && s.t < delay) {
        const k = (s.t - fallStart) / 0.5;
        const [px, py, pz] = starPos(s, k);
        for (let i = 0; i < 3; i++) {
          FX.p({ x: px + U.rand(-8, 8), y: py + U.rand(-8, 8), z: pz + U.rand(-8, 8), vx: U.rand(-30, 30), vy: U.rand(-30, 30), vz: U.rand(20, 60), life: 0.5, size: U.rand(12, 24), size1: 2,
            shape: U.pick(['star', 'sparkle', 'glow']), color: U.pick(['#ffe066', '#fff3a3', '#ff9fd0', '#ffffff']), add: true, drag: 2, floor: false });
        }
        if (!s.whoosh) { s.whoosh = true; A().sfx('starFall', { x: s.x }); }
      }
      if (!s.fired && s.t >= delay) {
        s.fired = true;
        const c = s.card;
        s.M.damageArea(s.team, s.x, s.y, s.r, c.damage, { element: 'star', towerMult: c.towerMult, knock: c.knock, isSpell: true, big: true });
        FX.screenFlash(0.55, '#fff6d6');
        FX.screenShake(16);
        FX.doHitStop(0.08);
        FX.shock(s.x, s.y, s.r * 1.6, '#ffe066', 0.45);
        FX.ring(s.x, s.y, 20, s.r * 1.5, '#ffffff', 0.5, 10);
        FX.ring(s.x, s.y, 10, s.r * 1.15, '#ff9fd0', 0.6, 6);
        FX.burst(s.x, s.y, 20, 26, { speed: 380, size: 22, life: 0.9, shape: ['star', 'sparkle'], color: ['#ffe066', '#fff3a3', '#ff9fd0', '#bfe3ff', '#ffffff'], add: true, drag: 2.5, vz: 220, g: 380, vr: 10 });
        FX.burst(s.x, s.y, 8, 12, { speed: 170, size: 44, life: 1.1, shape: 'smoke', color: '#fff4fa', drag: 2.5, vz: 60, g: -20 });
        FX.burst(s.x, s.y, 10, 10, { speed: 260, size: 14, life: 0.7, shape: 'streak', color: '#ffffff', add: true, stretch: 1.5, drag: 4 });
        FX.impact(s.x, s.y, 20, 90, '#ffe066', 0.35);
        A().sfx('bigBoom', { x: s.x });
      }
      if (s.t >= delay + 0.35) s.done = true;
    },
    blossom(s, dt) {
      const c = s.card;
      s.tickT -= dt;
      if (s.tickT <= 0 && s.t < c.duration) {
        s.tickT = c.tick;
        s.M.forAllies(s.team, s.x, s.y, s.r, (e) => { if (e.kind === 'unit') s.M.heal(e, c.heal); });
      }
      if (Math.random() < dt * 14 && s.t < c.duration) {
        const a = Math.random() * TAU, d = Math.random() * s.r;
        FX.p({ x: s.x + Math.cos(a) * d, y: s.y + Math.sin(a) * d, z: 4, vz: U.rand(30, 70), vx: U.rand(-15, 15), g: -8, drag: 0.8, life: U.rand(1.2, 1.8), size: U.rand(10, 16), size1: 8,
          shape: U.pick(['petal', 'heart', 'sparkle', 'petal']), color: U.pick(['#ffb3d9', '#9fffb4', '#ffffff', '#ffc2dc']), vr: U.rand(-3, 3), fadeIn: 0.1, layer: 1 });
      }
      if (s.t >= c.duration + 0.6) s.done = true;
    },
    thunder(s) {
      const c = s.card;
      if (!s.fired && s.t >= c.delay) {
        s.fired = true;
        const hits = s.M.damageArea(s.team, s.x, s.y, s.r, c.damage, { element: 'lightning', towerMult: c.towerMult, stun: c.stun, isSpell: true });
        for (const e of hits) {
          FX.bolt(s.x + U.rand(-30, 30), s.y - 10, 420, e.x, e.y, e.z + 20, '#fff27a', 0.3, 4);
        }
        FX.bolt(s.x, s.y, 480, s.x, s.y, 0, '#fff27a', 0.35, 7);
        FX.screenFlash(0.35, '#fffbd0');
        FX.screenShake(9);
        FX.doHitStop(0.05);
        FX.ring(s.x, s.y, 10, s.r * 1.3, '#fff27a', 0.4, 8);
        FX.shock(s.x, s.y, s.r * 1.3, '#fff27a', 0.3);
        FX.burst(s.x, s.y, 10, 22, { speed: 330, size: 14, life: 0.4, shape: 'streak', color: FX.PAL.lightning, add: true, stretch: 1.5, drag: 5 });
        FX.burst(s.x, s.y, 10, 10, { speed: 160, size: 16, life: 0.5, shape: 'sparkle', color: '#ffffff', add: true, drag: 4 });
        A().sfx('thunder', { x: s.x });
      }
      if (s.t >= c.delay + 0.45) s.done = true;
    },
    bubble() {},
  };

  function starPos(s, k) {
    const e = U.easeInQuad(k);
    return [U.lerp(s.x - 260, s.x, e), U.lerp(s.y - 60, s.y, e), U.lerp(900, 0, e)];
  }

  const DRAW_G = {
    blossom(s, ctx) {
      const c = s.card;
      const fade = s.t < c.duration ? Math.min(1, s.t / 0.2) : Math.max(0, 1 - (s.t - c.duration) / 0.6);
      // soft glowing field
      ctx.save();
      ctx.globalAlpha = 0.35 * fade;
      ctx.beginPath(); ctx.ellipse(sx(s.x), sy(s.y), s.r * C.SX, s.r * C.SY, 0, 0, TAU);
      const g = ctx.createRadialGradient(sx(s.x), sy(s.y), 5, sx(s.x), sy(s.y), s.r * C.SX);
      g.addColorStop(0, 'rgba(180,255,190,0.9)'); g.addColorStop(0.7, 'rgba(255,190,225,0.5)'); g.addColorStop(1, 'rgba(255,190,225,0)');
      ctx.fillStyle = g; ctx.fill();
      ctx.globalAlpha = 0.8 * fade;
      ctx.lineWidth = 3; ctx.setLineDash([8, 8]); ctx.lineDashOffset = -s.t * 20;
      ctx.strokeStyle = '#9fffb4'; ctx.stroke(); ctx.setLineDash([]);
      ctx.restore();
      for (const f of s.flowers) {
        const k = U.clamp((s.t - f.delay) / 0.35, 0, 1);
        if (k <= 0) continue;
        const sc = U.easeOutBack(k) * f.s * fade;
        if (sc <= 0.01) continue;
        const X = sx(f.x), Y = sy(f.y);
        ctx.save(); ctx.translate(X, Y); ctx.rotate(f.rot + Math.sin(s.t * 2 + f.rot) * 0.2); ctx.scale(sc, sc * 0.8);
        G.flowerPath(ctx, 0, 0, 9, 5, 0);
        ctx.fillStyle = f.col; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(120,70,120,0.5)'; ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, 2.6, 0, TAU); ctx.fillStyle = '#ffd84a'; ctx.fill();
        ctx.restore();
      }
    },
  };

  const DRAW_T = {
    star(s, ctx) {
      const delay = s.card.delay, fallStart = delay - 0.5;
      if (s.t < fallStart || s.fired) return;
      const k = (s.t - fallStart) / 0.5;
      const [px, py, pz] = starPos(s, k);
      const X = sx(px), Y = sy(py) - pz;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(G.tex('glow', '#ffe066'), X - 80, Y - 80, 160, 160);
      ctx.globalCompositeOperation = 'source-over';
      ctx.translate(X, Y); ctx.rotate(s.t * 8);
      G.softStarPath(ctx, 0, 0, 40, 20);
      ctx.lineWidth = 5; ctx.strokeStyle = C.INK; ctx.stroke();
      const g = ctx.createRadialGradient(-10, -10, 2, 0, 0, 40);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#fff3a3'); g.addColorStop(1, '#ffc24d');
      ctx.fillStyle = g; ctx.fill();
      // cute face on the star
      ctx.rotate(-s.t * 8);
      ctx.fillStyle = C.INK;
      ctx.beginPath(); ctx.ellipse(-8, -2, 3, 4, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(8, -2, 3, 4, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(0, 5, 4, 0.1, Math.PI - 0.1); ctx.lineWidth = 2; ctx.strokeStyle = C.INK; ctx.stroke();
      ctx.restore();
    },
    thunder(s, ctx) {
      const c = s.card;
      // giant descending paw made of lightning
      const k = U.clamp(s.t / c.delay, 0, 1);
      const alpha = s.fired ? Math.max(0, 1 - (s.t - c.delay) / 0.35) : 0.5 + k * 0.5;
      if (alpha <= 0) return;
      const X = sx(s.x), Y = sy(s.y) - U.lerp(260, 30, U.easeInQuad(k));
      const size = s.r * (s.fired ? 1.1 + (s.t - c.delay) : 0.9);
      ctx.save();
      ctx.translate(X, Y); ctx.scale(1, 0.75);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = alpha;
      ctx.drawImage(G.tex('glow', '#fff27a'), -size * 1.2, -size * 1.2, size * 2.4, size * 2.4);
      const jit = () => (Math.random() - 0.5) * 6;
      const pads = [[0, 0.28, 0.52, 0.42], [-0.62, -0.22, 0.2, 0.24], [-0.24, -0.58, 0.21, 0.25], [0.24, -0.58, 0.21, 0.25], [0.62, -0.22, 0.2, 0.24]];
      for (const [lw, col] of [[12, 'rgba(255,240,120,0.45)'], [5, '#fff27a'], [2, '#ffffff']]) {
        ctx.lineWidth = lw; ctx.strokeStyle = col; ctx.lineJoin = 'round';
        for (const [px, py, rx, ry] of pads) {
          ctx.beginPath();
          const n = 12;
          for (let i = 0; i <= n; i++) {
            const a = (i / n) * TAU;
            const x = (px + Math.cos(a) * rx) * size + jit(), y = (py + Math.sin(a) * ry) * size + jit();
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }
      }
      ctx.restore();
    },
  };

  NK.Spell = Spell;
})();

/* ---- 10_match.js ---- */
/* =====================================================================
   Match: owns the battle state. PlayerState = deck cycling + Nyanergy.
   Provides targeting queries, lane-aware pathing, collisions, damage,
   deployment zones (with pocket expansion), timer / overtime / victory.
   ===================================================================== */
'use strict';
(() => {
  const U = NK.U, C = NK.C, FX = NK.FX, TAU = U.TAU;
  const A = () => NK.Audio;

  /* ---------------- Deck + resource per side ---------------- */
  class PlayerState {
    constructor(team, deck) {
      this.team = team;
      this.nrg = 5;
      this.deck = deck.slice();
      const order = U.shuffle(deck.slice());
      this.hand = order.slice(0, 4);
      this.queue = order.slice(4);
      this.drawT = [-0.35, -0.45, -0.55, -0.65];   // UI: time since card entered slot (negative = deal-in delay)
      this.stats = { played: 0, spent: 0, dmg: 0, units: 0, spells: 0, kills: 0 };
    }
    get next() { return this.queue[0]; }
    cycle(slot) {
      const used = this.hand[slot];
      this.hand[slot] = this.queue.shift();
      this.queue.push(used);
      this.drawT[slot] = 0;
    }
    regen(dt, mult) { this.nrg = Math.min(C.MAX_NRG, this.nrg + (dt / C.REGEN_SEC) * mult); }
  }

  const FORMATION = {
    1: [[0, 0]],
    2: [[-24, 0], [24, 0]],
    3: [[0, -18], [-21, 14], [21, 14]],
    4: [[-17, -15], [17, -15], [-17, 15], [17, 15]],
  };

  class Match {
    constructor(opts) {
      this.opts = opts;
      this.units = []; this.structures = []; this.projectiles = []; this.spells = [];
      this.grid = new NK.Grid(110);
      this.players = [new PlayerState(0, opts.playerDeck), new PlayerState(1, opts.opponent.deck)];
      this.crowns = [0, 0];
      this.time = C.MATCH_TIME;
      this.phase = 'intro'; this.introT = 3.2;
      this.double = false; this.overtime = false;
      this.clock = 0;                    // total sim time
      this.endT = 0; this.result = null;
      this.banner = null;
      this.events = [];
      // structures
      for (const t of [0, 1]) {
        this.structures.push(new NK.Structure(this, 'king', t, 550, C.KING_Y[t]));
        C.LANE_X.forEach((lx, lane) => this.structures.push(new NK.Structure(this, 'outer', t, lx, C.OUTER_Y[t], lane)));
      }
      this.ai = new NK.EnemyAI(this, 1, opts.opponent, NK.Difficulty[opts.difficulty]);
      if (opts.autoPlayer) this.ai0 = new NK.EnemyAI(this, 0, { deck: opts.playerDeck, w: NK.Opponents[3].w }, NK.Difficulty[2]);
      // warm sprite caches for both decks
      for (const [team, deck] of [[0, opts.playerDeck], [1, opts.opponent.deck]]) {
        for (const id of deck) {
          const c = NK.Cards[id];
          if (c.unit) NK.CatArt.prewarm(c.unit, team);
          if (c.unit === 'witchCat') NK.CatArt.prewarm('ghostKit', team);
        }
      }
      NK.CatArt.prewarm('ghostKit', 0); NK.CatArt.prewarm('ghostKit', 1);
    }

    requestCutin(u) {
      if (this.cutin && this.clock - this.cutin.at < 7) return;
      this.cutin = { at: this.clock, t: 0, key: u.key, team: u.team, text: u.def.cutin };
      FX.doSlowMo(0.45, 0.45);
      A().sfx('cutin');
    }
    announce(text, sub = '', color = '#ffe066', dur = 1.8) { this.banner = { text, sub, color, t: 0, dur }; }

    /* ---------------- main update ---------------- */
    update(dt) {
      this.clock += dt;
      if (this.banner) { this.banner.t += dt; if (this.banner.t > this.banner.dur) this.banner = null; }
      if (this.cutin) { this.cutin.t += dt; if (this.cutin.t > 1.1) this.cutin = null; }
      if (this.phase === 'intro') {
        this.introT -= dt;
        for (const s of this.structures) s.t += dt;
        for (const P of this.players) for (let i = 0; i < 4; i++) P.drawT[i] += dt;
        if (this.introT <= 0) { this.phase = 'battle'; this.announce('Nyan-Fight!', 'Destroy the enemy castle!', '#ffe066', 1.6); A().sfx('fightStart'); }
        return;
      }
      if (this.phase === 'battle') {
        this.time -= dt;
        if (!this.double && this.time <= C.DOUBLE_AT) {
          this.double = true;
          this.announce('Double Nyanergy!', 'Nyanergy flows twice as fast', '#ff8fd6');
          FX.edgeGlow = 1; A().sfx('double');
        }
        if (this.time <= 0) {
          this.time = 0;
          if (this.crowns[0] !== this.crowns[1]) this.end(this.crowns[0] > this.crowns[1] ? 0 : 1, 'time');
          else { this.phase = 'overtime'; this.overtime = true; this.time = C.OVERTIME; this.announce('Overtime!', 'Next crown wins • Triple Nyanergy', '#ff7a6b'); A().sfx('overtime'); }
        }
      } else if (this.phase === 'overtime') {
        this.time -= dt;
        if (this.time <= 0) { this.time = 0; this.tiebreak(); }
      }
      if (this.phase === 'ended') {
        this.endT += dt;
      } else {
        const mult = this.phase === 'overtime' ? 3 : this.double ? 2 : 1;
        for (const P of this.players) P.regen(dt, mult);
        this.ai.update(dt);
        if (this.ai0) this.ai0.update(dt);
      }
      for (const P of this.players) for (let i = 0; i < 4; i++) P.drawT[i] += dt;

      // grid
      this.grid.clear();
      for (const u of this.units) if (!u.dead) this.grid.insert(u);
      // entities
      for (const s of this.structures) s.update(dt);
      const n = this.units.length;
      for (let i = 0; i < n; i++) { const u = this.units[i]; if (!u.dead) { u.prevY = u.y; u.update(dt); } }
      this.resolveCollisions();
      for (const u of this.units) if (!u.dead) this.constrain(u);
      for (const p of this.projectiles) p.update(dt);
      for (const s of this.spells) s.update(dt);
      // cleanup
      this.units = this.units.filter((u) => !u.dead);
      this.projectiles = this.projectiles.filter((p) => !p.done);
      this.spells = this.spells.filter((s) => !s.done);
      this.structures = this.structures.filter((s) => !(s.dead && s.kind === 'building'));
    }

    tiebreak() {
      // weakest surviving tower decides
      const weakest = [0, 1].map((t) => Math.min(...this.structures.filter((s) => s.team === t && s.kind === 'tower' && !s.dead).map((s) => s.hp / s.maxHp)));
      if (Math.abs(weakest[0] - weakest[1]) < 1e-4) this.end(-1, 'draw');
      else this.end(weakest[0] > weakest[1] ? 0 : 1, 'tiebreak');
    }

    end(winner, reason) {
      if (this.phase === 'ended') return;
      this.phase = 'ended';
      this.endT = 0;
      this.result = { winner, reason, crowns: this.crowns.slice() };
      FX.doSlowMo(1.4, 0.35);
      if (winner === 0) A().sfx('victoryHit'); else if (winner === 1) A().sfx('defeatHit');
    }

    /* ---------------- deployment ---------------- */
    zonesFor(team) {
      const Z = [];
      if (team === 0) Z.push({ x0: 18, x1: C.WW - 18, y0: C.RIVER_BOT + 22, y1: C.WH - 16 });
      else Z.push({ x0: 18, x1: C.WW - 18, y0: 16, y1: C.RIVER_TOP - 22 });
      for (const s of this.structures) {
        if (s.sub !== 'outer' || !s.dead || s.team === team) continue;
        const left = s.lane === 0;
        const x0 = left ? 18 : C.WW / 2, x1 = left ? C.WW / 2 : C.WW - 18;
        if (team === 0) Z.push({ x0, x1, y0: 420, y1: C.RIVER_TOP - 22 });
        else Z.push({ x0, x1, y0: C.RIVER_BOT + 22, y1: C.WH - 420 });
      }
      return Z;
    }
    clampDeploy(team, card, x, y) {
      if (card.type === 'spell') return { x: U.clamp(x, 0, C.WW), y: U.clamp(y, 0, C.WH), snapped: false };
      const zones = this.zonesFor(team);
      let best = null, bd = Infinity, bz = null;
      for (const z of zones) {
        const cx = U.clamp(x, z.x0, z.x1), cy = U.clamp(y, z.y0, z.y1);
        const d = U.dist2(x, y, cx, cy);
        if (d < bd) { bd = d; best = { x: cx, y: cy }; bz = z; }
      }
      const r = card.type === 'building' ? NK.Structures[card.building].r : NK.Units[card.unit].r;
      const isB = card.type === 'building';
      for (let it = 0; it < 4; it++) {
        for (const s of this.structures) {
          if (s.dead) continue;
          const d = U.dist(best.x, best.y, s.x, s.y);
          const min = s.r + r * (isB ? 1 : 0.5) + 4;
          if (d < min) {
            const nx = d > 0.01 ? (best.x - s.x) / d : 0, ny = d > 0.01 ? (best.y - s.y) / d : (team === 0 ? 1 : -1);
            best.x = s.x + nx * min; best.y = s.y + ny * min;
          }
        }
        best.x = U.clamp(best.x, bz.x0, bz.x1); best.y = U.clamp(best.y, bz.y0, bz.y1);
      }
      best.snapped = bd > 1;
      return best;
    }

    // returns {ok, reason, x, y}
    playCard(team, slot, x, y) {
      if (this.phase !== 'battle' && this.phase !== 'overtime') return { ok: false, reason: 'phase' };
      const P = this.players[team];
      const id = P.hand[slot];
      const card = NK.Cards[id];
      if (!card) return { ok: false, reason: 'card' };
      if (P.nrg < card.cost - 1e-6) return { ok: false, reason: 'nrg' };
      const pos = this.clampDeploy(team, card, x, y);
      if (!pos) return { ok: false, reason: 'zone' };
      P.nrg -= card.cost;
      P.cycle(slot);
      P.stats.played++; P.stats.spent += card.cost;
      this.deployCard(team, card, pos.x, pos.y);
      this.events.push({ type: 'play', team, id, x: pos.x, y: pos.y, t: this.clock });
      return { ok: true, x: pos.x, y: pos.y, card };
    }

    deployCard(team, card, x, y) {
      const P = this.players[team];
      if (card.type === 'unit') {
        const form = FORMATION[card.count] || FORMATION[1];
        const dir = team === 0 ? 1 : -1;
        form.forEach(([ox, oy], i) => {
          const u = this.spawnUnit(card.unit, team, x + ox * dir, y + oy * dir, { deployT: 0.9 + i * 0.05, variant: card.count > 1 && card.unit === 'kitten' ? i : 0 });
          if (u) u.deployT += 0; // staggered drop
        });
        P.stats.units += card.count;
        FX.deploy(x, y, team, 26 + card.count * 4);
        const def = NK.Units[card.unit];
        A().sfx('deploy', { x });
        if (NK.Settings.get('meows') && Math.random() < (team === 0 ? 0.7 : 0.3)) A().meow(def.voice, team === 0 ? 0.55 : 0.4, x);
      } else if (card.type === 'spell') {
        this.spells.push(new NK.Spell(this, card, team, x, y));
        P.stats.spells++;
      } else if (card.type === 'building') {
        const sub = card.building === 'yarnCannon' ? 'yarn' : 'shrine';
        const b = new NK.Structure(this, sub, team, x, y);
        this.structures.push(b);
        FX.deploy(x, y, team, 40);
        A().sfx('deploy', { x });
      }
    }

    spawnUnit(key, team, x, y, opts = {}) {
      if (this.units.length > 140) return null;
      const u = new NK.Unit(this, key, team, U.clamp(x, 10, C.WW - 10), U.clamp(y, 10, C.WH - 10), opts);
      // never spawn ground units in the river
      if (!u.air && u.y > C.RIVER_TOP && u.y < C.RIVER_BOT && !C.BRIDGES.some((b) => Math.abs(u.x - b) < C.BRIDGE_HW - 6)) u.y = team === 0 ? C.RIVER_BOT + 4 : C.RIVER_TOP - 4;
      this.units.push(u);
      return u;
    }
    spawnProjectile(type, team, x, y, z, target, o) {
      const p = new NK.Projectile(this, type, team, x, y, z, target, o);
      this.projectiles.push(p);
      return p;
    }

    /* ---------------- queries ---------------- */
    canHit(att, e) {
      if (!e || e.dead || !e.targetable) return false;
      if (e.team === att.team) return false;
      const tt = att.def.targets;
      if (tt === 'none') return false;
      if (tt === 'buildings') return e.kind !== 'unit';
      if (e.air) return tt === 'both' || tt === 'air';
      return tt !== 'air';
    }
    findTarget(u) {
      const tt = u.def.targets;
      let best = null, bd = Infinity;
      if (tt !== 'buildings') {
        const sight = u.def.sight;
        this.grid.query(u.x, u.y, sight + 60, (e) => {
          if (e === u || !this.canHit(u, e)) return;
          const d = U.dist(u.x, u.y, e.x, e.y) - e.r;
          if (d <= sight && d < bd) { bd = d; best = e; }
        });
        for (const s of this.structures) {
          if (!this.canHit(u, s)) continue;
          const d = U.dist(u.x, u.y, s.x, s.y) - s.r;
          if (d <= sight && d < bd) { bd = d; best = s; }
        }
        if (best) return best;
      }
      for (const s of this.structures) {
        if (!this.canHit(u, s)) continue;
        const d = this.pathDist(u, s);
        if (d < bd) { bd = d; best = s; }
      }
      return best;
    }
    findStructTarget(s) {
      const range = s.def.attack.range;
      let best = null, bd = Infinity;
      this.grid.query(s.x, s.y, range + s.r + 60, (e) => {
        if (!this.canHit(s, e) || e.state === 'deploy' && e.z > e.baseZ + 40) return;
        const d = U.dist(s.x, s.y, e.x, e.y) - e.r - s.r;
        if (d <= range && d < bd) { bd = d; best = e; }
      });
      for (const b of this.structures) {
        if (b.kind !== 'building' || !this.canHit(s, b)) continue;
        const d = U.dist(s.x, s.y, b.x, b.y) - b.r - s.r;
        if (d <= range && d < bd) { bd = d; best = b; }
      }
      return best;
    }
    sameSideOrBridge(a, b) { return C.sideOf(a.y) === C.sideOf(b.y); }

    bestBridge(x, tx) {
      let best = C.BRIDGES[0], bd = Infinity;
      for (const b of C.BRIDGES) { const d = Math.abs(x - b) + Math.abs(tx - b); if (d < bd) { bd = d; best = b; } }
      return best;
    }
    pathDist(u, s) {
      const d = U.dist(u.x, u.y, s.x, s.y);
      if (u.air) return d;
      const us = C.sideOf(u.y), ts = C.sideOf(s.y);
      if (us === ts || us === -1 || ts === -1) return d;
      const b = this.bestBridge(u.x, s.x);
      const ey = us === 0 ? C.RIVER_BOT : C.RIVER_TOP, xy = us === 0 ? C.RIVER_TOP : C.RIVER_BOT;
      return U.dist(u.x, u.y, b, ey) + (C.RIVER_BOT - C.RIVER_TOP) + U.dist(b, xy, s.x, s.y);
    }
    // lane-aware next waypoint for ground units
    pathGoal(u, tx, ty) {
      if (u.air) return [tx, ty];
      const us = C.sideOf(u.y);
      let ts = C.sideOf(ty);
      if (ts === -1) ts = ty < C.RIVER_Y ? 1 : 0;
      if (us === -1) {
        // on a bridge: walk straight across toward the target side
        const b = C.BRIDGES.reduce((p, c) => (Math.abs(c - u.x) < Math.abs(p - u.x) ? c : p));
        const lim = C.BRIDGE_HW - u.r * 0.8;
        const gx = U.clamp(U.lerp(u.x, tx, 0.15), b - lim, b + lim);
        return [gx, ts === 1 ? C.RIVER_TOP - 40 : C.RIVER_BOT + 40];
      }
      if (us !== ts) {
        const b = this.bestBridge(u.x, tx);
        const bankY = us === 0 ? C.RIVER_BOT : C.RIVER_TOP;
        const lim = C.BRIDGE_HW - u.r * 0.8 - 4;
        const dy = Math.abs(u.y - bankY);
        if (Math.abs(u.x - b) < lim && dy < 70) return [U.clamp(u.x, b - lim, b + lim), us === 0 ? C.RIVER_TOP - 40 : C.RIVER_BOT + 40];
        // approach entry point smoothly: aim slightly before bank
        return [b, bankY + (us === 0 ? 24 : -24)];
      }
      return [tx, ty];
    }

    forAllies(team, x, y, r, fn) {
      for (const u of this.units) if (u.team === team && !u.dead && U.dist(u.x, u.y, x, y) <= r + u.r * 0.5) fn(u);
      for (const s of this.structures) if (s.team === team && !s.dead && s.kind === 'building' && U.dist(s.x, s.y, x, y) <= r + s.r * 0.5) fn(s);
    }

    /* ---------------- collisions & constraints ---------------- */
    resolveCollisions() {
      const units = this.units;
      for (let i = 0; i < units.length; i++) {
        const a = units[i];
        if (a.dead || (a.state === 'deploy' && a.z > a.baseZ + 2)) continue;
        this.grid.query(a.x, a.y, a.r + 40, (b) => {
          if (b.id <= a.id || b.dead || b.air !== a.air) return;
          if (b.state === 'deploy' && b.z > b.baseZ + 2) return;
          let dx = b.x - a.x, dy = b.y - a.y;
          let d = Math.hypot(dx, dy);
          const min = (a.r + b.r) * 0.92;
          if (d >= min) return;
          if (d < 0.01) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d = Math.hypot(dx, dy); }
          const nx = dx / d, ny = dy / d;
          const ma = a.mass * (a.engaged ? 4 : 1) * (a.dashing ? 0.1 : 1), mb = b.mass * (b.engaged ? 4 : 1) * (b.dashing ? 0.1 : 1);
          const overlap = (min - d) * 0.55;
          const ta = mb / (ma + mb), tb = ma / (ma + mb);
          a.x -= nx * overlap * ta; a.y -= ny * overlap * ta;
          b.x += nx * overlap * tb; b.y += ny * overlap * tb;
        });
        if (!a.air) {
          for (const s of this.structures) {
            if (s.dead) continue;
            const dx = a.x - s.x, dy = a.y - s.y;
            const d = Math.hypot(dx, dy);
            const min = s.r + a.r * 0.8;
            if (d < min && d > 0.01) { a.x = s.x + (dx / d) * min; a.y = s.y + (dy / d) * min; }
          }
        }
      }
    }
    constrain(u) {
      u.x = U.clamp(u.x, u.r * 0.6, C.WW - u.r * 0.6);
      u.y = U.clamp(u.y, u.r * 0.6, C.WH - u.r * 0.6);
      if (u.air) return;
      if (u.y > C.RIVER_TOP && u.y < C.RIVER_BOT) {
        let bridge = null;
        for (const b of C.BRIDGES) if (Math.abs(u.x - b) <= C.BRIDGE_HW - 2) bridge = b;
        if (bridge === null) {
          const prev = u.prevY != null ? u.prevY : u.y;
          u.y = prev <= C.RIVER_Y ? C.RIVER_TOP : C.RIVER_BOT;
        } else {
          const lim = C.BRIDGE_HW - u.r * 0.6;
          u.x = U.clamp(u.x, bridge - lim, bridge + lim);
        }
      }
    }

    /* ---------------- combat ---------------- */
    damage(target, amount, src, opts = {}) {
      if (!target || target.dead || target.dashing) return 0;
      let amt = amount;
      if (target.kind === 'tower' && opts.towerMult) amt *= opts.towerMult;
      amt = Math.max(1, Math.round(amt));
      let absorbed = 0;
      if (target.shield > 0) {
        absorbed = Math.min(target.shield, amt);
        target.shield -= absorbed; amt -= absorbed;
        if (target.shield <= 0) target.popShield();
      }
      target.hp -= amt;
      target.hitT = 0.1;
      target.lastHit = this.clock;
      const hz = target.z + (target.kind === 'unit' ? 44 * target.size : target.kind === 'tower' ? (target.sub === 'king' ? 110 : 80) : 50);
      if (target.kind === 'unit') {
        target.impulse(-2 - Math.min(6, amt / 60));
        if (target.hurtCd <= 0 && amt >= target.maxHp * 0.06) { target.hurtT = 0.14; target.hurtCd = 0.45; }
      } else if (target.kind === 'tower') {
        target.hitT = 0.14;
        if (target.team === 0) { FX.vignette = Math.max(FX.vignette, Math.min(0.5, 0.12 + amt / 800)); FX.vignetteCol = '#ff4f7a'; }
      }
      const hz2 = hz + (target._aoeIdx ? (target._aoeIdx % 4) * 14 : 0); target._aoeIdx = 0;
      if (amt > 0) FX.number(target.x, target.y, hz2, amt, { key: target.id, big: amt >= 300 || opts.big, color: target.team === 0 && target.kind === 'tower' ? '#ffb3c7' : null });
      else if (absorbed > 0) FX.number(target.x, target.y, hz, absorbed, { key: -target.id, color: '#bfe9ff' });
      if (src && src.team != null) this.players[src.team].stats.dmg += amt;
      if (target.hp <= 0) this.kill(target, src);
      return amt;
    }
    damageArea(team, x, y, r, dmg, opts = {}) {
      const hits = [];
      const tt = opts.targets || 'both';
      const test = (e) => {
        if (e.team === team || e.dead || !e.targetable) return;
        if (tt === 'buildings' && e.kind === 'unit' && e !== opts.primary) { if (e.air) return; }
        else if (tt === 'ground' && e.air) return;
        if (U.dist(e.x, e.y, x, y) > r + e.r * 0.6) return;
        hits.push(e);
      };
      for (const u of this.units) test(u);
      for (const s of this.structures) test(s);
      hits.forEach((e, i) => { e._aoeIdx = i; });
      for (const e of hits) {
        this.damage(e, dmg, opts.source || { team }, opts);
        if (opts.stun && e.kind !== 'tower') { e.stunT = Math.max(e.stunT, opts.stun); if (e.kind === 'unit') { e.atkCd = Math.max(e.atkCd, e.def.attack.windup); e.engaged = false; e.inRange = false; } }
        else if (opts.stun && e.kind === 'tower') { e.stunT = Math.max(e.stunT || 0, opts.stun * 0.5); }
        if (opts.slow) this.applySlow(e, opts.slow.pct, opts.slow.dur);
        if (opts.knock && e.kind === 'unit' && e.mass < 3) {
          const d = U.dist(x, y, e.x, e.y) || 1;
          const k = opts.knock / Math.max(1, e.mass);
          e.x += ((e.x - x) / d) * k; e.y += ((e.y - y) / d) * k;
        }
      }
      return hits;
    }
    beamDamage(u, x1, y1, x2, y2, width, dmg, element) {
      const hit = (e) => {
        if (!this.canHit(u, e)) return;
        if (U.distToSeg(e.x, e.y, x1, y1, x2, y2) > width / 2 + e.r) return;
        this.damage(e, dmg, u, { element, big: true });
        FX.hit('rainbow', e.x, e.y, e.z + 24, 0.8);
      };
      for (const e of this.units.slice()) hit(e);
      for (const s of this.structures) hit(s);
    }
    heal(e, amt) {
      if (e.dead) return;
      const before = e.hp;
      e.hp = Math.min(e.maxHp, e.hp + amt);
      const got = e.hp - before;
      if (got > 1) {
        FX.number(e.x, e.y, e.z + 40 * (e.size || 1), got, { heal: true });
        FX.hit('heal', e.x, e.y, e.z + 10, 0.7);
      }
    }
    applySlow(e, pct, dur) {
      if (e.dead || e.kind === 'tower') return;
      e.slowPct = Math.max(e.slowT > 0 ? e.slowPct : 0, pct);
      e.slowT = Math.max(e.slowT, dur);
    }
    addNyanergy(team, amt, x, y) {
      const P = this.players[team];
      P.nrg = Math.min(C.MAX_NRG, P.nrg + amt);
      FX.text(x, y, 100, '+' + amt, '#ff8fd6', 26, 1.1);
      FX.burst(x, y, 90, 8, { speed: 80, size: 12, life: 0.6, shape: 'sparkle', color: ['#ff8fd6', '#ffffff'], add: true, drag: 3 });
      if (team === 0) A().sfx('gain');
    }

    kill(e, src) {
      if (e.dead) return;
      e.dead = true; e.hp = 0;
      if (e.kind === 'unit') {
        const death = e.def.death;
        if (death === 'tumble') {
          const fr = NK.CatArt.getFrame(e.key, e.def.art, e.team, 'hurt', e.variant);
          FX.e({ type: 'fall', frame: fr, x: e.x, y: e.y, z: e.z, flip: e.face, life: 0.55 });
          setTimeout(() => FX.burst(e.x - e.face * 14, e.y, 10, 5, { speed: 60, size: 18, life: 0.5, shape: 'smoke', color: '#ffffff', drag: 3 }), 0);
          FX.burst(e.x, e.y, e.z + 16, 4, { speed: 90, size: 10, life: 0.5, shape: 'star', color: FX.PAL.star, add: true, drag: 3, vr: 6 });
        } else FX.death(death, e.x, e.y, e.z, e.team, e.size);
        if (src && src.team != null) this.players[src.team].stats.kills++;
        A().sfx('poof', { x: e.x, pitch: 1.3 / e.size });
        if (NK.Settings.get('meows') && Math.random() < 0.18) A().meow(e.def.voice * 1.15, 0.35, e.x, true);
      } else if (e.kind === 'building') {
        FX.burst(e.x, e.y, 20, 12, { speed: 120, size: 30, life: 0.8, shape: 'smoke', color: '#ffffff', drag: 3, vz: 40 });
        FX.burst(e.x, e.y, 30, 8, { speed: 150, size: 12, life: 0.8, shape: 'debris', color: '#f6c89a', g: 400, vz: 200, vr: 8 });
        A().sfx('poof', { x: e.x, pitch: 0.7 });
      } else if (e.kind === 'tower') {
        this.onTowerDestroyed(e);
      }
    }
    onTowerDestroyed(t) {
      const winner = 1 - t.team;
      const king = t.sub === 'king';
      const z = king ? 80 : 60;
      FX.screenShake(king ? 26 : 20);
      FX.screenFlash(king ? 0.8 : 0.5, '#ffffff');
      FX.doHitStop(0.12);
      FX.doSlowMo(king ? 1.2 : 0.7, 0.3);
      FX.hit('boom', t.x, t.y, z, king ? 2.4 : 1.8);
      FX.ring(t.x, t.y, 30, king ? 360 : 260, C.TEAM[winner].glow, 0.8, 10);
      FX.burst(t.x, t.y, z, king ? 40 : 26, { speed: 360, size: 20, life: 1.2, shape: ['star', 'sparkle', 'glowheart'], color: ['#ffe066', '#ffffff', C.TEAM[winner].glow, '#ff9fd0'], add: true, drag: 2, vz: 260, g: 320, vr: 10 });
      FX.burst(t.x, t.y, z, king ? 26 : 16, { speed: 260, size: 18, life: 1.3, shape: 'debris', color: king ? '#f4dde8' : '#f2e3d2', g: 520, vz: 340, vr: 10 });
      FX.burst(t.x, t.y, 20, 14, { speed: 160, size: 50, life: 1.5, shape: 'smoke', color: '#fff4fa', drag: 2, vz: 50, g: -15 });
      A().sfx(king ? 'castleDown' : 'towerDown');
      this.players[winner].stats.towers = (this.players[winner].stats.towers || 0) + 1;
      if (king) {
        this.announce(winner === 0 ? 'Castle Down!' : 'Castle Lost…', winner === 0 ? 'Three crowns!' : 'Your castle took a tumble', winner === 0 ? '#ffe066' : '#ff8fb5', 2.4);
        this.crowns[winner] = 3;
        this.end(winner, 'castle');
      } else {
        this.crowns[winner] = Math.min(3, this.crowns[winner] + 1);
        const own = this.structures.find((s) => s.team === t.team && s.sub === 'king' && !s.dead);
        if (own) own.wake();
        if (winner === 0) this.announce('Tower Down!', 'Deploy deeper on that side', '#79c4ff');
        else this.announce('Tower Lost!', 'Defend your castle!', '#ff8fb5');
        if (this.phase === 'overtime') this.end(winner, 'overtime');
      }
    }

    /* ---------------- rendering ---------------- */
    draw(ctx, overlay) {
      const t = this.clock;
      NK.ArenaArt.drawBg(ctx);
      NK.ArenaArt.drawAmbient(ctx, t);
      NK.ArenaArt.drawRiver(ctx, t);
      if (overlay) overlay.drawGround(ctx);
      for (const s of this.spells) s.drawGround(ctx);
      FX.drawGround(ctx);
      for (const s of this.structures) s.drawShadow(ctx);
      for (const u of this.units) u.drawShadow(ctx);
      // subtle tower targeting reticles
      for (const s of this.structures) {
        const tg = s.target;
        if (s.dead || !tg || tg.dead || !s.awake) continue;
        const X = C.toScreenX(tg.x), Y = C.toScreenY(tg.y);
        const r = tg.r * 1.45;
        ctx.save();
        ctx.globalAlpha = 0.55;
        ctx.translate(X, Y); ctx.scale(1, 0.5); ctx.rotate(t * 2);
        ctx.setLineDash([7, 6]);
        ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.lineWidth = 2.5; ctx.strokeStyle = C.TEAM[s.team].main; ctx.stroke();
        ctx.restore();
        ctx.save();
        ctx.globalAlpha = 0.14;
        ctx.setLineDash([4, 8]); ctx.lineDashOffset = -t * 30;
        ctx.beginPath(); ctx.moveTo(C.toScreenX(s.x), C.toScreenY(s.y) - (s.sub === 'king' ? 130 : s.sub === 'outer' ? 100 : 40));
        ctx.lineTo(X, Y - tg.z - 16); ctx.lineWidth = 2; ctx.strokeStyle = C.TEAM[s.team].glow; ctx.stroke();
        ctx.restore();
      }
      // depth-sorted ground layer
      const ground = [];
      for (const s of this.structures) ground.push(s);
      for (const u of this.units) if (!u.air) ground.push(u);
      ground.sort((a, b) => a.y - b.y);
      for (const e of ground) e.draw(ctx);
      const air = this.units.filter((u) => u.air).sort((a, b) => a.y - b.y);
      for (const u of air) u.draw(ctx);
      for (const p of this.projectiles) p.draw(ctx);
      FX.drawTop(ctx);
      for (const s of this.spells) s.drawTop(ctx);
      if (overlay) overlay.drawTop(ctx);
      for (const s of this.structures) s.drawBar(ctx);
      for (const u of this.units) u.drawBar(ctx);
      FX.drawNumbers(ctx);
    }
  }

  NK.Match = Match;
  NK.PlayerState = PlayerState;
})();

/* ---- 11_ai.js ---- */
/* =====================================================================
   EnemyAI: heuristic opponent. Reads threats per lane, counters with
   suitable cards, spends spells when value is high, builds pushes with
   tank + support, keeps a Nyanergy reserve based on its personality.
   Works for either team (team 0 used for autoplay testing).
   ===================================================================== */
'use strict';
(() => {
  const U = NK.U, C = NK.C;

  // value of a unit in "Nyanergy" (card cost split across copies)
  const unitValue = (() => {
    const map = {};
    for (const c of Object.values(NK.Cards)) if (c.unit) map[c.unit] = c.cost / c.count;
    map.ghostKit = 0.5;
    return (u) => (u.kind === 'unit' ? map[u.key] || 1 : u.kind === 'building' ? 3 : 0);
  })();
  const dps = (def) => def.attack.dmg / def.attack.rate;
  const WINCONS = ['tank', 'cannon', 'dragon', 'magical', 'witch'];
  const RANGED = (c) => c.type === 'unit' && NK.Units[c.unit].attack.range >= 150;

  class EnemyAI {
    constructor(M, team, opponent, diff) {
      this.M = M; this.team = team;
      this.w = Object.assign({ aggression: 0.6, patience: 8, spell: 1, splitLane: 0.3, defendEarly: 0.6 }, opponent.w || {});
      this.w.aggression = U.clamp(this.w.aggression * U.rand(0.85, 1.15), 0.2, 1);
      this.w.patience = U.clamp(this.w.patience + U.rand(-0.8, 0.8), 5.5, 9.8);
      this.diff = diff;
      this.thinkT = U.rand(1.0, 2.0);
      this.pushLane = Math.random() < 0.5 ? 0 : 1;
      this.lastPlay = -10;
      this.supported = new Set();
      this.dir = team === 1 ? 1 : -1;      // forward (toward enemy) in world y
    }
    get P() { return this.M.players[this.team]; }
    onMySide(y, margin = 0) { return this.team === 1 ? y < C.RIVER_Y + margin : y > C.RIVER_Y - margin; }
    myY(offsetFromRiver) { return this.team === 1 ? C.RIVER_TOP - offsetFromRiver : C.RIVER_BOT + offsetFromRiver; }

    update(dt) {
      this.thinkT -= dt;
      if (this.thinkT > 0) return;
      this.thinkT = U.rand(this.diff.react[0], this.diff.react[1]) * 0.6;
      if (this.M.clock - this.lastPlay < 0.7) return;
      this.think();
    }

    play(slot, x, y, jitter = true) {
      if (jitter && Math.random() < this.diff.mistakes) { x += U.rand(-110, 110); y += U.rand(-70, 70); }
      const r = this.M.playCard(this.team, slot, x, y);
      if (r.ok) { this.lastPlay = this.M.clock; this.thinkT = Math.max(this.thinkT, U.rand(0.5, 1.1)); }
      return r.ok;
    }

    think() {
      const M = this.M, P = this.P, team = this.team;
      if (M.phase !== 'battle' && M.phase !== 'overtime') return;
      const hand = P.hand.map((id, slot) => ({ id, slot, card: NK.Cards[id] }));
      const afford = hand.filter((h) => h.card.cost <= P.nrg + 1e-6);
      const enemies = M.units.filter((u) => u.team !== team && !u.dead);
      const mine = M.units.filter((u) => u.team === team && !u.dead);

      const threat = [0, 1].map(() => ({ value: 0, defense: 0, air: 0, swarm: 0, tank: 0, x: 0, y: 0, units: [], minDist: 9999 }));
      const myStructs = M.structures.filter((s) => s.team === team && !s.dead);
      for (const e of enemies) {
        if (!this.onMySide(e.y, 150)) continue;
        const L = e.x < C.WW / 2 ? 0 : 1, T = threat[L];
        const v = unitValue(e) * (0.4 + 0.6 * e.hp / e.maxHp);
        T.value += v; T.units.push(e);
        if (e.air) T.air += v;
        if (e.maxHp <= 360) T.swarm += v;
        if (e.def.targets === 'buildings' || e.maxHp >= 1800) T.tank += v;
        T.x += e.x * v; T.y += e.y * v;
        for (const s of myStructs) T.minDist = Math.min(T.minDist, U.dist(e.x, e.y, s.x, s.y));
      }
      for (const e of M.structures) {
        if (e.team === team || e.dead || e.kind !== 'building' || !this.onMySide(e.y, 0)) continue;
        const L = e.x < C.WW / 2 ? 0 : 1; threat[L].value += 2; threat[L].x += e.x * 2; threat[L].y += e.y * 2; threat[L].units.push(e); threat[L].minDist = Math.min(threat[L].minDist, 300);
      }
      for (const m of mine) {
        if (!this.onMySide(m.y, 60) || m.def.targets === 'buildings') continue;
        const L = m.x < C.WW / 2 ? 0 : 1;
        threat[L].defense += unitValue(m) * (m.hp / m.maxHp);
      }

      // 1) spells
      if (this.trySpells(afford, enemies, mine)) return;

      // 2) defense
      const net = threat.map((T) => T.value - T.defense * 0.85);
      const L = net[0] >= net[1] ? 0 : 1;
      const T = threat[L];
      if (T.value > 0 && net[L] >= 1.2) {
        const urgent = T.minDist < 560;
        if (urgent || Math.random() < this.w.defendEarly) {
          if (this.defend(T, L, afford)) return;
          if (P.nrg < 9.3) return; // wait for Nyanergy to defend
        }
      }

      // 3) support an existing push
      if (this.support(mine, afford)) return;

      // 4) start a push when rich enough
      const threshold = M.double || M.overtime ? this.w.patience - 2 : this.w.patience;
      if (P.nrg >= threshold || P.nrg >= 9.6) this.push(afford, hand);
    }

    /* ---------- spells ---------- */
    trySpells(afford, enemies, mine) {
      const M = this.M;
      for (const h of afford) {
        const c = h.card;
        if (c.type !== 'spell') continue;
        const sw = this.w.spell * (0.75 + this.diff.smart * 0.35);
        if (c.spell === 'star' || c.spell === 'thunder') {
          const lead = c.delay || 0.3;
          const cands = enemies.map((e) => [e.x + e.vx * lead, e.y + e.vy * lead]);
          for (const s of M.structures) if (s.team !== this.team && !s.dead) cands.push([s.x, s.y]);
          let best = null, bv = 0;
          for (const [cx, cy] of cands) {
            let v = 0, n = 0;
            for (const e of enemies) {
              const ex = e.x + e.vx * lead, ey = e.y + e.vy * lead;
              if (U.dist(ex, ey, cx, cy) > c.radius + e.r * 0.4) continue;
              const kill = Math.min(1, c.damage / Math.max(1, e.hp));
              v += unitValue(e) * (kill >= 1 ? 1 : kill * 0.7); n++;
              if (c.spell === 'thunder' && (e.def.attack.heavy || e.def.attack.kind === 'beam')) v += 0.8;
            }
            for (const s of M.structures) {
              if (s.team === this.team || s.dead) continue;
              if (U.dist(s.x, s.y, cx, cy) <= c.radius + s.r * 0.5) v += (c.damage * (s.kind === 'tower' ? c.towerMult : 1)) / (s.kind === 'tower' ? 260 : 150);
            }
            if (v > bv) { bv = v; best = [cx, cy, n]; }
          }
          const need = c.cost * (1.3 / sw) + (M.time < 20 && M.phase === 'battle' ? -1 : 0);
          if (best && bv >= need && (best[2] >= 1 || M.time < 15)) {
            return this.play(h.slot, best[0], best[1], false);
          }
        } else if (c.spell === 'blossom') {
          const hurt = mine.filter((u) => u.engaged && u.hp < u.maxHp * 0.7);
          if (hurt.length >= 2) {
            const cx = U.lerp(hurt[0].x, hurt[1].x, 0.5), cy = U.lerp(hurt[0].y, hurt[1].y, 0.5);
            let miss = 0; for (const u of mine) if (U.dist(u.x, u.y, cx, cy) < c.radius) miss += u.maxHp - u.hp;
            if (miss > 900 / sw) return this.play(h.slot, cx, cy, false);
          }
        } else if (c.spell === 'bubble') {
          const fighting = mine.filter((u) => u.engaged && u.state === 'active');
          if (fighting.length >= 2) {
            const f = fighting[0];
            let v = 0; for (const u of mine) if (U.dist(u.x, u.y, f.x, f.y) < c.radius) v += unitValue(u);
            if (v >= 5 / sw) return this.play(h.slot, f.x, f.y, false);
          }
        }
      }
      return false;
    }

    /* ---------- defense ---------- */
    defend(T, L, afford) {
      const M = this.M;
      const cx = T.x / T.value, cy = T.y / T.value;
      let best = null, bs = -1.5;
      for (const h of afford) {
        const c = h.card;
        if (c.type === 'spell' || c.id === 'shrine') continue;
        let s = 0;
        if (c.type === 'building') {
          s += T.tank > 0 ? 3 : 0.8;
          if (T.air > T.value * 0.5) s -= 4;
        } else {
          const def = NK.Units[c.unit];
          if (def.targets === 'buildings') continue;
          const canAir = def.targets === 'both';
          if (T.air > 0) s += canAir ? 2.2 : -4 * (T.air / T.value);
          if (T.swarm > 0 && def.attack.splash) s += 3;
          if (T.swarm > T.value * 0.5 && !def.attack.splash && def.hp < 700) s -= 1.5;
          if (T.tank > 0) { s += dps(def) * c.count / 110; if (c.id === 'kittens' || c.id === 'ninja') s += 1.2; }
          s += Math.min(2, def.hp / 900);
        }
        s -= Math.abs(c.cost - Math.min(T.value + 0.5, 6)) * 0.4;
        s += Math.random() * (1.2 - this.diff.smart) * 3;
        if (s > bs) { bs = s; best = h; }
      }
      if (!best) return false;
      const c = best.card;
      const laneX = C.LANE_X[L];
      const myOuter = M.structures.find((s) => s.team === this.team && s.sub === 'outer' && s.lane === L && !s.dead);
      let x, y;
      if (c.type === 'building') {
        x = C.WW / 2 + (L === 0 ? -80 : 80); y = this.myY(170);
      } else if (RANGED(c)) {
        if (myOuter) { x = laneX + (L === 0 ? 50 : -50); y = myOuter.y - this.dir * 70; }
        else { x = C.WW / 2 + (L === 0 ? -90 : 90); y = C.KING_Y[this.team] + this.dir * 120; }
      } else {
        const crossing = !this.onMySide(cy, 0);
        if (crossing) { x = laneX; y = this.myY(60); }
        else { x = cx; y = cy - this.dir * 55; }
        if (c.id === 'kittens' && T.tank > 0) { x = cx; y = cy - this.dir * 25; }
      }
      return this.play(best.slot, x, y);
    }

    /* ---------- support ---------- */
    support(mine, afford) {
      const P = this.P;
      if (P.nrg < 3.5) return false;
      const leaders = mine.filter((u) => u.state === 'active' && (u.def.targets === 'buildings' || u.maxHp >= 1400) && !this.supported.has(u.id));
      if (!leaders.length) return false;
      const lead = leaders[0];
      // only support while leader is still on our side or at the bridge
      const distRiver = Math.abs(lead.y - C.RIVER_Y);
      if (!this.onMySide(lead.y, 40) && distRiver > 120) { this.supported.add(lead.id); return false; }
      const opts = afford.filter((h) => h.card.type === 'unit' && NK.Units[h.card.unit].targets !== 'buildings');
      if (!opts.length) return false;
      opts.sort((a, b) => (RANGED(b.card) ? 2 : 0) + b.card.cost * 0.2 - ((RANGED(a.card) ? 2 : 0) + a.card.cost * 0.2) + U.rand(-1, 1));
      const h = opts[0];
      this.supported.add(lead.id);
      const y = this.onMySide(lead.y, 0) ? lead.y - this.dir * 60 : this.myY(40);
      return this.play(h.slot, lead.x + U.rand(-20, 20), y);
    }

    /* ---------- offense ---------- */
    push(afford, hand) {
      const M = this.M, P = this.P;
      if (!afford.length) return false;
      // lane choice: weaker enemy tower, occasionally switch
      const eOuter = [0, 1].map((L) => M.structures.find((s) => s.team !== this.team && s.sub === 'outer' && s.lane === L));
      const hpOf = (s) => (!s || s.dead ? -1 : s.hp / s.maxHp);
      let lane = hpOf(eOuter[0]) < hpOf(eOuter[1]) ? 0 : hpOf(eOuter[1]) < hpOf(eOuter[0]) ? 1 : this.pushLane;
      if (Math.random() < this.w.splitLane) lane = 1 - lane;
      this.pushLane = lane;
      const laneX = C.LANE_X[lane];
      const winCons = afford.filter((h) => WINCONS.includes(h.id));
      const cheap = afford.filter((h) => h.card.type === 'unit' && !WINCONS.includes(h.id));
      const shrine = afford.find((h) => h.id === 'shrine');
      if (shrine && M.phase === 'battle' && M.time > 50 && P.nrg >= 8 && Math.random() < 0.6) {
        return this.play(shrine.slot, C.WW / 2 + (lane === 0 ? 170 : -170), C.KING_Y[this.team] - this.dir * 20);
      }
      if (winCons.length) {
        const h = U.pick(winCons);
        const fromBack = P.nrg >= 9 && Math.random() > this.w.aggression && M.phase === 'battle' && !M.double;
        let x = laneX, y;
        if (h.id === 'cannon') y = this.myY(90);
        else if (fromBack) { x = U.lerp(laneX, C.WW / 2, 0.45); y = C.KING_Y[this.team] - this.dir * 60; }
        else y = this.myY(40);
        return this.play(h.slot, x, y);
      }
      if (cheap.length && (P.nrg >= 9.5 || Math.random() < this.w.aggression)) {
        cheap.sort((a, b) => a.card.cost - b.card.cost);
        const h = Math.random() < 0.6 ? cheap[0] : U.pick(cheap);
        const ranged = RANGED(h.card);
        return this.play(h.slot, laneX + U.rand(-30, 30), ranged ? this.myY(140) : this.myY(40));
      }
      // avoid wasting Nyanergy: cycle the cheapest non-spell card safely
      if (P.nrg >= 9.8) {
        const opts = afford.filter((h) => h.card.type !== 'spell').sort((a, b) => a.card.cost - b.card.cost);
        if (opts.length) return this.play(opts[0].slot, laneX, C.KING_Y[this.team] - this.dir * 40);
      }
      return false;
    }
  }

  NK.EnemyAI = EnemyAI;
  NK.unitValue = unitValue;
})();

/* ---- 12_ui.js ---- */
/* =====================================================================
   UI kit: chunky buttons, panels, sliders/toggles, card renderer with
   cached portraits, Nyanergy bar, crown slots, screen-space UI sparkles.
   ===================================================================== */
'use strict';
NK.UI = (() => {
  const U = NK.U, G = NK.G, C = NK.C, TAU = U.TAU, INK = C.INK;
  const UI = {};

  UI.mouse = { x: -999, y: -999, down: false, rdown: false };
  UI.cursor = 'default';

  /* ---------------- panels ---------------- */
  UI.panel = (ctx, x, y, w, h, o = {}) => {
    const r = o.r == null ? 24 : o.r;
    ctx.save();
    if (o.shadow !== false) {
      G.roundRect(ctx, x, y + (o.depth || 6), w, h, r);
      ctx.fillStyle = o.shadowCol || 'rgba(74,45,92,0.35)'; ctx.fill();
    }
    G.roundRect(ctx, x, y, w, h, r);
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, o.top || '#fff7fd'); g.addColorStop(1, o.bottom || '#f1e4ff');
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = o.lw || 4; ctx.strokeStyle = o.stroke || INK; ctx.stroke();
    if (o.highlight !== false) {
      G.roundRect(ctx, x + 6, y + 5, w - 12, Math.min(h * 0.4, 30), Math.max(4, r - 6));
      ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fill();
    }
    ctx.restore();
  };

  /* ---------------- buttons ---------------- */
  const STYLES = {
    primary: { top: '#ffb3d9', bottom: '#ff6fae', edge: '#c2427e', text: '#ffffff' },
    blue: { top: '#b8e4ff', bottom: '#5eb0ff', edge: '#2f6fc0', text: '#ffffff' },
    mint: { top: '#c8f7d9', bottom: '#5fd49a', edge: '#2f9a64', text: '#ffffff' },
    lilac: { top: '#e6d6ff', bottom: '#a98af0', edge: '#6c4fc0', text: '#ffffff' },
    sun: { top: '#fff1a8', bottom: '#ffc24d', edge: '#c98a1a', text: '#ffffff' },
    ghost: { top: '#fffafd', bottom: '#efe4fb', edge: '#b9a3d6', text: INK },
  };
  UI.STYLES = STYLES;
  class Button {
    constructor(o) {
      Object.assign(this, { x: 0, y: 0, w: 200, h: 64, label: '', style: 'primary', size: 28, icon: null, disabled: false, hotkey: null }, o);
      this.hoverT = 0; this.pressT = 0; this.hovered = false; this.pressed = false; this.appear = 0; this.delay = o.delay || 0;
    }
    contains(mx, my) { return mx >= this.x && mx <= this.x + this.w && my >= this.y && my <= this.y + this.h; }
    update(dt) {
      this.appear += dt;
      const m = UI.mouse;
      const h = !this.disabled && this.contains(m.x, m.y);
      if (h && !this.hovered) NK.Audio.sfx('hover');
      this.hovered = h;
      if (h) UI.cursor = 'pointer';
      this.hoverT = U.damp(this.hoverT, h ? 1 : 0, 14, dt);
      this.pressT = U.damp(this.pressT, this.pressed && h ? 1 : 0, 30, dt);
    }
    down(mx, my) { if (!this.disabled && this.contains(mx, my)) { this.pressed = true; return true; } return false; }
    up(mx, my) {
      const was = this.pressed; this.pressed = false;
      if (was && !this.disabled && this.contains(mx, my)) { NK.Audio.sfx('click'); if (this.onClick) this.onClick(); return true; }
      return false;
    }
    draw(ctx) {
      const st = STYLES[this.style] || STYLES.primary;
      const k = U.clamp((this.appear - this.delay) / 0.35, 0, 1);
      if (k <= 0) return;
      const pop = U.easeOutBack(k);
      const cx = this.x + this.w / 2, cy = this.y + this.h / 2;
      const s = pop * (1 + this.hoverT * 0.05 - this.pressT * 0.04) + Math.sin(this.hoverT * Math.PI) * 0.02;
      ctx.save();
      ctx.globalAlpha = k * (this.disabled ? 0.55 : 1);
      ctx.translate(cx, cy + this.pressT * 4); ctx.scale(s, s); ctx.translate(-cx, -cy);
      const depth = 7 * (1 - this.pressT);
      const r = Math.min(this.h / 2, 24);
      G.roundRect(ctx, this.x, this.y + depth, this.w, this.h, r);
      ctx.fillStyle = st.edge; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
      G.roundRect(ctx, this.x, this.y, this.w, this.h, r);
      const g = ctx.createLinearGradient(0, this.y, 0, this.y + this.h);
      g.addColorStop(0, st.top); g.addColorStop(1, st.bottom);
      ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
      G.roundRect(ctx, this.x + 8, this.y + 6, this.w - 16, this.h * 0.32, r * 0.6);
      ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fill();
      // sparkle on hover
      if (this.hoverT > 0.05) {
        ctx.globalAlpha = this.hoverT * k;
        const t = performance.now() / 1000;
        for (let i = 0; i < 2; i++) {
          const px = this.x + 18 + ((t * 0.5 + i * 0.5) % 1) * (this.w - 36), py = this.y + 8 + i * (this.h - 16);
          ctx.drawImage(G.tex('sparkle', '#ffffff'), px - 7, py - 7, 14, 14);
        }
        ctx.globalAlpha = k;
      }
      let tx = cx;
      if (this.icon) {
        const iw = this.size * 1.1;
        const tw = (ctx.font = G.font(this.size, 900, true), ctx.measureText(this.label).width);
        const total = iw + (this.label ? 12 + tw : 0);
        const ix = cx - total / 2 + iw / 2;
        G.icon(ctx, this.icon, ix, cy, this.size * 0.6, '#ffffff', INK);
        tx = ix + iw / 2 + 12 + tw / 2;
      }
      if (this.label) G.text(ctx, this.label, tx, cy + 1, { size: this.size, color: st.text, stroke: st.text === '#ffffff' ? INK : null, strokeW: 6, display: true, weight: 400 });
      if (this.hotkey) {
        ctx.font = G.font(15, 900);
        const hw = Math.max(30, ctx.measureText(this.hotkey).width + 16);
        G.roundRect(ctx, this.x + this.w - hw - 4, this.y - 12, hw, 26, 8); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
        G.text(ctx, this.hotkey, this.x + this.w - hw / 2 - 4, this.y + 1, { size: 15, color: INK, weight: 900 });
      }
      ctx.restore();
    }
  }
  UI.Button = Button;

  /* round icon button (pause etc.) */
  class IconButton extends Button {
    draw(ctx) {
      const cx = this.x + this.w / 2, cy = this.y + this.h / 2, r = this.w / 2;
      const s = 1 + this.hoverT * 0.08 - this.pressT * 0.06;
      ctx.save(); ctx.translate(cx, cy + this.pressT * 3); ctx.scale(s, s);
      ctx.beginPath(); ctx.arc(0, 5, r, 0, TAU); ctx.fillStyle = STYLES.lilac.edge; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
      const g = ctx.createLinearGradient(0, -r, 0, r); g.addColorStop(0, '#fff'); g.addColorStop(1, '#e3d4ff');
      ctx.fillStyle = g; ctx.fill(); ctx.stroke();
      if (this.icon === 'pause') {
        for (const dx of [-7, 7]) { G.roundRect(ctx, dx - 4.5, -12, 9, 24, 4); ctx.fillStyle = INK; ctx.fill(); }

  /* ---------------- slider & toggle ---------------- */
  class Slider {
    constructor(o) { Object.assign(this, { x: 0, y: 0, w: 360, label: '', value: 0.5 }, o); this.drag = false; this.hoverT = 0; }
    get h() { return 44; }
    contains(mx, my) { return mx >= this.x - 10 && mx <= this.x + this.w + 10 && my >= this.y - 12 && my <= this.y + 32; }
    update(dt) {
      const m = UI.mouse;
      const h = this.contains(m.x, m.y) || this.drag;
      if (h) UI.cursor = 'pointer';
      this.hoverT = U.damp(this.hoverT, h ? 1 : 0, 14, dt);
      if (this.drag) this.set((m.x - this.x) / this.w);
    }
    set(v) { v = U.clamp(v, 0, 1); if (Math.abs(v - this.value) > 0.001) { this.value = v; if (this.onChange) this.onChange(v); } }
    down(mx, my) { if (this.contains(mx, my)) { this.drag = true; this.set((mx - this.x) / this.w); return true; } return false; }
    up() { if (this.drag) { this.drag = false; NK.Audio.sfx('select'); } return false; }
    draw(ctx) {
      G.text(ctx, this.label, this.x, this.y - 22, { size: 22, color: INK, align: 'left', weight: 900 });
      G.text(ctx, Math.round(this.value * 100) + '%', this.x + this.w, this.y - 22, { size: 20, color: '#8a6fae', align: 'right', weight: 800 });
      G.roundRect(ctx, this.x, this.y, this.w, 20, 10); ctx.fillStyle = '#e8dcf8'; ctx.fill(); ctx.lineWidth = 3.5; ctx.strokeStyle = INK; ctx.stroke();
      if (this.value > 0.01) {
        G.roundRect(ctx, this.x, this.y, Math.max(20, this.w * this.value), 20, 10);
        const g = ctx.createLinearGradient(this.x, 0, this.x + this.w, 0); g.addColorStop(0, '#ffb3d9'); g.addColorStop(1, '#b58cff');
        ctx.fillStyle = g; ctx.fill(); ctx.stroke();
      }
      const kx = this.x + this.w * this.value, ky = this.y + 10;
      const r = 17 + this.hoverT * 3;
      ctx.beginPath(); ctx.arc(kx, ky + 3, r, 0, TAU); ctx.fillStyle = '#c2427e'; ctx.fill(); ctx.lineWidth = 3.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(kx, ky, r, 0, TAU); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.stroke();
      G.pawPath(ctx, kx, ky, r * 0.55); ctx.fillStyle = '#ff8fb5'; ctx.fill();
    }
  }

  class Toggle {
    constructor(o) { Object.assign(this, { x: 0, y: 0, label: '', value: true }, o); this.anim = this.value ? 1 : 0; this.hoverT = 0; }
    contains(mx, my) { return mx >= this.x && mx <= this.x + 440 && my >= this.y - 6 && my <= this.y + 42; }
    update(dt) {
      const m = UI.mouse; const h = this.contains(m.x, m.y);
      if (h) UI.cursor = 'pointer';
      this.hoverT = U.damp(this.hoverT, h ? 1 : 0, 14, dt);

    down(mx, my) { if (this.contains(mx, my)) { this.value = !this.value; NK.Audio.sfx(this.value ? 'select' : 'cancel'); if (this.onChange) this.onChange(this.value); return true; } return false; }
    up() { return false; }
    draw(ctx) {
      G.text(ctx, this.label, this.x, this.y + 18, { size: 22, color: INK, align: 'left', weight: 900 });
      const tx = this.x + 360, ty = this.y + 2, w = 76, h = 34;

  /* ---------------- card portraits ---------------- */
  const portraitCache = new Map();
  UI.portrait = (id, w, h, team = 0) => {

    if (c) return c;
    const R = 2;
    c = G.makeCanvas(w * R, h * R);
    const ctx = c.getContext('2d');
    ctx.scale(R, R);
    const card = NK.Cards[id];
    // background
    const bgs = {
      unit: ['#c9ecff', '#fff0fa'], spell: ['#5b3f9a', '#b07cf0'], building: ['#c8f7d9', '#fff7d6'],
    };
    const [a, b] = bgs[card.type];
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, a); g.addColorStop(1, b);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

    }

      const def = NK.Units[card.unit];
      const s = def.art.size;
      const zoom = (card.unit === 'tankCat' ? 1.25 : card.unit === 'kitten' ? 2.1 : card.unit === 'cannonCat' ? 1.35 : card.unit === 'dragonCat' ? 1.2 : 1.6) * (h / 104);
      const fy = h * 0.92 + (card.unit === 'kitten' ? 0 : 0);
      if (card.count > 1 && card.unit === 'kitten') {
        NK.CatArt.drawTo(ctx, card.unit, team, 'idle0', w * 0.3, fy - 4, zoom * 0.75, 1);
        NK.CatArt.drawTo(ctx, card.unit, team, 'idle0', w * 0.72, fy - 4, zoom * 0.75, 2);
        NK.CatArt.drawTo(ctx, card.unit, team, 'atk0', w * 0.5, fy + 6, zoom * 0.85, 0);
      } else if (card.count === 2) {
        NK.CatArt.drawTo(ctx, card.unit, team, 'idle0', w * 0.34, fy - 6, zoom * 0.8);
        NK.CatArt.drawTo(ctx, card.unit, team, 'atk0', w * 0.64, fy + 2, zoom * 0.88);
      } else {

      }
    } else if (card.type === 'building') {
      ctx.beginPath(); ctx.ellipse(w / 2, h * 0.98, w * 0.6, h * 0.22, 0, 0, TAU); ctx.fillStyle = 'rgba(130,210,140,0.7)'; ctx.fill();
      ctx.save(); ctx.translate(w / 2, h * 0.86); ctx.scale(h / 104 * 1.05, h / 104 * 1.05);
      if (card.building === 'yarnCannon') NK.StructArt.drawYarnCannon(ctx, 0, 0, team, { t: 0, atkT: 0, face: 1, aim: -0.5 });

    } else {

  function drawSpellArt(ctx, spell, w, h) {
    const cx = w / 2, cy = h / 2 + 4;

    if (spell === 'star') {
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(G.tex('glow', '#ffe066'), cx - 60, cy - 60, 120, 120);

      G.softStarPath(ctx, cx + 6, cy + 4, 34, 17); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
      const g = ctx.createRadialGradient(cx - 4, cy - 6, 2, cx + 6, cy + 4, 34); g.addColorStop(0, '#fff'); g.addColorStop(0.5, '#fff3a3'); g.addColorStop(1, '#ffc24d');
      ctx.fillStyle = g; ctx.fill();
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.ellipse(cx - 2, cy + 3, 2.6, 3.4, 0, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.ellipse(cx + 12, cy + 3, 2.6, 3.4, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 5, cy + 9, 3, 0.1, Math.PI - 0.1); ctx.lineWidth = 2; ctx.stroke();
    } else if (spell === 'blossom') {

      const fl = [[-22, 16, '#ffb3d9'], [20, 18, '#fff3a3'], [0, 6, '#ffffff'], [-8, 26, '#d9c8ff'], [28, 4, '#ffc2dc']];

    } else if (spell === 'thunder') {

        const g = ctx.createRadialGradient(cx + dx - r * 0.4, cy + dy - r * 0.4, 1, cx + dx, cy + dy, r);
        g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(0.5, 'rgba(190,235,255,0.5)'); g.addColorStop(0.85, 'rgba(255,190,240,0.6)'); g.addColorStop(1, 'rgba(160,240,255,0.9)');
        ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke();
      }

  /* ---------------- card renderer ---------------- */
  // o: {w,h, hotkey, afford (0..1), selected, hover, dim, t, wiggle}
  const faceCache = new Map();
  UI.drawCard = (ctx, id, x, y, o = {}) => {
    const card = NK.Cards[id];
    if (!card) return;
    const w = o.w || 136, h = o.h || 160, k = w / 136;
    const rar = NK.Rarity[card.rarity];
    const t = o.t || performance.now() / 1000;
    const key = id + '|' + Math.round(w) + 'x' + Math.round(h) + '|' + (o.team || 0);
    let face = faceCache.get(key);
    if (!face) {
      const R = 2, pad = Math.ceil(20 * k);
      face = G.makeCanvas((w + pad * 2) * R, (h + pad * 2) * R);
      face.pad = pad;
      const fc = face.getContext('2d');
      fc.scale(R, R); fc.translate(pad, pad);
      drawCardFace(fc, id, 0, 0, w, h, k, o.team || 0);
      faceCache.set(key, face);
    }
    ctx.save();
    // glow when selected
    if (o.selected) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.65 + Math.sin(t * 8) * 0.2;
      ctx.drawImage(G.tex('glow', '#9fd8ff'), x - 30 * k, y - 30 * k, w + 60 * k, h + 60 * k);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
    ctx.drawImage(face, x - face.pad, y - face.pad, w + face.pad * 2, h + face.pad * 2);
    if (rar.rainbow) {
      G.roundRect(ctx, x, y, w, h, 16 * k);
      const rg = ctx.createLinearGradient(x, y, x + w, y + h);
      const sh = (t * 0.3) % 1;
      ['#ff8fb5', '#ffd166', '#9fe89a', '#8fd0ff', '#c9a8ff', '#ff8fb5'].forEach((c, i) => rg.addColorStop(((i / 5) + sh) % 1, c));
      ctx.lineWidth = 5 * k; ctx.strokeStyle = rg; ctx.stroke();
      ctx.lineWidth = 2 * k; ctx.strokeStyle = INK; ctx.stroke();
    }
    if (o.selected) {
      G.roundRect(ctx, x, y, w, h, 16 * k); ctx.lineWidth = 4 * k; ctx.strokeStyle = '#ffffff'; ctx.stroke();
      G.roundRect(ctx, x - 4 * k, y - 4 * k, w + 8 * k, h + 8 * k, 19 * k); ctx.lineWidth = 3 * k; ctx.strokeStyle = INK; ctx.stroke();
    }
    // unaffordable veil
    if (o.afford != null && o.afford < 1) {
      ctx.save();
      G.roundRect(ctx, x, y, w, h, 16 * k); ctx.clip();
      const vh = h * (1 - o.afford);
      ctx.fillStyle = 'rgba(70,50,100,0.55)';
      ctx.fillRect(x, y, w, vh);
      ctx.fillStyle = 'rgba(70,50,100,0.18)';
      ctx.fillRect(x, y + vh, w, h - vh);
      ctx.beginPath(); ctx.moveTo(x, y + vh); ctx.lineTo(x + w, y + vh); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,170,230,0.9)'; ctx.stroke();
      ctx.restore();
      UI.costDrop(ctx, x + 4 * k, y + 6 * k, 21 * k, card.cost, false);
    }
    if (o.dim) { G.roundRect(ctx, x, y, w, h, 16 * k); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill(); }
    // hotkey
    if (o.hotkey) {
      const hx = x + w - 30 * k, hy = y + h - 30 * k;
      G.roundRect(ctx, hx, hy + 2, 26 * k, 26 * k, 8 * k); ctx.fillStyle = INK; ctx.fill();
      G.roundRect(ctx, hx, hy, 26 * k, 26 * k, 8 * k); ctx.fillStyle = o.selected ? '#ffe066' : '#ffffff'; ctx.fill(); ctx.lineWidth = 2.5 * k; ctx.strokeStyle = INK; ctx.stroke();
      G.text(ctx, o.hotkey, hx + 13 * k, hy + 14 * k, { size: 16 * k, color: INK, weight: 900 });
    }
    ctx.restore();
  };
  function drawCardFace(ctx, id, x, y, w, h, k, team) {
    const card = NK.Cards[id];
    const rar = NK.Rarity[card.rarity];
    // body
    G.roundRect(ctx, x, y + 6 * k, w, h, 16 * k); ctx.fillStyle = rar.edge; ctx.fill(); ctx.lineWidth = 4 * k; ctx.strokeStyle = INK; ctx.stroke();
    G.roundRect(ctx, x, y, w, h, 16 * k);
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, rar.a); g.addColorStop(1, rar.b);
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 4 * k; ctx.strokeStyle = INK; ctx.stroke();
    G.roundRect(ctx, x + 5 * k, y + 4 * k, w - 10 * k, 10 * k, 5 * k); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill();
    const o = { team };
    // portrait
    const px = x + 9 * k, py = y + 9 * k, pw = w - 18 * k, ph = 100 * k;
    const por = UI.portrait(id, Math.round(pw), Math.round(ph), o.team || 0);
    ctx.save();
    G.roundRect(ctx, px, py, pw, ph, 12 * k); ctx.clip();
    ctx.drawImage(por, px, py, pw, ph);
    ctx.restore();
    G.roundRect(ctx, px, py, pw, ph, 12 * k); ctx.lineWidth = 3 * k; ctx.strokeStyle = INK; ctx.stroke();
    // name plate
    const ny = y + 113 * k;
    G.roundRect(ctx, x + 7 * k, ny, w - 14 * k, 24 * k, 9 * k);
    ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.lineWidth = 2.5 * k; ctx.strokeStyle = INK; ctx.stroke();
    let fs = 16 * k;
    ctx.font = G.font(fs, 900);
    while (ctx.measureText(card.name).width > w - 24 * k && fs > 9) { fs -= 1; ctx.font = G.font(fs, 900); }
    G.text(ctx, card.name, x + w / 2, ny + 12.5 * k, { size: fs, color: INK, weight: 900 });
    // class line
    G.text(ctx, card.type === 'unit' ? card.cls + (card.count > 1 ? ' ×' + card.count : '') : card.type === 'spell' ? 'Spell' : 'Building', x + w / 2, y + h - 11 * k,
      { size: 11.5 * k, color: 'rgba(74,45,92,0.85)', weight: 800 });

  UI.clearCardCache = () => faceCache.clear();
  UI.costDrop = (ctx, x, y, s, cost, ok = true) => {
