    };
    path(); ctx.save(); ctx.translate(0, 3); ctx.fillStyle = INK; ctx.fill(); ctx.restore();
    path();
    const g = ctx.createLinearGradient(0, -s, 0, s);
    g.addColorStop(0, ok ? '#ffc2ef' : '#d9cde6'); g.addColorStop(1, ok ? '#e25bbf' : '#8c7ba3');
    ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-s * 0.3, -s * 0.2, s * 0.14, s * 0.24, -0.5, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fill();
    G.text(ctx, String(cost), 0, s * 0.3, { size: s * 1.05, color: '#ffffff', stroke: INK, strokeW: s * 0.28, display: true, weight: 400 });
    ctx.restore();
  };

  /* ---------------- crowns ---------------- */
  UI.crown = (ctx, x, y, s, filled, t = 0, color = '#ffd84a') => {
    ctx.save(); ctx.translate(x, y);
    const k = filled ? 1 + Math.max(0, Math.sin(t * 3)) * 0.04 : 1;
    ctx.scale(k, k);
    G.icon(ctx, 'crown', 0, 0, s, filled ? color : 'rgba(255,255,255,0.35)', filled ? INK : 'rgba(74,45,92,0.45)');
    if (filled) { ctx.beginPath(); ctx.arc(0, -s * 0.05, s * 0.14, 0, TAU); ctx.fillStyle = '#ff8fb5'; ctx.fill(); }
    ctx.restore();
  };

  /* ---------------- screen-space sparkles ---------------- */
  const uiParts = [];
  UI.spark = (x, y, o = {}) => {
    if (uiParts.length > 400) return;
    uiParts.push({ x, y, vx: o.vx || U.rand(-80, 80), vy: o.vy || U.rand(-120, -20), g: o.g == null ? 200 : o.g, life: o.life || 0.7, max: o.life || 0.7,
      size: o.size || 14, tex: G.tex(o.shape || 'sparkle', o.color || '#ffffff'), rot: Math.random() * TAU, vr: U.rand(-4, 4), add: o.add !== false, tx: o.tx, ty: o.ty });
  };
  UI.burst = (x, y, n, o = {}) => { for (let i = 0; i < n; i++) UI.spark(x, y, Object.assign({}, o, { color: Array.isArray(o.color) ? U.pick(o.color) : o.color, shape: Array.isArray(o.shape) ? U.pick(o.shape) : o.shape })); };
  UI.updateParts = (dt) => {
    for (let i = uiParts.length - 1; i >= 0; i--) {
      const p = uiParts[i];
      p.life -= dt;
      if (p.life <= 0) { uiParts.splice(i, 1); continue; }
      if (p.tx != null) {
        const k = 1 - p.life / p.max;
        p.x = U.lerp(p.x, p.tx, Math.min(1, dt * (2 + k * 10))); p.y = U.lerp(p.y, p.ty, Math.min(1, dt * (2 + k * 10)));
      } else {
        p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      }
      p.rot += p.vr * dt;
    }
  };
  UI.drawParts = (ctx) => {
    for (const p of uiParts) {
      const k = p.life / p.max;
      ctx.globalAlpha = Math.min(1, k * 2);
      ctx.globalCompositeOperation = p.add ? 'lighter' : 'source-over';
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      const s = p.size * (0.5 + k * 0.5);
      ctx.drawImage(p.tex, -s / 2, -s / 2, s, s);
      ctx.restore();
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  };
  UI.clearParts = () => { uiParts.length = 0; };

  /* ---------------- misc ---------------- */
  UI.title = (ctx, text, x, y, size, t = 0, o = {}) => {
    // bouncy per-letter display title
    ctx.font = G.font(size, 400, true);
    const letters = text.split('');
    const widths = letters.map((ch) => ctx.measureText(ch).width);
    const total = widths.reduce((a, b) => a + b, 0) + (letters.length - 1) * (o.spacing || 0);
    let cx = x - total / 2;
    const cols = o.colors || ['#ff8fb5', '#ffb86b', '#ffe066', '#7fd99f', '#79c4ff', '#b58cff'];
    letters.forEach((ch, i) => {
      const w = widths[i];
      const bob = o.bounce === false ? 0 : Math.sin(t * 3 + i * 0.45) * size * 0.05;
      const col = o.color || cols[i % cols.length];
      ctx.save(); ctx.translate(cx + w / 2, y + bob);
      if (o.wobble) ctx.rotate(Math.sin(t * 2 + i) * 0.04);
      G.text(ctx, ch, 0, 0, { font: G.font(size, 400, true), color: col, stroke: INK, strokeW: size * 0.2, shadow: 'rgba(74,45,92,0.55)', shadowOff: size * 0.1 });
      // gloss
      ctx.restore();
      cx += w + (o.spacing || 0);
    });
  };

  UI.keycap = (ctx, label, x, y, w = 44, h = 38) => {
    G.roundRect(ctx, x, y + 4, w, h, 9); ctx.fillStyle = '#b9a3d6'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
    G.roundRect(ctx, x, y, w, h, 9); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.stroke();
    G.text(ctx, label, x + w / 2, y + h / 2, { size: Math.min(18, h * 0.45), color: INK, weight: 900 });
  };

  return UI;
})();

/* ---- 13_matchscreen.js ---- */
/* =====================================================================
   MatchScreen: runs the simulation (fixed step, hit-stop, slow-mo),
   handles keyboard + mouse deployment, draws the HUD, card tray,
   deploy previews, pause menu and the results screen.
   ===================================================================== */
'use strict';
(() => {
  const U = NK.U, G = NK.G, C = NK.C, UI = NK.UI, FX = NK.FX, TAU = U.TAU, INK = C.INK;
  const A = () => NK.Audio;

  // tray geometry
  const CARD_W = 136, CARD_H = 160, GAP = 16;
  const TRAY = { x: 560, y: 866, w: 800, h: 220 };
  const HAND_X = 724, HAND_Y = 880;
  const NEXT = { x: 590, y: 912, w: 92, h: 108 };
  const BAR = { x: 724, y: 1050, w: 4 * CARD_W + 3 * GAP, h: 22 };
  const slotRect = (i) => ({ x: HAND_X + i * (CARD_W + GAP), y: HAND_Y, w: CARD_W, h: CARD_H });

  class MatchScreen {
    constructor(opts) {
      this.opts = opts;
    }
    enter() {
      const o = this.opts;
      const opponent = o.opponent || U.pick(NK.Opponents);
      this.opponent = opponent;
      this.difficulty = o.difficulty != null ? o.difficulty : NK.Settings.get('difficulty');
      this.deck = o.deck || NK.getDeck();
      FX.clear(); UI.clearParts();
      this.M = new NK.Match({ playerDeck: this.deck, opponent, difficulty: this.difficulty, autoPlayer: !!NK.autoPlayer });
      this.acc = 0;
      this.sel = -1; this.drag = null; this.pressSlot = -1;
      this.hv = [0, 0, 0, 0]; this.sl = [0, 0, 0, 0]; this.wg = [0, 0, 0, 0];
      this.nrgShown = this.M.players[0].nrg; this.lastNrg = this.M.players[0].nrg;
      this.spendFx = []; this.barShake = 0; this.toast = null;
      this.paused = false; this.pauseT = 0; this.settingsOpen = false;
      this.resultShown = false; this.resultT = 0;
      this.showRanges = false;
      this.t = 0; this.lastCount = 4;
      this.introBeeps = 0;
      this.hoverUnit = null;
      this.leader = this.pickLeader(opponent.deck);
      this.myLeader = this.pickLeader(this.deck);
      this.pauseBtn = new UI.IconButton({ x: 1850, y: 42, w: 56, h: 56, icon: 'pause', onClick: () => this.setPaused(true) });
      this.pauseButtons = [
        new UI.Button({ x: 760, y: 430, w: 400, h: 76, label: 'Resume', style: 'mint', size: 32, hotkey: 'Esc', onClick: () => this.setPaused(false) }),
        new UI.Button({ x: 760, y: 528, w: 400, h: 70, label: 'Settings', style: 'lilac', size: 28, delay: 0.05, onClick: () => { this.settingsOpen = true; this.settings = new NK.SettingsPanel(() => { this.settingsOpen = false; }); } }),
        new UI.Button({ x: 760, y: 620, w: 400, h: 70, label: 'Leave Battle', style: 'primary', size: 28, delay: 0.1, onClick: () => NK.Game.go(new NK.MenuScreen()) }),
      ];
      this.resultButtons = [
        new UI.Button({ x: 640, y: 880, w: 300, h: 80, label: 'Rematch', style: 'mint', size: 32, hotkey: 'R', onClick: () => NK.Game.go(new MatchScreen({ difficulty: this.difficulty, opponent: this.opponent })) }),
        new UI.Button({ x: 980, y: 880, w: 300, h: 80, label: 'Main Menu', style: 'lilac', size: 30, onClick: () => NK.Game.go(new NK.MenuScreen()) }),
      ];
      A().music('battle');
    }
    exit() { A().setIntensity(0); }
    pickLeader(deck) {
      const pri = ['magical', 'dragon', 'witch', 'tank', 'angel', 'mage', 'cannon', 'ninja', 'frost', 'sword', 'archers', 'kittens'];
      for (const id of pri) if (deck.includes(id)) return NK.Cards[id].unit;
      return 'swordCat';
    }
    setPaused(p) {
      if (this.M.phase === 'ended') return;
      this.paused = p; this.pauseT = 0; this.settingsOpen = false;
      for (const b of this.pauseButtons) b.appear = 0;
      A().sfx(p ? 'select' : 'cancel');
      if (p) this.cancelSel(true);
    }

    /* ---------------- update ---------------- */
    update(dt) {
      this.t += dt;
      const M = this.M;
      UI.updateParts(dt);
      if (this.paused) {
        this.pauseT += dt;
        if (this.settingsOpen) this.settings.update(dt);
        else for (const b of this.pauseButtons) b.update(dt);
        return;
      }
      this.pauseBtn.update(dt);
      // time scaling (hit-stop & slow motion)
      let scale = 1;
      if (FX.hitStop > 0) { FX.hitStop -= dt; scale = 0; }
      else if (FX.slowMoT > 0) {
        FX.slowMoT -= dt;
        scale = U.lerp(1, FX.slowMo, U.clamp(FX.slowMoT / 0.4, 0, 1));
      }
      const speed = NK.testSpeed || 1;
      const simDt = dt * scale * speed;
      this.acc += simDt;
      let steps = 0;
      const maxSteps = speed > 1 ? 40 : 6;
      if (NK.freeze) this.acc = 0;
      while (this.acc >= C.SIM_DT && steps < maxSteps) { M.update(C.SIM_DT); this.acc -= C.SIM_DT; steps++; }
      if (steps >= maxSteps) this.acc = 0;
      if (!NK.freeze) FX.update(simDt, dt);
      if (M.phase !== 'ended' && !NK.freeze) FX.ambient(simDt);
      A().setIntensity(M.double || M.overtime ? 1 : 0);

      // intro countdown beeps
      if (M.phase === 'intro') {
        const n = Math.ceil(M.introT - 0.2);
        if (n !== this.lastCount && n >= 1 && n <= 3) { this.lastCount = n; A().sfx('countdown'); }
      }
      // last-10-seconds ticks
      if ((M.phase === 'battle' || M.phase === 'overtime') && M.time <= 10) {
        const s = Math.ceil(M.time);
        if (s !== this.lastTick) { this.lastTick = s; A().sfx('tick'); }
      }

      // nyanergy display & spend fx
      const P = M.players[0];
      if (P.nrg < this.lastNrg - 0.5) {
        const spent = Math.round(this.lastNrg - P.nrg);
        this.spendFx.push({ from: this.lastNrg, to: P.nrg, t: 0, amt: spent });
      } else if (P.nrg > this.lastNrg + 0.5) {
        // shrine bonus
        UI.burst(BAR.x + BAR.w * (P.nrg / 10), BAR.y + 10, 10, { color: ['#ff8fd6', '#ffffff'], size: 16, g: 60 });
      }
      if (Math.floor(P.nrg) > Math.floor(this.lastNrg) && P.nrg > this.lastNrg && P.nrg - this.lastNrg < 0.5) {
        // gained a full point: tiny sparkle at that segment
        const seg = Math.floor(P.nrg) - 1;
        const sx = BAR.x + (seg + 0.5) * (BAR.w / 10);
        UI.burst(sx, BAR.y + 10, 3, { color: '#ffd6f5', size: 12, vy: -60, g: 80, life: 0.5 });
      }
      this.lastNrg = P.nrg;
      this.nrgShown = U.damp(this.nrgShown, P.nrg, 20, dt);
      for (const s of this.spendFx) s.t += dt;
      this.spendFx = this.spendFx.filter((s) => s.t < 0.8);
      this.barShake = Math.max(0, this.barShake - dt);
      if (this.toast) { this.toast.t += dt; if (this.toast.t > 1.4) this.toast = null; }

      // card springs
      const m = UI.mouse;
      for (let i = 0; i < 4; i++) {
        const r = slotRect(i);
        const hov = M.phase !== 'ended' && m.x >= r.x && m.x <= r.x + r.w && m.y >= r.y - 10 && m.y <= r.y + r.h;
        if (hov && this.hv[i] < 0.05 && !this.drag) A().sfx('hover');
        if (hov) UI.cursor = 'pointer';
        this.hv[i] = U.damp(this.hv[i], hov && !this.drag ? 1 : 0, 16, dt);
        this.sl[i] = U.damp(this.sl[i], this.sel === i ? 1 : 0, 14, dt);
        this.wg[i] = Math.max(0, this.wg[i] - dt);
        if (P.drawT[i] > 0.02 && P.drawT[i] - dt <= 0.02) A().sfx('cardDraw');
      }
      // selection invalid if card changed under us
      if (this.sel >= 0 && P.hand[this.sel] !== this.selId) this.cancelSel(true);

      // world mouse + hover unit
      this.mw = { x: C.toWorldX(m.x), y: C.toWorldY(m.y) };
      this.inArena = m.x >= C.AX && m.x <= C.AX + C.WW * C.SX && m.y >= C.AY - 20 && m.y <= C.AY + C.WH * C.SY && !this.overTray(m.x, m.y);
      if (this.hoverUnit) this.hoverUnit.hover = false;
      this.hoverUnit = null;
      if (this.inArena && this.sel < 0) {
        let best = null, bd = 40;
        for (const u of M.units) {
          const d = Math.hypot(C.toScreenX(u.x) - m.x, C.toScreenY(u.y) - u.z - 22 * u.size - m.y);
          if (d < bd) { bd = d; best = u; }
        }
        if (best) { best.hover = true; this.hoverUnit = best; }
      }

      // result
      if (M.phase === 'ended' && M.endT > 2.4 && !this.resultShown) {
        this.resultShown = true; this.resultT = 0;
        this.cancelSel(true);
        const w = M.result.winner;
        A().stopMusic();
        A().sfx(w === 0 ? 'victory' : 'defeat');
        if (w === 0 && NK.Settings.get('meows')) setTimeout(() => A().meow(1.2, 0.6), 700);
        for (const b of this.resultButtons) b.appear = 0;
      }
      if (this.resultShown) {
        this.resultT += dt;
        for (const b of this.resultButtons) b.update(dt);
        if (M.result.winner === 0 && this.resultT < 4 && Math.random() < dt * 40) {
          UI.spark(U.rand(0, C.VW), -20, { vx: U.rand(-40, 40), vy: U.rand(60, 160), g: 60, life: 4, size: U.rand(14, 22), shape: 'confetti', color: U.pick(['#ff8fb5', '#ffd166', '#7fd99f', '#79c4ff', '#b58cff', '#ffffff']), add: false });
        }
      }
    }
    overTray(mx, my) { return mx >= TRAY.x && mx <= TRAY.x + TRAY.w && my >= TRAY.y - 6; }

    /* ---------------- input ---------------- */
    selectSlot(i, fromKey) {
      const M = this.M, P = M.players[0];
      if (M.phase === 'ended') return;
      if (this.sel === i && fromKey) { this.cancelSel(); return; }
      this.sel = i; this.selId = P.hand[i];
      A().sfx('select');
      const r = slotRect(i);
      UI.burst(r.x + r.w / 2, r.y + 20, 6, { color: ['#ffffff', '#9fd8ff', '#ffe066'], size: 14, g: 120 });
      if (P.nrg < NK.Cards[P.hand[i]].cost) this.wg[i] = 0.25;
    }
    cancelSel(silent) {
      if (this.sel >= 0 && !silent) A().sfx('cancel');
      this.sel = -1; this.selId = null; this.drag = null;
    }
    tryDeploy() {
      const M = this.M, P = M.players[0];
      if (this.sel < 0) return false;
      const card = NK.Cards[P.hand[this.sel]];
      if (M.phase === 'intro') { this.showToast('Get ready…'); return false; }
      if (P.nrg < card.cost) {
        this.wg[this.sel] = 0.4; this.barShake = 0.35;
        this.showToast(`Need ${Math.ceil(card.cost - P.nrg)} more Nyanergy!`);
        A().sfx('deny');
        return false;
      }
      const slot = this.sel;
      const r = M.playCard(0, slot, this.mw.x, this.mw.y);
      if (r.ok) {
        // sparkles fly from bar to the deploy point
        const tx = C.toScreenX(r.x), ty = C.toScreenY(r.y);
        for (let i = 0; i < 8; i++) {
          const sx = BAR.x + BAR.w * (P.nrg / 10) + U.rand(0, BAR.w * card.cost / 10);
          UI.spark(sx, BAR.y + 10, { tx, ty, life: U.rand(0.35, 0.55), size: 16, color: U.pick(['#ff8fd6', '#ffffff', '#ffd6f5']) });
        }
        this.sel = -1; this.selId = null;
        return true;
      }
      A().sfx('deny');
      return false;
    }
    showToast(text) { this.toast = { text, t: 0 }; }

    onDown(mx, my, btn) {
      const M = this.M;
      if (this.resultShown) { if (btn === 0) for (const b of this.resultButtons) b.down(mx, my); return; }
      if (this.paused) {
        if (btn !== 0) return;
        if (this.settingsOpen) this.settings.down(mx, my);
        else for (const b of this.pauseButtons) b.down(mx, my);
        return;
      }
      if (btn === 2) { this.cancelSel(); return; }
      if (btn !== 0) return;
      if (this.pauseBtn.down(mx, my)) return;
      if (M.phase === 'ended') return;
      for (let i = 0; i < 4; i++) {
        const r = slotRect(i);
        if (mx >= r.x && mx <= r.x + r.w && my >= r.y - 10 && my <= r.y + r.h) {
          if (this.sel !== i) this.selectSlot(i, false);
          this.drag = { slot: i, x0: mx, y0: my, moved: false };
          return;
        }
      }
      if (this.sel >= 0 && this.inArena) this.tryDeploy();
    }
    onUp(mx, my, btn) {
      if (this.resultShown) { if (btn === 0) for (const b of this.resultButtons) b.up(mx, my); return; }
      if (this.paused) {
        if (btn !== 0) return;
        if (this.settingsOpen) this.settings.up(mx, my);
        else for (const b of this.pauseButtons) b.up(mx, my);
        return;
      }
      if (btn !== 0) return;
      this.pauseBtn.up(mx, my);
      if (this.drag) {
        const d = this.drag;
        this.drag = null;
        if (d.moved && this.inArena) this.tryDeploy();
      }
    }
    onMove(mx, my) {
      if (this.drag && Math.hypot(mx - this.drag.x0, my - this.drag.y0) > 14) this.drag.moved = true;
      if (this.paused && this.settingsOpen) this.settings.move && this.settings.move(mx, my);
    }
    onKey(key, e) {
      if (this.resultShown) {
        if (key === 'r' || key === 'R' || key === 'Enter') this.resultButtons[0].onClick();
        if (key === 'Escape') this.resultButtons[1].onClick();
        return;
      }
      if (key === 'Escape') {
        if (this.paused) { if (this.settingsOpen) this.settingsOpen = false; else this.setPaused(false); }
        else if (this.sel >= 0) this.cancelSel();
        else this.setPaused(true);
        return;
      }
      if (this.paused) return;
      if (key === 'p' || key === 'P') { this.setPaused(true); return; }
      if (key >= '1' && key <= '4') { this.selectSlot(+key - 1, true); return; }
      if (key === ' ') { this.showRanges = true; if (e) e.preventDefault(); }
    }
    onKeyUp(key) { if (key === ' ') this.showRanges = false; }

    /* ---------------- world overlays (deploy preview) ---------------- */
    drawGround(ctx) {
      const M = this.M;
      if (this.showRanges) this.drawRanges(ctx);
      if (this.hoverUnit && this.hoverUnit.def.attack.range > 60) this.drawRange(ctx, this.hoverUnit.x, this.hoverUnit.y, this.hoverUnit.def.attack.range + this.hoverUnit.r, C.TEAM[this.hoverUnit.team].glow, 0.7);
      if (this.sel < 0 || this.paused || M.phase === 'ended') return;
      const P = M.players[0];
      const card = NK.Cards[P.hand[this.sel]];
      if (!card) return;
      const t = this.t;
      if (card.type !== 'spell') {
        // forbidden territory (hatched rose)
        ctx.save();
        const zones = M.zonesFor(0);
        const FX0 = C.AX, FY0 = C.AY;
        const clipPath = new Path2D();
        clipPath.rect(FX0, FY0, C.WW * C.SX, C.WH * C.SY);
        for (const z of zones) clipPath.rect(C.toScreenX(z.x1), C.toScreenY(z.y0), -(z.x1 - z.x0) * C.SX, (z.y1 - z.y0) * C.SY);
        ctx.clip(clipPath, 'evenodd');
        ctx.fillStyle = 'rgba(255,90,140,0.13)';
        ctx.fillRect(FX0, FY0, C.WW * C.SX, C.WH * C.SY);
        ctx.strokeStyle = 'rgba(255,90,140,0.22)'; ctx.lineWidth = 6;
        const off = (t * 30) % 40;
        ctx.beginPath();
        for (let x = FX0 - 800 + off; x < FX0 + C.WW * C.SX; x += 40) { ctx.moveTo(x, FY0 + C.WH * C.SY); ctx.lineTo(x + 800, FY0); }
        ctx.stroke();
        ctx.restore();
        // allowed zones
        for (const z of zones) {
          const x = C.toScreenX(z.x0), y = C.toScreenY(z.y0), w = (z.x1 - z.x0) * C.SX, h = (z.y1 - z.y0) * C.SY;
          G.roundRect(ctx, x, y, w, h, 14);
          ctx.fillStyle = 'rgba(110,190,255,0.12)'; ctx.fill();
          ctx.setLineDash([14, 10]); ctx.lineDashOffset = -t * 40;
          ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(120,200,255,0.85)'; ctx.stroke();
          ctx.setLineDash([]);
        }
      }
      if (!this.inArena) return;
      const pos = M.clampDeploy(0, card, this.mw.x, this.mw.y);
      this.ghostPos = pos;
      const X = C.toScreenX(pos.x), Y = C.toScreenY(pos.y);
      const col = P.nrg >= card.cost ? '#79c4ff' : '#c9b6e6';
      if (card.type === 'spell') {
        const r = card.radius;
        ctx.save();
        ctx.beginPath(); ctx.ellipse(X, Y, r * C.SX, r * C.SY, 0, 0, TAU);
        ctx.fillStyle = U.rgba(col, 0.18); ctx.fill();
        ctx.setLineDash([12, 8]); ctx.lineDashOffset = -t * 30; ctx.lineWidth = 3.5; ctx.strokeStyle = col; ctx.stroke(); ctx.setLineDash([]);
        ctx.translate(X, Y); ctx.scale(C.SX, C.SY); ctx.rotate(t * 1.2);
        G.starPath(ctx, 0, 0, r * 0.85, r * 0.35, 5); ctx.lineWidth = 2; ctx.strokeStyle = U.rgba(col, 0.6); ctx.stroke();
        ctx.restore();
      } else {
        const def = card.type === 'unit' ? NK.Units[card.unit] : NK.Structures[card.building];
        const range = def.attack ? def.attack.range : 0;
        if (range > 60) this.drawRange(ctx, pos.x, pos.y, range + def.r, col, 0.9);
        ctx.save();
        ctx.translate(X, Y); ctx.scale(C.SX, C.SY); ctx.rotate(-t * 2);
        ctx.globalAlpha = 0.9;
        ctx.beginPath(); ctx.arc(0, 0, def.r * 1.6 + 8, 0, TAU); ctx.lineWidth = 3; ctx.strokeStyle = col; ctx.stroke();
        G.starPath(ctx, 0, 0, def.r * 1.5 + 6, def.r * 0.7, 5); ctx.lineWidth = 2; ctx.stroke();
        ctx.restore();
      }
    }
    drawRange(ctx, x, y, r, col, a = 0.8) {
      ctx.save();
      ctx.globalAlpha = a;
      ctx.beginPath(); ctx.ellipse(C.toScreenX(x), C.toScreenY(y), r * C.SX, r * C.SY, 0, 0, TAU);
      ctx.fillStyle = U.rgba(col, 0.08); ctx.fill();
      ctx.setLineDash([10, 9]); ctx.lineDashOffset = -this.t * 20;
      ctx.lineWidth = 2.5; ctx.strokeStyle = col; ctx.stroke();
      ctx.restore();
    }
    drawRanges(ctx) {
      for (const s of this.M.structures) {
        if (s.dead || !s.def.attack) continue;
        this.drawRange(ctx, s.x, s.y, s.def.attack.range + s.r, C.TEAM[s.team].glow, s.awake ? 0.9 : 0.4);
      }
      for (const u of this.M.units) if (u.def.attack.range > 60) this.drawRange(ctx, u.x, u.y, u.def.attack.range + u.r, C.TEAM[u.team].glow, 0.5);
    }
    drawTop(ctx) {
      const M = this.M;
      if (this.sel < 0 || !this.inArena || !this.ghostPos || this.paused || M.phase === 'ended') return;
      const P = M.players[0];
      const card = NK.Cards[P.hand[this.sel]];
      if (!card) return;
      const pos = this.ghostPos;
      const X = C.toScreenX(pos.x), Y = C.toScreenY(pos.y);
      const ok = P.nrg >= card.cost;
      ctx.save();
      ctx.globalAlpha = ok ? 0.62 : 0.38;
      const bob = Math.sin(this.t * 5) * 3;
      if (card.type === 'unit') {
        const def = NK.Units[card.unit];
        const form = { 1: [[0, 0]], 2: [[-24, 0], [24, 0]], 3: [[0, -18], [-21, 14], [21, 14]], 4: [[-17, -15], [17, -15], [-17, 15], [17, 15]] }[card.count];
        const sorted = form.slice().sort((a, b) => a[1] - b[1]);
        for (const [ox, oy] of sorted) {
          const gx = C.toScreenX(pos.x + ox), gy = C.toScreenY(pos.y + oy) - (def.air ? 48 : 0) - 6 + bob;
          NK.CatArt.drawTo(ctx, card.unit, 0, 'idle0', gx, gy, 1, card.unit === 'kitten' ? form.findIndex((f) => f[0] === ox && f[1] === oy) : 0);
        }
      } else if (card.type === 'building') {
        ctx.translate(X, Y + bob);
        if (card.building === 'yarnCannon') NK.StructArt.drawYarnCannon(ctx, 0, 0, 0, { t: this.t, atkT: 0, face: 1, aim: -Math.PI / 2 });
        else NK.StructArt.drawShrine(ctx, 0, 0, 0, { t: this.t, genP: 0.3 });
      } else {
        G.icon(ctx, card.icon, X, Y - 40 + bob, 24, '#ffffff', INK);
      }
      ctx.restore();
      if (!ok) {
        const need = Math.ceil(card.cost - P.nrg);

        const rows = [['1–4', 'Select card'], ['LMB', 'Deploy / drag card'], ['RMB', 'Cancel'], ['Space', 'Hold: show ranges'], ['Esc', 'Cancel / Pause']];

    drawPlayerPanel(ctx, x, y, name, sub, team, crowns, leader) {

    drawTray(ctx) {
      const M = this.M, P = M.players[0], t = this.t;
      // tray panel
      ctx.save();
      G.roundRect(ctx, TRAY.x, TRAY.y, TRAY.w, TRAY.h + 600, 30);

      ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
      G.roundRect(ctx, TRAY.x + 8, TRAY.y + 6, TRAY.w - 16, 22, 12); ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();

      ctx.save();
      const ns = U.easeOutBack(nk);
      ctx.translate(NEXT.x + NEXT.w / 2, NEXT.y + NEXT.h / 2); ctx.scale(ns, ns); ctx.translate(-(NEXT.x + NEXT.w / 2), -(NEXT.y + NEXT.h / 2));
      UI.drawCard(ctx, P.next, NEXT.x, NEXT.y, { w: NEXT.w, h: NEXT.h * 1.0, dim: true, t });
      ctx.restore();

      for (const i of order) this.drawHandCard(ctx, i);

    }
    drawHandCard(ctx, i) {
      const M = this.M, P = M.players[0];
      const id = P.hand[i];
      const card = NK.Cards[id];
      const r = slotRect(i);
      let x = r.x, y = r.y, s = 1, alpha = 1;
      const dT = P.drawT[i];
      if (dT < 0.42) {
        const k = U.clamp(dT / 0.42, 0, 1);
        const e = U.easeOutBack(k, 1.4);
        x = U.lerp(NEXT.x, r.x, U.easeOutCubic(k)); y = U.lerp(NEXT.y, r.y, U.easeOutCubic(k)) - Math.sin(k * Math.PI) * 40;
        s = U.lerp(0.66, 1, e); alpha = dT <= 0 ? 0 : Math.min(1, k * 3);
      }
      const lift = this.hv[i] * 8 + this.sl[i] * 22 + (this.sel === i ? Math.sin(this.t * 4) * 2 : 0);
      s *= 1 + this.hv[i] * 0.06 + this.sl[i] * 0.03;
      if (this.wg[i] > 0) x += Math.sin(this.wg[i] * 70) * 7 * (this.wg[i] / 0.4);
      const dragging = this.drag && this.drag.slot === i && this.drag.moved;
      ctx.save();
      ctx.globalAlpha = alpha * (dragging && this.inArena ? 0.45 : 1);
      const cx = x + r.w / 2, by = y + r.h;
      ctx.translate(cx, by - lift); ctx.scale(s, s); ctx.translate(-cx, -by);
      UI.drawCard(ctx, id, x, y, { w: r.w, h: r.h, hotkey: String(i + 1), afford: Math.min(1, P.nrg / card.cost), selected: this.sel === i, t: this.t });
      ctx.restore();
      // floating sparkles on selected
      if (this.sel === i && Math.random() < 0.3) UI.spark(x + U.rand(0, r.w), y - lift + U.rand(0, r.h * 0.3), { vy: -40, g: -20, life: 0.6, size: 12, color: U.pick(['#ffffff', '#9fd8ff', '#ffe066']) });
    }
    drawBar(ctx) {
      const M = this.M, P = M.players[0], t = this.t;
      const sh = this.barShake > 0 ? Math.sin(this.barShake * 80) * 6 * (this.barShake / 0.35) : 0;
      const x = BAR.x + sh, y = BAR.y, w = BAR.w, h = BAR.h;
      const segW = w / 10;
      G.roundRect(ctx, x - 3, y - 3, w + 6, h + 6, (h + 6) / 2); ctx.fillStyle = INK; ctx.fill();
      G.roundRect(ctx, x, y, w, h, h / 2); ctx.fillStyle = '#4b3268'; ctx.fill();
      const n = this.nrgShown;
      const rainbow = M.double || M.overtime;
      if (n > 0.01) {
        ctx.save();
        G.roundRect(ctx, x, y, w, h, h / 2); ctx.clip();
        const g = ctx.createLinearGradient(x, 0, x + w, 0);
        if (rainbow) {
          const s0 = (t * 0.3) % 1;
          ['#ff8fd6', '#ffb86b', '#ffe066', '#9fe89a', '#79c4ff', '#c9a8ff', '#ff8fd6'].forEach((c, i) => g.addColorStop(((i / 6) + s0) % 1, c));
        } else { g.addColorStop(0, '#ff9fe0'); g.addColorStop(1, '#c46cf0'); }
        ctx.fillStyle = g;
        ctx.fillRect(x, y, segW * Math.floor(n), h);
        // partial (charging) segment
        const frac = n - Math.floor(n);
        ctx.globalAlpha = 0.45;
        ctx.fillRect(x + segW * Math.floor(n), y, segW * frac, h);
        ctx.globalAlpha = 1;
        // gloss
        ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x, y + 2, segW * n, h * 0.3);
        // leading glow
        ctx.globalCompositeOperation = 'lighter';
        ctx.drawImage(G.tex('glow', '#ffd6f5'), x + segW * n - 20, y - 18, 40, 58);
        ctx.globalCompositeOperation = 'source-over';
        ctx.restore();
      }
      // spend flashes
      for (const s of this.spendFx) {
        const k = s.t / 0.8;
        ctx.globalAlpha = 1 - k;
        G.roundRect(ctx, x + segW * s.to, y - k * 6, segW * (s.from - s.to), h, h / 2);
        ctx.fillStyle = '#ffffff'; ctx.fill();
        G.text(ctx, '-' + s.amt, x + segW * (s.to + s.from) / 2, y + h / 2, { size: 22 * (1 + (1 - k) * 0.3), color: '#ffffff', stroke: INK, strokeW: 5, display: true });
        ctx.globalAlpha = 1;
      }
      // segment dividers
      ctx.strokeStyle = 'rgba(74,45,92,0.55)'; ctx.lineWidth = 2;
      for (let i = 1; i < 10; i++) { ctx.beginPath(); ctx.moveTo(x + i * segW, y + 3); ctx.lineTo(x + i * segW, y + h - 3); ctx.stroke(); }
      // count bubble
      const full = P.nrg >= 9.999;
      const bx = x - 28, by = y + h / 2 - 2;
      const pop = full ? 1 + Math.sin(t * 6) * 0.06 : 1;
      ctx.save(); ctx.translate(bx, by); ctx.scale(pop, pop);
      UI.costDrop(ctx, 0, -2, 25, Math.floor(P.nrg), true);
      ctx.restore();
      if (full && M.phase !== 'ended') G.text(ctx, 'FULL!', x + w + 36, y + h / 2, { size: 17, color: '#ff8fd6', stroke: INK, strokeW: 4, weight: 900 });
    }

    drawBanner(ctx) {
      const b = this.M.banner;
      if (!b) return;
      const k = b.t / b.dur;
      const inK = U.clamp(b.t / 0.35, 0, 1), outK = U.clamp((b.dur - b.t) / 0.3, 0, 1);
      const s = U.easeOutBack(inK) * (0.9 + 0.1 * outK);

      ctx.save(); ctx.globalAlpha = a; ctx.translate(cx, cy); ctx.scale(s, s);

      ctx.fillStyle = 'rgba(74,45,92,0.35)'; ctx.save(); ctx.translate(0, 8); ctx.fill(); ctx.restore();
      const g = ctx.createLinearGradient(0, -46, 0, 46); g.addColorStop(0, '#fff7fd'); g.addColorStop(1, '#f1e0ff');
      ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
      G.text(ctx, b.text, 0, -6, { size: 44, color: b.color, stroke: INK, strokeW: 9, display: true, shadow: 'rgba(74,45,92,0.4)', shadowOff: 4 });

    drawCutin(ctx) {
      const c = this.M.cutin;
      if (!c) return;
      const t = c.t, dur = 1.1;
      const inK = U.easeOutCubic(U.clamp(t / 0.22, 0, 1)), outK = U.easeInCubic(U.clamp((t - 0.8) / 0.3, 0, 1));

      ctx.translate(960 + slide, y);

    drawHint(ctx) {

      const k = U.clamp((M.clock - 3.8) / 0.4, 0, 1);

    drawIntro(ctx) {
      const M = this.M;

      ctx.globalAlpha = out;
      const slideL = U.lerp(-500, 0, U.easeOutBack(k)), slideR = U.lerp(500, 0, U.easeOutBack(k));
      // player side

      NK.CatArt.drawTo(ctx, this.myLeader, 0, 'atk0', 500, 520, 1.6);
      G.text(ctx, 'You', 690, 430, { size: 40, color: '#ffffff', stroke: INK, strokeW: 8, display: true });
      G.text(ctx, this.deck.length + '-card deck', 690, 480, { size: 18, color: INK, weight: 900 });
      ctx.restore();
      ctx.save(); ctx.translate(slideR, 0);
      UI.panel(ctx, 1080, 380, 420, 150, { top: '#ffe6f0', bottom: '#ffc2d8' });
      ctx.save(); ctx.translate(1420, 520); ctx.scale(-1, 1);

      let fs = 32; ctx.font = G.font(fs, 400, true);

      G.text(ctx, this.opponent.name, 1225, 430, { size: fs, color: '#ffffff', stroke: INK, strokeW: 7, display: true });
      G.text(ctx, this.opponent.title, 1225, 480, { size: 18, color: INK, weight: 900 });
      ctx.restore();
      // VS
      const vs = U.easeOutElastic(U.clamp((t - 0.2) / 0.8, 0, 1));

    drawResult(ctx) {
      const M = this.M, r = M.result, t = this.resultT;
      const win = r.winner === 0, draw = r.winner === -1;
      const k = U.clamp(t / 0.4, 0, 1);

      // rays
      if (win) {
        ctx.save(); ctx.translate(960, 330); ctx.rotate(t * 0.2);
        ctx.globalAlpha = 0.18 * k;
        for (let i = 0; i < 16; i++) { ctx.rotate(TAU / 16); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(900, -80); ctx.lineTo(900, 80); ctx.closePath(); ctx.fillStyle = i % 2 ? '#ffe066' : '#ff8fd6'; ctx.fill(); }
        ctx.restore();
      }
      // title ribbon
      const s = U.easeOutElastic(U.clamp(t / 0.9, 0, 1));
      ctx.save(); ctx.translate(960, 160); ctx.scale(s, s);
      const title = win ? 'Victory!' : draw ? 'Draw!' : 'Defeat…';
      const cols = win ? null : draw ? ['#c9a8ff'] : ['#9fb4d6'];
      UI.title(ctx, title, 0, 0, 104, this.t, { colors: cols || undefined, wobble: true });
      ctx.restore();
      const sub = win ? (r.reason === 'castle' ? 'The enemy castle crumbled into sparkles!' : 'You earned more crowns!') :
        draw ? 'Perfectly matched — the cats call it a tie.' : (r.reason === 'castle' ? 'Your castle took a nap… a permanent one.' : 'The rival earned more crowns this time.');
      ctx.globalAlpha = k;
      G.text(ctx, sub, 960, 256, { size: 26, color: '#ffffff', stroke: INK, strokeW: 6, weight: 900 });
      // crowns vs
      const panelY = 296;
      UI.panel(ctx, 520, panelY, 880, 356, {});
      for (const [team, px] of [[0, 740], [1, 1180]]) {
        const leader = team === 0 ? this.myLeader : this.leader;
        const won = r.winner === team;
        const bounce = won ? Math.abs(Math.sin(this.t * 5)) * 14 : 0;
        const frame = won ? (Math.sin(this.t * 5) > 0 ? 'atk1' : 'idle0') : (r.winner === -1 ? 'idle0' : 'hurt');
        const lsize = NK.Units[leader].art.size;
        const lsc = Math.min(2.2, 150 / (75 * lsize));
        const baseY = panelY + 228;
        ctx.save(); ctx.translate(px, baseY - bounce); if (team === 1) ctx.scale(-1, 1);
        NK.CatArt.drawTo(ctx, leader, team, frame, 0, 0, lsc);
        ctx.restore();
        if (!won && r.winner !== -1) {
          // tiny rain cloud over the sad cat
          const cy = baseY - 88 * lsize * lsc;
          for (let i = 0; i < 4; i++) {
            const dy = ((this.t * 120 + i * 30) % 50);
            ctx.globalAlpha = k * (1 - dy / 50);
            ctx.beginPath(); ctx.ellipse(px - 18 + i * 12, cy + 14 + dy, 2.5, 5, 0, 0, TAU); ctx.fillStyle = '#8fd0ff'; ctx.fill();
          }
          ctx.globalAlpha = k;
          NK.ArenaArt.drawCloud(ctx, px, cy, 0.32, 1);
        }
        G.text(ctx, team === 0 ? 'You' : this.opponent.name, px, panelY + 262, { size: 24, color: INK, weight: 900 });
        for (let i = 0; i < 3; i++) {
          const appear = U.clamp((t - 0.6 - i * 0.25 - (team ? 0.1 : 0)) / 0.3, 0, 1);
          const filled = i < r.crowns[team] && appear > 0;
          const cs = filled ? U.easeOutBack(appear) : 1;
          ctx.save(); ctx.translate(px - 60 + i * 60, panelY + 312); ctx.scale(cs, cs);
          UI.crown(ctx, 0, 0, 24, filled, this.t);
          ctx.restore();
          if (filled && appear < 0.15 && appear > 0) UI.burst(px - 60 + i * 60, panelY + 312, 3, { color: ['#ffe066', '#ffffff'], size: 14 });
        }
      }
      G.text(ctx, 'VS', 960, panelY + 170, { size: 56, color: '#ffe066', stroke: INK, strokeW: 10, display: true });
      // stats
      const P = M.players[0].stats, E = M.players[1].stats;
      const stats = [['Cards played', P.played, E.played], ['Damage dealt', Math.round(P.dmg), Math.round(E.dmg)], ['Cats defeated', P.kills, E.kills]];
      UI.panel(ctx, 620, 680, 680, 170, { r: 20 });
      stats.forEach(([label, a, b], i) => {
        const y = 718 + i * 44;
        G.text(ctx, String(a), 720, y, { size: 26, color: '#4b9dff', weight: 900 });
        G.text(ctx, label, 960, y, { size: 21, color: INK, weight: 900 });
        G.text(ctx, String(b), 1200, y, { size: 26, color: '#ff5c8d', weight: 900 });
      });
      ctx.globalAlpha = 1;
      for (const b of this.resultButtons) b.draw(ctx);
      ctx.restore();
    }
  }
  NK.MatchScreen = MatchScreen;
})();

/* ---- 14_screens.js ---- */
/* =====================================================================
   Screens: Main menu (with difficulty picker), Deck editor,
   How to Play, Settings (also used as the in-battle settings panel).
   ===================================================================== */
'use strict';
(() => {
  const U = NK.U, G = NK.G, C = NK.C, UI = NK.UI, TAU = U.TAU, INK = C.INK;
  const A = () => NK.Audio;

  /* ---------- shared animated sky background ---------- */
  function drawMenuBg(ctx, t) {
    const bg = NK.ArenaArt.getBg();
    const g = ctx.createLinearGradient(0, 0, 0, C.VH);
    g.addColorStop(0, '#c9b8ff'); g.addColorStop(0.5, '#ffd6ec'); g.addColorStop(1, '#bfe8ff');
    ctx.fillStyle = g; ctx.fillRect(-2400, -1200, C.VW + 4800, C.VH + 2400);
    // rotating soft rays
    ctx.save(); ctx.translate(960, 300); ctx.rotate(t * 0.04);
    ctx.globalAlpha = 0.12;
    for (let i = 0; i < 18; i++) { ctx.rotate(TAU / 18); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(1400, -110); ctx.lineTo(1400, 110); ctx.closePath(); ctx.fillStyle = '#ffffff'; ctx.fill(); }
    ctx.restore();
    // twinkles
    for (let i = 0; i < 40; i++) {
      const x = (i * 197.3) % C.VW, y = (i * 83.7) % 620;
      const a = 0.3 + 0.5 * Math.abs(Math.sin(t * 1.5 + i));
      ctx.globalAlpha = a;
      G.sparklePath(ctx, x, y, 3 + (i % 4) * 1.5, 0.2); ctx.fillStyle = '#ffffff'; ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (let i = 0; i < 6; i++) {
      const x = ((t * (10 + i * 3) + i * 380) % (C.VW + 400)) - 200;
      NK.ArenaArt.drawCloud(ctx, x, 120 + (i % 3) * 190, 0.8 + (i % 2) * 0.4, 0.8, i === 2);
    }
    // hills
    ctx.beginPath(); ctx.moveTo(0, 900); ctx.quadraticCurveTo(480, 800, 960, 870); ctx.quadraticCurveTo(1440, 940, 1920, 840); ctx.lineTo(1920 + 2400, 900); ctx.lineTo(1920 + 2400, 2400); ctx.lineTo(-2400, 2400); ctx.lineTo(-2400, 900); ctx.lineTo(0, 900); ctx.closePath();
    ctx.fillStyle = '#9ddf96'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 960); ctx.quadraticCurveTo(600, 900, 1100, 960); ctx.quadraticCurveTo(1500, 1010, 1920, 950); ctx.lineTo(1920 + 2400, 950); ctx.lineTo(1920 + 2400, 2400); ctx.lineTo(-2400, 2400); ctx.lineTo(-2400, 960); ctx.lineTo(0, 960); ctx.closePath();
    ctx.fillStyle = '#b4ebaa'; ctx.fill(); ctx.stroke();
    // flowers on hills
    for (let i = 0; i < 40; i++) {
      const x = (i * 131.7) % C.VW, y = 985 + ((i * 37) % 80);
      G.flowerPath(ctx, x, y, 6, 5, i); ctx.fillStyle = ['#ffffff', '#ffc2dc', '#fff3a3', '#d9c8ff'][i % 4]; ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, 1.8, 0, TAU); ctx.fillStyle = '#ffd84a'; ctx.fill();
    }
    return bg;
  }

  function drawLogo(ctx, x, y, t, scale = 1) {
    ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
    // emblem: big star with paw
    ctx.save(); ctx.translate(0, -8); ctx.rotate(Math.sin(t * 0.8) * 0.05);
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(G.tex('glow', '#fff3a3'), -260, -200, 520, 400);
    ctx.globalCompositeOperation = 'source-over';
    G.softStarPath(ctx, 0, 0, 150, 76); ctx.lineWidth = 7; ctx.strokeStyle = INK; ctx.stroke();
    const g = ctx.createRadialGradient(-30, -40, 10, 0, 0, 150); g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#fff1a8'); g.addColorStop(1, '#ffc24d');
    ctx.fillStyle = g; ctx.fill();
    G.pawPath(ctx, 0, 6, 44); ctx.fillStyle = '#ff9fd0'; ctx.fill(); ctx.lineWidth = 4; ctx.stroke();
    ctx.restore();
    UI.title(ctx, 'Starpaw', 0, -10, 128, t, { spacing: 2, wobble: true });
    // ribbon
    ctx.save(); ctx.translate(0, 92);
    ctx.beginPath(); ctx.moveTo(-230, -34); ctx.lineTo(230, -34); ctx.lineTo(205, 0); ctx.lineTo(230, 34); ctx.lineTo(-230, 34); ctx.lineTo(-205, 0); ctx.closePath();
    ctx.fillStyle = 'rgba(74,45,92,0.35)'; ctx.save(); ctx.translate(0, 7); ctx.fill(); ctx.restore();
    const rg = ctx.createLinearGradient(0, -34, 0, 34); rg.addColorStop(0, '#ff9fd0'); rg.addColorStop(1, '#e2559f');
    ctx.fillStyle = rg; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
    G.text(ctx, 'A R E N A', 0, 2, { size: 40, color: '#ffffff', stroke: INK, strokeW: 7, display: true });
    ctx.restore();
    ctx.restore();
  }

  /* ---------- bouncing menu cats ---------- */
  class MenuCats {
    constructor() {
      const keys = ['swordCat', 'mageCat', 'tankCat', 'kitten', 'magicalCat', 'witchCat', 'archerCat', 'ninjaCat', 'frostCat', 'cannonCat', 'angelCat', 'dragonCat'];
      this.cats = keys.map((k, i) => {
        const def = NK.Units[k];
        return {
          key: k, team: i % 2, x: 120 + i * 150 + U.rand(-20, 20), y: def.air ? 820 : 900 + (i % 3) * 36, dir: Math.random() < 0.5 ? -1 : 1, speed: U.rand(18, 40),
          t: Math.random() * 10, hop: 0, hopV: 0, air: def.air, variant: i % 4, walkT: U.rand(2, 6), walking: false, joy: 0, size: def.art.size,
        };
      });
      this.cats.sort((a, b) => a.y - b.y);
    }
    update(dt) {
      for (const c of this.cats) {
        c.t += dt;
        c.walkT -= dt;
        if (c.walkT <= 0) { c.walking = !c.walking; c.walkT = c.walking ? U.rand(1.5, 4) : U.rand(1, 3); if (Math.random() < 0.5) c.dir *= -1; }
        if (c.walking) { c.x += c.dir * c.speed * dt; if (c.x < 60 || c.x > C.VW - 60) c.dir *= -1; }
        c.hopV -= 1400 * dt; c.hop = Math.max(0, c.hop + c.hopV * dt); if (c.hop === 0) c.hopV = 0;
        c.joy = Math.max(0, c.joy - dt);
      }
    }
    click(mx, my) {
      for (let i = this.cats.length - 1; i >= 0; i--) {
        const c = this.cats[i];
        const cy = c.y - c.hop - (c.air ? Math.sin(c.t * 3) * 6 : 0) - 30 * c.size;
        if (Math.hypot(mx - c.x, my - cy) < 38 * c.size) {
          c.hopV = 520; c.joy = 1.2;
          A().meow(NK.Units[c.key].voice, 0.6);
          UI.burst(c.x, cy - 20, 8, { shape: ['heart', 'sparkle'], color: ['#ff8fb5', '#ffffff', '#ffe066'], size: 18, vy: -200, g: 260, add: false });
          return true;
        }
      }
      return false;
    }
    draw(ctx) {
      for (const c of this.cats) {
        const bob = c.air ? Math.sin(c.t * 3) * 6 : 0;
        const X = c.x, Y = c.y - c.hop - bob;
        ctx.globalAlpha = 0.25;
        ctx.beginPath(); ctx.ellipse(X, c.y + (c.air ? 60 : 0), 22 * c.size, 9 * c.size, 0, 0, TAU); ctx.fillStyle = '#3c1e5a'; ctx.fill();
        ctx.globalAlpha = 1;
        let frame = c.walking || c.air ? 'walk' + (Math.floor(c.t * 9) % 4) : ((c.t % 3) < 0.13 ? 'idle1' : 'idle0');
        if (c.joy > 0) frame = c.joy > 0.6 ? 'atk1' : 'atk2';
        const sq = c.walking ? 1 + Math.sin(c.t * 18) * 0.03 : 1 + Math.sin(c.t * 3) * 0.025;
        ctx.save(); ctx.translate(X, Y); ctx.scale((c.walking ? c.dir : (c.x > 960 ? -1 : 1)) * (2 - sq), sq);
        NK.CatArt.drawTo(ctx, c.key, c.team, frame, 0, 0, 1.25, c.key === 'kitten' ? c.variant : 0);
        ctx.restore();
      }
    }
  }

  /* =================================================================== */
  class MenuScreen {
    enter() {
      this.t = 0;
      this.cats = this.cats || new MenuCats();
      const bx = 760, bw = 400;
      this.buttons = [
        new UI.Button({ x: bx, y: 470, w: bw, h: 92, label: 'Play', style: 'primary', size: 44, icon: 'star', delay: 0.15, hotkey: 'Enter', onClick: () => this.openPlay() }),
        new UI.Button({ x: bx, y: 582, w: bw, h: 70, label: 'Deck', style: 'blue', size: 30, icon: 'shield', delay: 0.22, onClick: () => NK.Game.go(new DeckScreen()) }),
        new UI.Button({ x: bx, y: 670, w: bw, h: 70, label: 'How to Play', style: 'mint', size: 30, icon: 'heart', delay: 0.29, onClick: () => NK.Game.go(new HowToScreen()) }),
        new UI.Button({ x: bx, y: 758, w: bw, h: 70, label: 'Settings', style: 'lilac', size: 30, icon: 'wand', delay: 0.36, onClick: () => NK.Game.go(new SettingsScreen()) }),
      ];
      this.playOpen = false; this.playT = 0;
      const d = NK.Difficulty;
      this.diffButtons = d.map((df, i) => new UI.Button({ x: 470 + i * 336, y: 560, w: 310, h: 84, label: df.name, style: ['mint', 'sun', 'primary'][i], size: 34, hotkey: String(i + 1), onClick: () => this.start(i) }));
      this.closeBtn = new UI.Button({ x: 810, y: 720, w: 300, h: 64, label: 'Back', style: 'ghost', size: 26, onClick: () => { this.playOpen = false; A().sfx('cancel'); } });
      A().music('menu');
    }
    openPlay() { this.playOpen = true; this.playT = 0; for (const b of this.diffButtons) b.appear = 0; this.closeBtn.appear = 0; }
    start(i) {
      NK.Settings.set('difficulty', i);
      NK.Game.go(new NK.MatchScreen({ difficulty: i }));
    }
    update(dt) {
      this.t += dt;
      this.cats.update(dt);
      UI.updateParts(dt);
      if (this.playOpen) { this.playT += dt; for (const b of this.diffButtons) b.update(dt); this.closeBtn.update(dt); }
      else for (const b of this.buttons) b.update(dt);
    }
    draw(ctx) {
      drawMenuBg(ctx, this.t);
      const k = U.easeOutBack(U.clamp(this.t / 0.6, 0, 1));
      drawLogo(ctx, 960, 250 + Math.sin(this.t * 1.5) * 6, this.t, k);
      this.cats.draw(ctx);
      for (const b of this.buttons) b.draw(ctx);
      G.text(ctx, 'Keyboard + mouse • 1–4 select cards • click to deploy', 960, 1052, { size: 18, color: 'rgba(74,45,92,0.75)', weight: 800 });
      if (this.playOpen) this.drawPlay(ctx);
      UI.drawParts(ctx);
    }
    drawPlay(ctx) {
      const k = U.clamp(this.playT / 0.25, 0, 1);
      ctx.save();
      ctx.globalAlpha = 0.5 * k; ctx.fillStyle = '#2d1b45'; ctx.fillRect(-2400, -1200, C.VW + 4800, C.VH + 2400); ctx.globalAlpha = 1;
      const s = U.easeOutBack(k);
      ctx.translate(960, 540); ctx.scale(s, s); ctx.translate(-960, -540);
      UI.panel(ctx, 430, 300, 1060, 520, {});
      UI.title(ctx, 'Choose your rival', 960, 370, 54, this.t, {});
      G.text(ctx, 'Pick a difficulty. Your opponent and their deck are chosen at random.', 960, 432, { size: 21, color: '#8a6fae', weight: 800 });
      const cur = NK.Settings.get('difficulty');
      NK.Difficulty.forEach((d, i) => {
        const b = this.diffButtons[i];
        G.text(ctx, d.desc, b.x + b.w / 2, b.y + b.h + 34, { size: 18, color: INK, weight: 800 });
        if (i === cur) { G.text(ctx, 'last played', b.x + b.w / 2, b.y - 22, { size: 15, color: '#c2427e', weight: 900 }); }
        const hearts = i + 1;
        for (let h = 0; h < 3; h++) G.icon(ctx, 'heart', b.x + b.w / 2 - 30 + h * 30, b.y + b.h + 68, 11, h < hearts ? '#ff8fb5' : 'rgba(255,255,255,0.6)', INK);
      });
      for (const b of this.diffButtons) b.draw(ctx);
      this.closeBtn.draw(ctx);
      ctx.restore();
    }
    onDown(mx, my, btn) {
      if (btn !== 0) return;
      if (this.playOpen) { for (const b of this.diffButtons) b.down(mx, my); this.closeBtn.down(mx, my); return; }
      for (const b of this.buttons) if (b.down(mx, my)) return;
      this.cats.click(mx, my);
    }
    onUp(mx, my, btn) {
      if (btn !== 0) return;
      if (this.playOpen) { for (const b of this.diffButtons) b.up(mx, my); this.closeBtn.up(mx, my); return; }
      for (const b of this.buttons) b.up(mx, my);
    }
    onKey(key) {
      if (this.playOpen) {
        if (key >= '1' && key <= '3') { A().sfx('click'); this.start(+key - 1); }
        if (key === 'Enter') { A().sfx('click'); this.start(NK.Settings.get('difficulty')); }
        if (key === 'Escape') { this.playOpen = false; A().sfx('cancel'); }
        return;
      }
      if (key === 'Enter' || key === ' ') { A().sfx('click'); this.openPlay(); }
    }
  }

  /* =================================================================== */
  class SettingsPanel {
    constructor(onBack, standalone = false) {
      const S = NK.Settings;
      this.onBack = onBack; this.t = 0; this.standalone = standalone;
      const x = 690;
      this.widgets = [
        new UI.Slider({ x, y: 330, w: 540, label: 'Master volume', value: S.get('master'), onChange: (v) => S.set('master', v) }),
        new UI.Slider({ x, y: 420, w: 540, label: 'Music', value: S.get('music'), onChange: (v) => S.set('music', v) }),
        new UI.Slider({ x, y: 510, w: 540, label: 'Sound effects', value: S.get('sfx'), onChange: (v) => S.set('sfx', v) }),
        new UI.Toggle({ x, y: 570, label: 'Screen shake', value: S.get('shake'), onChange: (v) => S.set('shake', v) }),
        new UI.Toggle({ x, y: 622, label: 'Damage numbers', value: S.get('dmgNumbers'), onChange: (v) => S.set('dmgNumbers', v) }),
        new UI.Toggle({ x, y: 674, label: 'Cat voices (meows)', value: S.get('meows'), onChange: (v) => S.set('meows', v) }),
      ];
      this.diff = NK.Difficulty.map((d, i) => new UI.Button({ x: x + i * 184, y: 770, w: 172, h: 56, label: d.name, style: S.get('difficulty') === i ? ['mint', 'sun', 'primary'][i] : 'ghost', size: 22,
        onClick: () => { S.set('difficulty', i); this.diff.forEach((b, j) => { b.style = j === i ? ['mint', 'sun', 'primary'][j] : 'ghost'; }); } }));
      this.back = new UI.Button({ x: 810, y: 860, w: 300, h: 66, label: 'Done', style: 'primary', size: 28, onClick: () => this.onBack() });
    }
    update(dt) { this.t += dt; for (const w of this.widgets) w.update(dt); for (const b of this.diff) b.update(dt); this.back.update(dt); }
    draw(ctx) {
      const k = U.easeOutBack(U.clamp(this.t / 0.3, 0, 1));
      ctx.save(); ctx.translate(960, 560); ctx.scale(k, k); ctx.translate(-960, -560);
      UI.panel(ctx, 620, 200, 680, 760, {});
      UI.title(ctx, 'Settings', 960, 262, 56, this.t, {});
      for (const w of this.widgets) w.draw(ctx);
      G.text(ctx, 'Rival difficulty', 690, 745, { size: 22, color: INK, align: 'left', weight: 900 });
      for (const b of this.diff) b.draw(ctx);
      this.back.draw(ctx);
      ctx.restore();
    }
    down(mx, my) { for (const w of this.widgets) if (w.down(mx, my)) return; for (const b of this.diff) b.down(mx, my); this.back.down(mx, my); }
    up(mx, my) { for (const w of this.widgets) w.up(mx, my); for (const b of this.diff) b.up(mx, my); this.back.up(mx, my); }
  }
  NK.SettingsPanel = SettingsPanel;

  class SettingsScreen {
    enter() { this.t = 0; this.panel = new SettingsPanel(() => NK.Game.go(new MenuScreen()), true); }
    update(dt) { this.t += dt; this.panel.update(dt); UI.updateParts(dt); }
    draw(ctx) { drawMenuBg(ctx, this.t); ctx.fillStyle = 'rgba(45,27,69,0.25)'; ctx.fillRect(-2400, -1200, C.VW + 4800, C.VH + 2400); this.panel.draw(ctx); UI.drawParts(ctx); }
    onDown(mx, my, b) { if (b === 0) this.panel.down(mx, my); }
    onUp(mx, my, b) { if (b === 0) this.panel.up(mx, my); }
    onKey(key) { if (key === 'Escape') NK.Game.go(new MenuScreen()); }
  }

  /* =================================================================== */
  class DeckScreen {
    enter() {
      this.t = 0;
      this.deck = NK.getDeck();
      this.slots = this.deck.slice();         // may contain nulls while editing
      this.pick = null; this.hoverId = null; this.hoverT = {};
      this.flash = {};
      this.toast = null;
      this.done = new UI.Button({ x: 1580, y: 930, w: 280, h: 76, label: 'Save Deck', style: 'mint', size: 30, onClick: () => this.save() });
      this.reset = new UI.Button({ x: 1580, y: 842, w: 134, h: 60, label: 'Reset', style: 'ghost', size: 22, onClick: () => { this.slots = NK.DefaultDeck.slice(); this.pick = null; A().sfx('cardDraw'); } });
      this.rand = new UI.Button({ x: 1726, y: 842, w: 134, h: 60, label: 'Random', style: 'sun', size: 22, onClick: () => { this.slots = U.shuffle(NK.CardOrder.slice()).slice(0, 8); this.pick = null; A().sfx('cardDraw'); } });
      this.backBtn = new UI.IconButton({ x: 40, y: 34, w: 60, h: 60, icon: 'back', onClick: () => NK.Game.go(new MenuScreen()) });
      this.btns = [this.done, this.reset, this.rand, this.backBtn];
    }
    gridRect(i) { const col = i % 6, row = Math.floor(i / 6); return { x: 70 + col * 158, y: 150 + row * 196, w: 140, h: 166 }; }
    slotRect(i) { return { x: 110 + i * 170, y: 842, w: 140, h: 166 }; }
    save() {
      if (this.slots.filter(Boolean).length < 8) { this.toast = { text: 'Your deck needs 8 cards!', t: 0 }; A().sfx('deny'); return; }
      NK.saveDeck(this.slots);
      A().sfx('victoryHit');
      UI.burst(this.done.x + 140, this.done.y, 20, { color: ['#ffe066', '#ffffff', '#7fd99f'], size: 18, vy: -250, g: 300 });
      NK.Game.go(new MenuScreen());

      G.roundRect(ctx, bx, by, Math.max(22, bw * fill / 10), 22, 11);
      const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      ['#ff8fd6', '#ffe066', '#9fe89a', '#79c4ff', '#c9a8ff'].forEach((c, i) => g.addColorStop(i / 4, c));
      ctx.fillStyle = g; ctx.fill();
    }
  }

  NK.MenuScreen = MenuScreen; NK.DeckScreen = DeckScreen; NK.HowToScreen = HowToScreen; NK.SettingsScreen = SettingsScreen;
})();

/* ---- 15_main.js ---- */
/* =====================================================================
   GameManager: canvas + resolution scaling, main loop, input routing,
   iris screen transitions, font loading, test hooks.
   ===================================================================== */
'use strict';
(() => {
  const U = NK.U, C = NK.C, G = NK.G, UI = NK.UI, INK = C.INK;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const V = NK.View;
  let cssW = 0, cssH = 0, dpr = 1;

  const Game = {
    screen: null, next: null,
    trans: 0, transDir: 0,  // 0 idle, 1 closing, -1 opening
    t: 0,
    go(screen) {
      if (this.transDir === 1) { this.next = screen; return; }
      this.next = screen; this.transDir = 1; this.trans = 0;
    },
    setScreen(s) {
      if (this.screen && this.screen.exit) this.screen.exit();
      this.screen = s;
      UI.clearParts();
      if (s.enter) s.enter();
    },
  };
  NK.Game = Game;

  /* ---------------- resize / scaling ---------------- */
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cssW = window.innerWidth; cssH = window.innerHeight;
    canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
    const s = Math.min(canvas.width / C.VW, canvas.height / C.VH);
    V.s = s;
    V.ox = (canvas.width - C.VW * s) / 2;
    V.oy = (canvas.height - C.VH * s) / 2;
    NK.ArenaArt.render(Math.min(2, Math.max(0.75, s)));
    NK.CatArt.setRes(s * 1.15);
  }
  window.addEventListener('resize', resize);

  /* ---------------- input ---------------- */
  function toLogical(e) {
    const r = canvas.getBoundingClientRect();
    const px = (e.clientX - r.left) * (canvas.width / r.width);
    const py = (e.clientY - r.top) * (canvas.height / r.height);
    return [(px - V.ox) / V.s, (py - V.oy) / V.s];
  }
  canvas.addEventListener('pointermove', (e) => {
    const [x, y] = toLogical(e);
    UI.mouse.x = x; UI.mouse.y = y;
    if (Game.screen && Game.screen.onMove && Game.transDir === 0) Game.screen.onMove(x, y);
  });
  canvas.addEventListener('pointerdown', (e) => {
    NK.Audio.resume();
    const [x, y] = toLogical(e);
    UI.mouse.x = x; UI.mouse.y = y;
    if (e.button === 0) UI.mouse.down = true;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    if (Game.screen && Game.screen.onDown && Game.transDir === 0) Game.screen.onDown(x, y, e.button);
    e.preventDefault();
  });
  canvas.addEventListener('pointerup', (e) => {
    const [x, y] = toLogical(e);
    UI.mouse.x = x; UI.mouse.y = y;
    if (e.button === 0) UI.mouse.down = false;
    if (Game.screen && Game.screen.onUp && Game.transDir === 0) Game.screen.onUp(x, y, e.button);
  });
  canvas.addEventListener('pointerleave', () => { UI.mouse.x = -999; UI.mouse.y = -999; });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('keydown', (e) => {
    NK.Audio.resume();
    if (e.repeat && e.key !== ' ') return;
    if (['1', '2', '3', '4', ' ', 'Escape', 'Enter'].includes(e.key)) e.preventDefault();
    if (e.repeat) return;
    if (Game.screen && Game.screen.onKey && Game.transDir === 0) Game.screen.onKey(e.key, e);
  });
  window.addEventListener('keyup', (e) => {
    if (Game.screen && Game.screen.onKeyUp) Game.screen.onKeyUp(e.key, e);
  });
  // pause when the tab hides during battle
  document.addEventListener('visibilitychange', () => {
    const s = Game.screen;
    if (document.hidden && s instanceof NK.MatchScreen && !s.paused && s.M.phase !== 'ended' && !NK.autoPlayer) s.setPaused(true);
  });

  /* ---------------- transitions ---------------- */
  function drawTransition(ctx, k) {
    // iris closing with paw print
    if (k <= 0) return;
    const maxR = Math.hypot(C.VW, C.VH) / 2 + 40;
    const r = maxR * (1 - U.easeInOutSine(k));
    ctx.save();
    ctx.beginPath();
    ctx.rect(-2400, -1200, C.VW + 4800, C.VH + 2400);
    ctx.arc(C.VW / 2, C.VH / 2, Math.max(0, r), 0, U.TAU, true);
    ctx.fillStyle = '#3a2458'; ctx.fill('evenodd');
    ctx.beginPath(); ctx.arc(C.VW / 2, C.VH / 2, Math.max(0, r), 0, U.TAU); ctx.lineWidth = 12; ctx.strokeStyle = '#ff8fd6'; ctx.stroke();
    if (k > 0.85) {
      const a = (k - 0.85) / 0.15;
      ctx.globalAlpha = a;
      G.pawPath(ctx, C.VW / 2, C.VH / 2, 60); ctx.fillStyle = '#ff8fd6'; ctx.fill();
    }
    ctx.restore();
  }

  /* ---------------- loop ---------------- */
  let last = performance.now();
  let fpsAcc = 0, fpsN = 0; NK.fps = 60;
  let letterboxGrad = null;
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.1) dt = 0.1;
    Game.t += dt;
    fpsAcc += dt; fpsN++;
    if (fpsAcc > 0.5) { NK.fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }

    // transitions
    if (Game.transDir === 1) {
      Game.trans += dt / 0.32;
      if (Game.trans >= 1) { Game.trans = 1; Game.setScreen(Game.next); Game.next = null; Game.transDir = -1; }
    } else if (Game.transDir === -1) {
      Game.trans -= dt / 0.32;
      if (Game.trans <= 0) { Game.trans = 0; Game.transDir = 0; }
    }

    UI.cursor = 'default';
    if (Game.screen) Game.screen.update(dt);
    if (canvas.style.cursor !== UI.cursor) canvas.style.cursor = UI.cursor;

    // clear (letterbox color)
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (V.ox > 1 || V.oy > 1) {
      if (!letterboxGrad || letterboxGrad.h !== canvas.height) {
        letterboxGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        letterboxGrad.addColorStop(0, '#c9b8ff'); letterboxGrad.addColorStop(0.45, '#ffd6ec'); letterboxGrad.addColorStop(1, '#bfe8ff');
        letterboxGrad.h = canvas.height;
      }
      ctx.fillStyle = letterboxGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    NK.View.resetNoShake(ctx);
    ctx.save();
    if (Game.screen) Game.screen.draw(ctx);
    NK.View.resetNoShake(ctx);
    drawTransition(ctx, Game.trans);
    if (NK.showFps) G.text(ctx, Math.round(NK.fps) + ' fps', 60, 1060, { size: 16, color: '#fff', stroke: INK, strokeW: 4 });
    ctx.restore();
    requestAnimationFrame(frame);
  }

  /* ---------------- boot ---------------- */
  function boot() {
    resize();
    const loading = () => {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#2a1a40'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      NK.View.resetNoShake(ctx);
      G.text(ctx, 'Loading cats…', C.VW / 2, C.VH / 2, { size: 40, color: '#ffffff', stroke: INK, strokeW: 6 });
    };
    loading();
    const fontsReady = document.fonts && document.fonts.load
      ? Promise.all([document.fonts.load('400 40px "Mochiy Pop One"'), document.fonts.load('800 20px "M PLUS Rounded 1c"'), document.fonts.load('900 20px "M PLUS Rounded 1c"')]).catch(() => null)
      : Promise.resolve();
    const timeout = new Promise((res) => setTimeout(res, 2500));
    Promise.race([fontsReady, timeout]).then(() => {
      resize();
      const start = window.__NK_START ? window.__NK_START() : new NK.MenuScreen();
      Game.setScreen(start);
      Game.transDir = -1; Game.trans = 1;
      last = performance.now();
      requestAnimationFrame(frame);
    });
  }
  boot();
})();

</script>

</body></html>
