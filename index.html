      cols.forEach((c, i) => { ctx.beginPath(); ctx.arc(cx, cy, 300 - i * 16, Math.PI * 1.05, Math.PI * 1.95); ctx.lineWidth = 16; ctx.strokeStyle = c; ctx.stroke(); });
    }
    ctx.restore();
    // stars
    for (let i = 0; i < 70; i++) {
      const x = r() < 0.5 ? r() * 340 : C.VW - r() * 340;
      const y = r() * 520;
      const s = 2 + r() * 5;
      ctx.globalAlpha = 0.4 + r() * 0.5;
      G.sparklePath(ctx, x, y, s, 0.2); ctx.fillStyle = '#ffffff'; ctx.fill();
    }
    ctx.globalAlpha = 1;
    // distant castles on floating islets
    const castles = [[150, 330, 0.9, '#b9a2ef'], [1780, 290, 1.0, '#e9a6d6'], [300, 560, 0.6, '#a9c6f5'], [1650, 600, 0.65, '#c5b0f7']];
    for (const [x, y, s, col] of castles) drawDistantCastle(ctx, x, y, s, col);
    // clouds
    const clouds = [[90, 820, 1.4], [300, 950, 1.2], [1640, 900, 1.5], [1850, 760, 1.1], [60, 160, 0.8], [1860, 120, 0.9], [360, 110, 0.7], [1580, 470, 0.7], [230, 690, 0.6]];
    for (const [x, y, s] of clouds) drawCloud(ctx, x, y, s, 0.9);
  }
  function drawCloud(ctx, x, y, s, a = 1, catEars = false) {
    ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(s, s);
    const blobs = [[-50, 8, 34], [-15, -8, 42], [30, 0, 36], [60, 12, 26], [0, 18, 36]];
    ctx.beginPath();
    for (const [bx, by, br] of blobs) { ctx.moveTo(bx + br, by); ctx.arc(bx, by, br, 0, TAU); }
    ctx.fillStyle = 'rgba(160,130,210,0.25)'; ctx.save(); ctx.translate(4, 8); ctx.fill(); ctx.restore();
    ctx.fillStyle = '#ffffff'; ctx.fill();
    if (catEars) {
      for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(-15 + sx * 16, -38); ctx.lineTo(-15 + sx * 30, -66); ctx.lineTo(-15 + sx * 34, -32); ctx.closePath(); ctx.fill(); }
    }
    ctx.restore();
  }
  function drawDistantCastle(ctx, x, y, s, col) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha = 0.75;
    // islet
    ctx.beginPath(); ctx.moveTo(-90, 0); ctx.quadraticCurveTo(0, -12, 90, 0); ctx.quadraticCurveTo(40, 30, 0, 80); ctx.quadraticCurveTo(-40, 30, -90, 0); ctx.closePath();
    ctx.fillStyle = U.shade(col, -0.1); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-90, 0); ctx.quadraticCurveTo(0, -12, 90, 0); ctx.quadraticCurveTo(0, 10, -90, 0); ctx.fillStyle = '#b8ecb0'; ctx.fill();
    ctx.fillStyle = col;
    ctx.fillRect(-50, -60, 100, 60);
    for (const [tx, h] of [[-50, 100], [50, 100], [0, 130]]) {
      ctx.fillRect(tx - 14, -h, 28, h);
      ctx.beginPath(); ctx.moveTo(tx - 20, -h); ctx.lineTo(tx - 12, -h - 30); ctx.lineTo(tx, -h - 12); ctx.lineTo(tx + 12, -h - 30); ctx.lineTo(tx + 20, -h); ctx.closePath();
      ctx.fillStyle = U.shade(col, 0.25); ctx.fill(); ctx.fillStyle = col;
    }
    ctx.fillStyle = U.shade(col, -0.25);
    for (const wx of [-25, 0, 25]) { ctx.beginPath(); ctx.arc(wx, -30, 6, Math.PI, 0); ctx.lineTo(wx + 6, -20); ctx.lineTo(wx - 6, -20); ctx.fill(); }
    ctx.restore();
  }

  /* ---------- the island ---------- */
  function drawIsland(ctx) {
    const I = ISLAND;
    // underside cliff (visible below / sides)
    ctx.beginPath();
    ctx.moveTo(I.x + 10, I.y + I.h - 30);
    ctx.quadraticCurveTo(I.x + 40, I.y + I.h + 90, I.x + I.w * 0.3, I.y + I.h + 120);
    ctx.quadraticCurveTo(I.x + I.w * 0.5, I.y + I.h + 190, I.x + I.w * 0.7, I.y + I.h + 120);
    ctx.quadraticCurveTo(I.x + I.w - 40, I.y + I.h + 90, I.x + I.w - 10, I.y + I.h - 30);
    ctx.closePath();
    const cg = ctx.createLinearGradient(0, I.y + I.h - 30, 0, I.y + I.h + 190);
    cg.addColorStop(0, '#c9a2d9'); cg.addColorStop(1, '#9d83d6');
    outlined(ctx, cg, 4);
    // island top base (hedge garden ring)
    G.roundRect(ctx, I.x, I.y, I.w, I.h, 46);
    const hg = ctx.createLinearGradient(0, I.y, 0, I.y + I.h);
    hg.addColorStop(0, '#7fcf86'); hg.addColorStop(1, '#6cc07a');
    outlined(ctx, hg, 4);
    // front lip
    ctx.save();
    G.roundRect(ctx, I.x, I.y, I.w, I.h, 46); ctx.clip();
    ctx.fillStyle = '#5eaf6f'; ctx.fillRect(I.x, I.y + I.h - 16, I.w, 16);
    ctx.restore();
    // hedge bumps along border
    const r = rng(11);
    const bump = (x, y, s) => {
      ell(ctx, x, y, 22 * s, 16 * s); outlined(ctx, '#86d68c', 2.6);
      ell(ctx, x - 6 * s, y - 5 * s, 8 * s, 4 * s); ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fill();
      if (r() < 0.55) {
        const fc = U.pick(['#ffb3cf', '#fff3a3', '#ffffff', '#c7b6ff']);
        G.flowerPath(ctx, x + (r() - 0.5) * 14 * s, y - 4 * s, 6 * s, 5, r()); ctx.fillStyle = fc; ctx.fill();
        ell(ctx, x + (r() - 0.5) * 2, y - 4 * s, 1.8 * s, 1.8 * s); ctx.fillStyle = '#ffd84a'; ctx.fill();
      }
    };
    for (let x = I.x + 40; x < I.x + I.w - 30; x += 38) bump(x, I.y + 22, 1);
    for (let y = I.y + 60; y < I.y + I.h - 30; y += 30) { bump(I.x + 24, y, 0.95); bump(I.x + I.w - 24, y, 0.95); }
  }

  /* ---------- field (world-space) ---------- */
  function drawField(ctx) {
    ctx.save();
    toWorld(ctx);
    const W = C.WW, H = C.WH;
    // base grass
    const gg = ctx.createLinearGradient(0, 0, 0, H);
    gg.addColorStop(0, '#b4ebaa'); gg.addColorStop(0.47, '#a9e6a2'); gg.addColorStop(0.53, '#a4e3a8'); gg.addColorStop(1, '#a2e0ab');
    ctx.fillStyle = gg;
    G.roundRect(ctx, 0, 0, W, H, 30); ctx.fill();
    ctx.save(); G.roundRect(ctx, 0, 0, W, H, 30); ctx.clip();
    // mown stripes
    for (let i = 0; i < 28; i++) {
      if (i % 2) continue;
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.fillRect(0, i * 55, W, 55);
    }
    // checker tiles subtle
    ctx.fillStyle = 'rgba(80,140,90,0.05)';
    for (let y = 0; y < H; y += 55) for (let x = ((y / 55) % 2) * 55; x < W; x += 110) ctx.fillRect(x, y, 55, 55);
    // team territory hint
    ctx.fillStyle = 'rgba(255,120,170,0.05)'; ctx.fillRect(0, 0, W, C.RIVER_TOP);
    ctx.fillStyle = 'rgba(90,160,255,0.05)'; ctx.fillRect(0, C.RIVER_BOT, W, H - C.RIVER_BOT);
    ctx.restore();

    // candy-stone paths
    const pathW = 74;
    const r = rng(23);
    const paths = [];
    for (const t of [0, 1]) {
      const ky = C.KING_Y[t], oy = C.OUTER_Y[t], bank = t === 0 ? C.RIVER_BOT : C.RIVER_TOP;
      for (const lx of C.LANE_X) {
        paths.push([[550, ky], [lx, oy]]);
        paths.push([[lx, oy], [lx, bank]]);
      }
    }
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const [a, b] of paths) { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineWidth = pathW + 10; ctx.strokeStyle = '#e9c9b4'; ctx.stroke(); }
    for (const [a, b] of paths) { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineWidth = pathW; ctx.strokeStyle = '#ffe9d6'; ctx.stroke(); }
    // plazas under structures
    for (const t of [0, 1]) {
      ctx.beginPath(); ctx.arc(550, C.KING_Y[t], 112, 0, TAU); ctx.fillStyle = '#e9c9b4'; ctx.fill();
      ctx.beginPath(); ctx.arc(550, C.KING_Y[t], 104, 0, TAU); ctx.fillStyle = '#ffe9d6'; ctx.fill();
      for (const lx of C.LANE_X) {
        ctx.beginPath(); ctx.arc(lx, C.OUTER_Y[t], 80, 0, TAU); ctx.fillStyle = '#e9c9b4'; ctx.fill();
        ctx.beginPath(); ctx.arc(lx, C.OUTER_Y[t], 73, 0, TAU); ctx.fillStyle = '#ffe9d6'; ctx.fill();
      }
    }
    // cobble stones on paths (stamp small rounded stones along)
    const stoneCols = ['#ffd6c2', '#ffdce8', '#fff2e0', '#f6d2ff', '#ffe1b8'];
    const stamp = (x, y) => {
      const w = 12 + r() * 10, h = 10 + r() * 8;
      ctx.beginPath(); ctx.ellipse(x, y, w / 2, h / 2, r() * 3, 0, TAU);
      ctx.fillStyle = U.pick(stoneCols); ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(200,150,140,0.5)'; ctx.stroke();
    };
    for (const [a, b] of paths) {
      const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
      const nx = (b[0] - a[0]) / len, ny = (b[1] - a[1]) / len;
      for (let d = 0; d < len; d += 16) {
        for (let k = 0; k < 3; k++) {
          const off = (r() - 0.5) * (pathW - 18);
          stamp(a[0] + nx * d - ny * off, a[1] + ny * d + nx * off);
        }
      }
    }
    for (const t of [0, 1]) {
      for (let i = 0; i < 90; i++) { const a = r() * TAU, d = Math.sqrt(r()) * 96; stamp(550 + Math.cos(a) * d, C.KING_Y[t] + Math.sin(a) * d); }
      for (const lx of C.LANE_X) for (let i = 0; i < 45; i++) { const a = r() * TAU, d = Math.sqrt(r()) * 66; stamp(lx + Math.cos(a) * d, C.OUTER_Y[t] + Math.sin(a) * d); }
    }

    // river
    const rt = C.RIVER_TOP, rb = C.RIVER_BOT;
    ctx.fillStyle = '#c7b3ea';
    ctx.fillRect(0, rt - 14, W, rb - rt + 28);
    const rg = ctx.createLinearGradient(0, rt, 0, rb);
    rg.addColorStop(0, '#7fd6ff'); rg.addColorStop(0.5, '#a9c4ff'); rg.addColorStop(1, '#c2a8ff');
    ctx.fillStyle = rg; ctx.fillRect(0, rt, W, rb - rt);
    // bank stones
    for (let x = 6; x < W; x += 26) {
      for (const y of [rt - 6, rb + 6]) {
        ctx.beginPath(); ctx.ellipse(x + (r() - 0.5) * 6, y, 13, 9, 0, 0, TAU);
        ctx.fillStyle = U.pick(['#e6d8ff', '#f1e8ff', '#dccbfa']); ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(120,90,170,0.5)'; ctx.stroke();
      }
    }
    // lily pads
    for (let i = 0; i < 9; i++) {
      const x = 40 + r() * (W - 80);
      if (C.BRIDGES.some((b) => Math.abs(x - b) < C.BRIDGE_HW + 30)) continue;
      const y = rt + 18 + r() * (rb - rt - 36);
      ctx.beginPath(); ctx.arc(x, y, 12, 0.3, TAU - 0.3); ctx.lineTo(x, y); ctx.closePath();
      ctx.fillStyle = '#8fdc8c'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#5eaf6f'; ctx.stroke();
      if (r() < 0.5) { G.flowerPath(ctx, x + 4, y - 3, 7, 5, 0); ctx.fillStyle = '#ffc2dc'; ctx.fill(); }
    }
    ctx.restore();
  }

  /* bridges drawn in screen space for crisp upright rails */
  function drawBridges(ctx) {
    for (const bx of C.BRIDGES) {
      const x0 = C.toScreenX(bx - C.BRIDGE_HW), x1 = C.toScreenX(bx + C.BRIDGE_HW);
      const y0 = C.toScreenY(C.RIVER_TOP - 22), y1 = C.toScreenY(C.RIVER_BOT + 22);
      // shadow on water
      ctx.fillStyle = 'rgba(80,60,140,0.22)';
      ctx.fillRect(x0 + 4, y0 + 8, x1 - x0, y1 - y0);
      // deck
      G.roundRect(ctx, x0, y0, x1 - x0, y1 - y0, 8);
      outlined(ctx, '#ffd9a8', 3);
      ctx.save(); G.roundRect(ctx, x0, y0, x1 - x0, y1 - y0, 8); ctx.clip();
      for (let y = y0 + 6; y < y1; y += 9) {
        ctx.fillStyle = (Math.round(y) % 2) ? '#ffe5c2' : '#ffd29a';
        ctx.fillRect(x0, y, x1 - x0, 7);
        ctx.fillStyle = 'rgba(170,110,80,0.35)'; ctx.fillRect(x0, y + 7, x1 - x0, 2);
      }
      ctx.restore();
      // rails
      for (const rx of [x0 + 4, x1 - 4]) {
        ctx.beginPath(); ctx.moveTo(rx, y0 - 10); ctx.lineTo(rx, y1 - 10);
        ctx.lineWidth = 9; ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.stroke();
        ctx.lineWidth = 5; ctx.strokeStyle = '#ff9ec0'; ctx.stroke();
        for (let py = y0; py <= y1 + 1; py += (y1 - y0) / 3) {
          ctx.beginPath(); G.roundRect(ctx, rx - 5, py - 12, 10, 14, 4); outlined(ctx, '#ffc2d8', 2.4);
          ell(ctx, rx, py - 13, 4, 4); outlined(ctx, '#ffe36b', 2);
        }
      }
    }
  }

  /* decorations inside field edges & around (screen space) */
  function drawDecor(ctx) {
    const r = rng(99);
    // grass tufts + small flowers across field (avoid paths/river)
    const onPath = (wx, wy) => {
      if (wy > C.RIVER_TOP - 30 && wy < C.RIVER_BOT + 30) return true;
      for (const t of [0, 1]) {
        if (Math.hypot(wx - 550, wy - C.KING_Y[t]) < 130) return true;
        for (const lx of C.LANE_X) {
          if (Math.hypot(wx - lx, wy - C.OUTER_Y[t]) < 95) return true;
          if (Math.abs(wx - lx) < 55 && ((t === 0 && wy > C.RIVER_BOT && wy < C.OUTER_Y[0]) || (t === 1 && wy < C.RIVER_TOP && wy > C.OUTER_Y[1]))) return true;
          // diagonal king→outer
          const d = U.distToSeg(wx, wy, 550, C.KING_Y[t], lx, C.OUTER_Y[t]);
          if (d < 55) return true;
        }
      }
      return false;
    };
    for (let i = 0; i < 420; i++) {
      const wx = 20 + r() * (C.WW - 40), wy = 20 + r() * (C.WH - 40);
      if (onPath(wx, wy)) continue;
      const sx = C.toScreenX(wx), sy = C.toScreenY(wy);
      if (r() < 0.62) {
        ctx.strokeStyle = 'rgba(70,150,80,0.45)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(sx - 3, sy); ctx.lineTo(sx - 4, sy - 5); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy - 7); ctx.moveTo(sx + 3, sy); ctx.lineTo(sx + 4, sy - 5); ctx.stroke();
      } else {
        const fc = U.pick(['#ffffff', '#ffc2dc', '#fff3a3', '#c9b8ff', '#ffd1a6']);
        G.flowerPath(ctx, sx, sy - 2, 4.5, 5, r() * 2); ctx.fillStyle = fc; ctx.fill();
        ctx.lineWidth = 0.8; ctx.strokeStyle = 'rgba(120,90,140,0.4)'; ctx.stroke();
        ell(ctx, sx, sy - 2, 1.4, 1.4); ctx.fillStyle = '#ffcf4a'; ctx.fill();
      }
    }
    // cat statues at island corners (outside field)
    const statue = (x, y, flip) => {
      ctx.save(); ctx.translate(x, y); ctx.scale(flip, 1);
      ell(ctx, 0, 4, 22, 8); ctx.fillStyle = 'rgba(60,40,90,0.2)'; ctx.fill();
      ctx.beginPath(); G.roundRect(ctx, -18, -14, 36, 16, 5); outlined(ctx, '#e9def5', 2.6);
      ell(ctx, 0, -28, 14, 13); outlined(ctx, '#f7f0ff', 2.6);
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * 12, -44); ctx.lineTo(s * 10, -58); ctx.lineTo(s * 3, -48); ctx.closePath(); outlined(ctx, '#f7f0ff', 2.4); }
      ell(ctx, 0, -46, 13, 11); outlined(ctx, '#f7f0ff', 2.6);
      ctx.beginPath(); ctx.arc(-5, -46, 2.8, Math.PI * 1.15, Math.PI * 1.85); ctx.moveTo(7.8, -46); ctx.arc(5, -46, 2.8, Math.PI * 1.15, Math.PI * 1.85); ctx.lineWidth = 1.8; ctx.strokeStyle = INK; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(12, -22); ctx.quadraticCurveTo(24, -26, 20, -40); ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke(); ctx.lineWidth = 3; ctx.strokeStyle = '#f7f0ff'; ctx.stroke();
      ell(ctx, -4, -51, 4, 2); ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fill();
      ctx.restore();
    };
    statue(ISLAND.x + 26, ISLAND.y + 60, 1);
    statue(ISLAND.x + ISLAND.w - 26, ISLAND.y + 60, -1);
    statue(ISLAND.x + 26, ISLAND.y + ISLAND.h - 40, 1);
    statue(ISLAND.x + ISLAND.w - 26, ISLAND.y + ISLAND.h - 40, -1);
    // oversized flowers on island edges
    const bigFlower = (x, y, s, col) => {
      ctx.save(); ctx.translate(x, y);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-6 * s, -20 * s, 0, -38 * s); ctx.lineWidth = 5 * s; ctx.strokeStyle = '#4f9f5f'; ctx.stroke();
      ctx.beginPath(); ctx.ellipse(-8 * s, -18 * s, 9 * s, 4 * s, -0.6, 0, TAU); ctx.fillStyle = '#6cc07a'; ctx.fill();
      G.flowerPath(ctx, 0, -42 * s, 18 * s, 6, 0.3); outlined(ctx, col, 2.6);
      ell(ctx, 0, -42 * s, 6 * s, 6 * s); outlined(ctx, '#ffe36b', 2);
      ctx.restore();
    };
    bigFlower(ISLAND.x - 6, ISLAND.y + 240, 1.3, '#ffb3cf');
    bigFlower(ISLAND.x - 10, ISLAND.y + 520, 1.1, '#c9b8ff');
    bigFlower(ISLAND.x + ISLAND.w + 6, ISLAND.y + 300, 1.25, '#fff3a3');
    bigFlower(ISLAND.x + ISLAND.w + 8, ISLAND.y + 600, 1.1, '#ffb3cf');
    // lanterns by bridges
    for (const bx of C.BRIDGES) {
      for (const side of [-1, 1]) {
        for (const wy of [C.RIVER_TOP - 40, C.RIVER_BOT + 40]) {
          const x = C.toScreenX(bx + side * (C.BRIDGE_HW + 22)), y = C.toScreenY(wy);
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 24); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
          ctx.beginPath(); G.roundRect(ctx, x - 6, y - 36, 12, 14, 5); outlined(ctx, '#fff1b8', 2.2);
          ctx.drawImage(G.tex('glow', '#ffe89a'), x - 14, y - 43, 28, 28);
        }
      }
    }
  }

  function render(scale) {
    if (bg && bgScale === scale) return;
    bgScale = scale;
    bg = G.makeCanvas(C.VW * scale, C.VH * scale);
    const ctx = bg.getContext('2d');
    ctx.scale(scale, scale);
    drawSky(ctx);
    drawIsland(ctx);
    drawField(ctx);
    drawBridges(ctx);
    drawDecor(ctx);
  }

  /* ---------- animated overlays ---------- */
  let riverClip = null;
  function getRiverClip() {
    if (riverClip) return riverClip;
    const p = new Path2D();
    let x = 0;
    const bs = C.BRIDGES.slice().sort((a, b) => a - b);
    for (const b of bs) { p.rect(x, C.RIVER_TOP, b - C.BRIDGE_HW - x, C.RIVER_BOT - C.RIVER_TOP); x = b + C.BRIDGE_HW; }
    p.rect(x, C.RIVER_TOP, C.WW - x, C.RIVER_BOT - C.RIVER_TOP);
    riverClip = p;
    return p;
  }
  function drawRiver(ctx, t) {
    ctx.save();
    toWorld(ctx);
    ctx.clip(getRiverClip());
    ctx.lineCap = 'round';
    for (let row = 0; row < 4; row++) {
      const y = C.RIVER_TOP + 12 + row * 18;
      const speed = 22 + row * 6;
      ctx.strokeStyle = `rgba(255,255,255,${0.35 - row * 0.05})`;
      ctx.lineWidth = 3;
      for (let x = -80; x < C.WW + 80; x += 90) {
        const xx = ((x + t * speed * (row % 2 ? 1 : -1)) % (C.WW + 160) + C.WW + 160) % (C.WW + 160) - 80;
        ctx.beginPath(); ctx.moveTo(xx, y); ctx.quadraticCurveTo(xx + 12, y - 5, xx + 26, y); ctx.stroke();
      }
    }
    ctx.restore();
    // sparkles (screen space)
    for (let i = 0; i < 14; i++) {
      const ph = (t * 0.6 + i * 0.137) % 1;
      const wx = ((i * 97.3 + t * 18) % C.WW);
      if (C.BRIDGES.some((b) => Math.abs(wx - b) < C.BRIDGE_HW + 6)) continue;
      const wy = C.RIVER_TOP + 10 + ((i * 37) % (C.RIVER_BOT - C.RIVER_TOP - 20));
      const a = Math.sin(ph * Math.PI);
      ctx.globalAlpha = a * 0.9;
      const s = 4 + a * 5;
      ctx.drawImage(G.tex('sparkle', '#ffffff'), C.toScreenX(wx) - s, C.toScreenY(wy) - s, s * 2, s * 2);
    }
    ctx.globalAlpha = 1;
  }
  function drawAmbient(ctx, t) {
    // slow drifting clouds over sky panels
    for (let i = 0; i < 4; i++) {
      const side = i % 2 ? 1 : 0;
      const baseX = side ? 1640 : 0;
      const x = baseX + ((t * (6 + i * 2) + i * 130) % 340) - 40;
      const y = 200 + i * 150;
      drawCloud(ctx, x, y, 0.55 + (i % 3) * 0.12, 0.55, i === 1);
    }
  }

  return { render, drawBg: (ctx) => bg && ctx.drawImage(bg, 0, 0, C.VW, C.VH), drawRiver, drawAmbient, drawCloud, FIELD, ISLAND, getBg: () => bg };
})();

/* ---- 07_fx.js ---- */
/* =====================================================================
   FX: pooled particles, layered anime effects, damage numbers,
   screen shake / hit-stop / flash. Element themes live in NK.FX.hit().
   ===================================================================== */
'use strict';
NK.View = { s: 1, ox: 0, oy: 0, shakeX: 0, shakeY: 0 };
NK.View.reset = (ctx) => { const V = NK.View; ctx.setTransform(V.s, 0, 0, V.s, V.ox + V.shakeX * V.s, V.oy + V.shakeY * V.s); };
NK.View.resetNoShake = (ctx) => { const V = NK.View; ctx.setTransform(V.s, 0, 0, V.s, V.ox, V.oy); };

NK.FX = (() => {
  const U = NK.U, G = NK.G, C = NK.C, TAU = U.TAU;
  const MAX_P = 2600;
  const PSCALE = 2.0;           // global particle size multiplier
  const particles = [];
  const pool = new NK.Pool(() => ({}), 600);
  const effects = [];
  const numbers = [];
  const numPool = new NK.Pool(() => ({}), 60);
  const FX = { particles, effects, numbers, shake: 0, flash: 0, flashCol: '#ffffff', hitStop: 0, slowMo: 0, slowMoT: 0, vignette: 0, vignetteCol: '#ff4f7a', edgeGlow: 0 };

  /* ---------------- particles ---------------- */
  // o: {x,y,z,vx,vy,vz,g,drag,life,size,size1,rot,vr,shape,color,add,layer,alpha,fadeIn,stretch}
  FX.p = (o) => {
    if (particles.length >= MAX_P) return null;
    const p = pool.get();
    p.x = o.x; p.y = o.y; p.z = o.z || 0;
    p.vx = o.vx || 0; p.vy = o.vy || 0; p.vz = o.vz || 0;
    p.g = o.g || 0; p.drag = o.drag == null ? 1.5 : o.drag;
    p.life = p.max = o.life || 0.6;
    p.size = (o.size || 10) * PSCALE; p.size1 = o.size1 == null ? p.size * 0.4 : o.size1 * PSCALE;
    p.rot = o.rot == null ? Math.random() * TAU : o.rot; p.vr = o.vr || 0;
    p.tex = G.tex(o.shape || 'glow', o.color || '#ffffff');
    const sh = o.shape || 'glow';
    p.add = !!o.add && (sh === 'glow' || sh === 'softcircle');
    p.layer = o.layer == null ? 1 : o.layer; p.alpha = o.alpha == null ? 1 : o.alpha;
    p.fadeIn = o.fadeIn || 0; p.stretch = o.stretch || 0; p.floor = o.floor !== false;
    particles.push(p);
    return p;
  };
  // radial burst helper
  FX.burst = (x, y, z, n, o) => {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU;
      const sp = U.rand(o.speed * 0.4, o.speed);
      FX.p(Object.assign({}, o, {
        x, y, z,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 1.6,
        vz: o.vz != null ? U.rand(o.vz * 0.5, o.vz) : U.rand(-20, 60),
        size: U.rand(o.size * 0.6, o.size),
        life: U.rand(o.life * 0.6, o.life),
        color: Array.isArray(o.color) ? U.pick(o.color) : o.color,
        shape: Array.isArray(o.shape) ? U.pick(o.shape) : o.shape,
        vr: o.vr != null ? U.rand(-o.vr, o.vr) : 0,
      }));
    }
  };

  /* ---------------- effects ---------------- */
  FX.e = (o) => { o.t = 0; o.life = o.life || 0.5; effects.push(o); return o; };
  FX.ring = (x, y, r0, r1, color, life = 0.45, width = 6, add = true) => FX.e({ type: 'ring', x, y, r0, r1, color, life, width, add });
  FX.shock = (x, y, r, color, life = 0.3) => FX.e({ type: 'shock', x, y, r, color, life });
  FX.circle = (x, y, r, color, life = 1, opts = {}) => FX.e(Object.assign({ type: 'circle', x, y, r, color, life }, opts));
  FX.slash = (x, y, z, ang, size, color, life = 0.22, flip = 1) => FX.e({ type: 'slash', x, y, z, ang, size, color, life, flip });
  FX.beam = (x1, y1, z1, x2, y2, z2, style, width, life) => FX.e({ type: 'beam', x1, y1, z1, x2, y2, z2, style, width, life });
  FX.bolt = (x1, y1, z1, x2, y2, z2, color, life = 0.25, width = 4) => FX.e({ type: 'bolt', x1, y1, z1, x2, y2, z2, color, life, width, seed: Math.random() * 1000 });
  FX.impact = (x, y, z, size, color, life = 0.25) => FX.e({ type: 'impact', x, y, z, size: size * 1.3, color, life, rot: Math.random() * TAU });
  FX.text = (x, y, z, str, color, size = 22, life = 1.0) => FX.e({ type: 'text', x, y, z, str, color, size, life });
  FX.afterimage = (frame, x, y, z, flip, color, life = 0.3, scale = 1) => FX.e({ type: 'after', frame, x, y, z, flip, color, life, scale });
  FX.spirit = (x, y, z, team, scale = 1) => FX.e({ type: 'spirit', x, y, z, team, life: 1.4, scale, wob: Math.random() * TAU });
  FX.claw = (x, y, z, flip, color = '#ffffff') => FX.e({ type: 'claw', x, y, z, flip, color, life: 0.2 });
  FX.muzzle = (x, y, z, ang, color, size = 20) => FX.e({ type: 'muzzle', x, y, z, ang, color, size, life: 0.12 });
  FX.flame = (x1, y1, z1, x2, y2, z2, size = 1) => FX.e({ type: 'flame', x1, y1, z1, x2, y2, z2, size, life: 0.42, seed: Math.random() * 100 });

  FX.screenShake = (amt) => { if (NK.Settings.get('shake')) FX.shake = Math.min(24, Math.max(FX.shake, amt)); };
  FX.screenFlash = (amt, col = '#ffffff') => { FX.flash = Math.max(FX.flash, amt); FX.flashCol = col; };
  FX.doHitStop = (sec) => { FX.hitStop = Math.max(FX.hitStop, sec); };
  FX.doSlowMo = (sec, scale = 0.3) => { FX.slowMoT = sec; FX.slowMo = scale; };

  /* ---------------- damage numbers ---------------- */
  FX.number = (x, y, z, val, opts = {}) => {
    if (!NK.Settings.get('dmgNumbers')) return;
    if (opts.key != null) {
      for (const m of numbers) {
        if (m.key === opts.key && m.t < 0.16 && m.heal === !!opts.heal) { m.val += val; m.pop = 0; m.big = m.big || !!opts.big || m.val >= 300; return; }
      }
    }
    if (numbers.length > 70) return;
    const n = numPool.get();
    n.key = opts.key;
    n.x = x + U.rand(-12, 12); n.y = y; n.z = z + U.rand(-6, 10); n.val = val; n.t = 0; n.pop = 0;
    n.life = opts.big ? 1.0 : 0.75; n.big = !!opts.big; n.heal = !!opts.heal; n.shield = !!opts.shield;
    n.color = opts.color || (n.heal ? '#7dff9b' : n.big ? '#ffe45c' : '#ffffff');
    n.vx = U.rand(-20, 20);
    numbers.push(n);
  };

  /* ---------------- update ---------------- */
  FX.update = (dt, rdt) => {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles[i] = particles[particles.length - 1]; particles.pop(); pool.release(p); continue; }
      const d = Math.exp(-p.drag * dt);
      p.vx *= d; p.vy *= d; p.vz *= d;
      p.vz -= p.g * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      if (p.floor && p.z < 0) { p.z = 0; p.vz *= -0.3; }
      p.rot += p.vr * dt;
    }
    for (let i = effects.length - 1; i >= 0; i--) {
      const e = effects[i];
      e.t += dt;
      if (e.t >= e.life) { effects.splice(i, 1); }
    }
    for (let i = numbers.length - 1; i >= 0; i--) {
      const n = numbers[i];
      n.t += rdt; n.pop += rdt;
      n.x += n.vx * rdt;
      if (n.t >= n.life) { numbers.splice(i, 1); numPool.release(n); }
    }
    // camera juice (real time)
    FX.shake = Math.max(0, FX.shake - rdt * 40);
    FX.flash = Math.max(0, FX.flash - rdt * 3.5);
    FX.vignette = Math.max(0, FX.vignette - rdt * 1.8);
    FX.edgeGlow = Math.max(0, FX.edgeGlow - rdt * 0.6);
    const V = NK.View;
    if (FX.shake > 0.1) { V.shakeX = U.rand(-1, 1) * FX.shake; V.shakeY = U.rand(-1, 1) * FX.shake * 0.7; }
    else { V.shakeX = 0; V.shakeY = 0; }
  };
  FX.clear = () => {
    for (const p of particles) pool.release(p);
    particles.length = 0; effects.length = 0;
    for (const n of numbers) numPool.release(n);
    numbers.length = 0;
    FX.shake = FX.flash = FX.hitStop = FX.slowMoT = FX.vignette = FX.edgeGlow = 0;
  };

  /* ---------------- drawing ---------------- */
  const sx = C.toScreenX, sy = C.toScreenY;
  function drawParticles(ctx, layer) {
    const V = NK.View;
    const baseX = V.ox + V.shakeX * V.s, baseY = V.oy + V.shakeY * V.s;
    for (let pass = 0; pass < 2; pass++) {
      const add = pass === 1;
      ctx.globalCompositeOperation = add ? 'lighter' : 'source-over';
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (p.add !== add || p.layer !== layer) continue;
        const t = 1 - p.life / p.max;
        let a = p.alpha * (t < 0.7 ? 1 : 1 - (t - 0.7) / 0.3);
        if (p.fadeIn && t < p.fadeIn) a *= t / p.fadeIn;
        if (a <= 0.01) continue;
        const size = U.lerp(p.size, p.size1, t);
        const X = sx(p.x), Y = sy(p.y) - p.z;
        ctx.globalAlpha = a;
        let rot = p.rot, scx = size / G.TEX, scy = scx;
        if (p.stretch) {
          const vsx = p.vx * C.SX, vsy = p.vy * C.SY - p.vz;
          rot = Math.atan2(vsy, vsx);
          scx *= 1 + Math.min(3, Math.hypot(vsx, vsy) * p.stretch * 0.01);
        }
        const c = Math.cos(rot) * V.s, s = Math.sin(rot) * V.s;
        ctx.setTransform(c * scx, s * scx, -s * scy, c * scy, baseX + X * V.s, baseY + Y * V.s);
        ctx.drawImage(p.tex, -G.TEX / 2, -G.TEX / 2);
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    NK.View.reset(ctx);
  }

  function ellipseW(ctx, x, y, r) { ctx.beginPath(); ctx.ellipse(sx(x), sy(y), Math.max(0.1, r * C.SX), Math.max(0.1, r * C.SY), 0, 0, TAU); }

  const drawers = {
    ring(ctx, e, k) {
      const r = U.lerp(e.r0, e.r1, U.easeOutCubic(k));
      ellipseW(ctx, e.x, e.y, r);
      ctx.globalAlpha = (1 - k) * 0.9;
      const lw = e.width * (1 - k * 0.6);
      ctx.lineWidth = lw + 3; ctx.strokeStyle = 'rgba(74,45,92,0.18)'; ctx.stroke();
      ctx.lineWidth = lw; ctx.strokeStyle = e.color; ctx.stroke();
      ctx.lineWidth = Math.max(1, lw * 0.35); ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.stroke();
    },
    shock(ctx, e, k) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = (1 - k) * 0.8;
      const r = e.r * (0.6 + 0.4 * U.easeOutCubic(k));
      const X = sx(e.x), Y = sy(e.y);
      ctx.drawImage(G.tex('glow', e.color), X - r * C.SX * 1.3, Y - r * C.SY * 1.3, r * C.SX * 2.6, r * C.SY * 2.6);
      ctx.globalCompositeOperation = 'source-over';
    },
    circle(ctx, e, k) {
      // rotating magic circle on the ground
      const fade = e.fadeOut ? Math.min(1, (1 - k) * 4) : 1;
      const grow = U.easeOutBack(Math.min(1, e.t / 0.25));
      const X = sx(e.x), Y = sy(e.y);
      ctx.save();
      ctx.translate(X, Y); ctx.scale(C.SX, C.SY);
      ctx.globalAlpha = fade * (e.alpha || 0.9);
      const r = e.r * grow;
      if (e.fill) {
        ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
        const fg = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r);
        fg.addColorStop(0, U.rgba(e.color, 0.05)); fg.addColorStop(1, U.rgba(e.color, 0.32));
        ctx.fillStyle = fg; ctx.fill();
      }
      ctx.rotate(e.t * (e.spin || 1.2));
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
      ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(74,45,92,0.28)'; ctx.stroke();
      ctx.lineWidth = 3.2; ctx.strokeStyle = e.color; ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, r * 0.82, 0, TAU); ctx.lineWidth = 1.8; ctx.stroke();
      // runes (ticks)
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * TAU;
        ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * 0.84, Math.sin(a) * r * 0.84); ctx.lineTo(Math.cos(a) * r * (i % 2 ? 0.93 : 0.98), Math.sin(a) * r * (i % 2 ? 0.93 : 0.98)); ctx.stroke();
      }
      ctx.rotate(-e.t * (e.spin || 1.2) * 2);
      G.starPath(ctx, 0, 0, r * 0.8, r * 0.33, e.points || 5);
      ctx.lineWidth = 2.4; ctx.stroke();
      ctx.restore();
    },
    slash(ctx, e, k) {
      const X = sx(e.x), Y = sy(e.y) - (e.z || 0);
      ctx.save();
      ctx.translate(X, Y); ctx.rotate(e.ang); ctx.scale(e.flip, 0.8);
      const sweep = U.easeOutCubic(Math.min(1, k * 1.8));
      const a0 = -1.25, a1 = a0 + 2.5 * sweep;
      const R = e.size;
      const fade = 1 - k * k;
      // crescent body
      ctx.beginPath();
      ctx.arc(0, 0, R, a0, a1);
      ctx.arc(R * 0.34, 0, R * 0.7, a1, a0, true);
      ctx.closePath();
      ctx.globalAlpha = fade;
      const g = ctx.createRadialGradient(0, 0, R * 0.55, 0, 0, R);
      g.addColorStop(0, U.rgba(e.color, 0.2)); g.addColorStop(0.45, U.rgba(e.color, 0.95)); g.addColorStop(0.85, '#ffffff'); g.addColorStop(1, '#ffffff');
      ctx.fillStyle = g; ctx.fill();
      ctx.lineWidth = 2.2; ctx.strokeStyle = U.rgba(U.shade(e.color, -0.45), 0.85); ctx.stroke();
      // bright edge + glint
      ctx.beginPath(); ctx.arc(0, 0, R, a0 + 0.25, a1); ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff'; ctx.stroke();
      const ga = a1;
      ctx.drawImage(G.tex('sparkle', '#ffffff'), Math.cos(ga) * R - 8, Math.sin(ga) * R - 8, 16, 16);
      ctx.restore();
    },
    claw(ctx, e, k) {
      const X = sx(e.x), Y = sy(e.y) - e.z;
      ctx.save(); ctx.translate(X, Y); ctx.scale(e.flip, 1);
      ctx.globalAlpha = 1 - k;
      ctx.lineCap = 'round';
      const L = 24 * Math.min(1, k * 4);
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath(); ctx.moveTo(-10 + i * 7, -12 + i * 2); ctx.lineTo(-10 + i * 7 + L * 0.7, -12 + i * 2 + L);
        ctx.lineWidth = 6; ctx.strokeStyle = C.INK; ctx.stroke();
        ctx.lineWidth = 3.4; ctx.strokeStyle = '#ffb3d9'; ctx.stroke();
        ctx.lineWidth = 1.4; ctx.strokeStyle = '#ffffff'; ctx.stroke();
      }
      ctx.restore();
    },
    beam(ctx, e, k) {
      const X1 = sx(e.x1), Y1 = sy(e.y1) - e.z1, X2 = sx(e.x2), Y2 = sy(e.y2) - e.z2;
      const ang = Math.atan2(Y2 - Y1, X2 - X1), len = Math.hypot(X2 - X1, Y2 - Y1);
      const grow = Math.min(1, e.t / 0.07);
      const w = e.width * (k < 0.65 ? 1 : 1 - (k - 0.65) / 0.35) * (0.88 + Math.sin(e.t * 60) * 0.12);
      if (w <= 0.5) return;
      ctx.save(); ctx.translate(X1, Y1); ctx.rotate(ang);
      const L = len * grow;
      const band = (hw, fill, alpha = 1) => { ctx.globalAlpha = alpha; ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(0, -hw * 0.8); ctx.lineTo(L, -hw); ctx.arc(L, 0, hw, -Math.PI / 2, Math.PI / 2); ctx.lineTo(0, hw * 0.8); ctx.closePath(); ctx.fill(); };
      if (e.style === 'rainbow') {
        band(w * 0.62, 'rgba(74,45,92,0.25)');
        const cols = ['#ff5c9a', '#ff9f4d', '#ffe14d', '#5fe08a', '#4fc3ff', '#a97bff'];
        const g = ctx.createLinearGradient(0, -w * 0.55, 0, w * 0.55);
        cols.forEach((c, i) => g.addColorStop(i / (cols.length - 1), c));
        band(w * 0.55, g, 0.95);
        band(w * 0.22, '#ffffff', 0.95);
        // sparkle rings travelling along the beam
        ctx.globalAlpha = 1;
        for (let i = 0; i < 4; i++) {
          const px = ((e.t * 900 + i * L / 4) % Math.max(1, L));
          ctx.drawImage(G.tex('sparkle', '#ffffff'), px - 12, -12, 24, 24);
        }
      } else {
        const col = e.style === 'holy' ? '#ffd84a' : e.style === 'dark' ? '#a45cff' : e.style === 'team0' ? '#4fb3ff' : e.style === 'team1' ? '#ff5c8d' : e.style;
        band(w * 0.6, 'rgba(74,45,92,0.2)');
        band(w * 0.5, col, 0.9);
        band(w * 0.2, '#ffffff', 1);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(G.tex('glow', '#ffffff'), L - w * 1.2, -w * 1.2, w * 2.4, w * 2.4);
      ctx.drawImage(G.tex('glow', '#ffffff'), -w, -w, w * 2, w * 2);
      ctx.restore();
      ctx.globalCompositeOperation = 'source-over';
    },
    bolt(ctx, e, k) {
      const X1 = sx(e.x1), Y1 = sy(e.y1) - e.z1, X2 = sx(e.x2), Y2 = sy(e.y2) - e.z2;
      const segs = 9;
      const pts = [[X1, Y1]];
      const dx = X2 - X1, dy = Y2 - Y1, L = Math.hypot(dx, dy) || 1;
      const nx = -dy / L, ny = dx / L;
      const seed = Math.floor(e.t * 30) + e.seed;
      for (let i = 1; i < segs; i++) {
        const t = i / segs;
        const j = (Math.sin(seed * 12.9898 + i * 78.233) * 43758.5453) % 1;
        const off = (j - 0.5) * Math.min(40, L * 0.25);
        pts.push([X1 + dx * t + nx * off, Y1 + dy * t + ny * off]);
      }
      pts.push([X2, Y2]);
      ctx.globalAlpha = 1 - k;
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      for (const [w, c] of [[e.width * 3.4, U.rgba(e.color, 0.3)], [e.width * 1.6, 'rgba(120,80,20,0.55)'], [e.width, e.color], [e.width * 0.45, '#ffffff']]) {
        ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
        ctx.lineWidth = w; ctx.strokeStyle = c; ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    },
    impact(ctx, e, k) {
      const X = sx(e.x), Y = sy(e.y) - e.z;
      const s = e.size * U.easeOutBack(Math.min(1, k * 3)) * (1 - k * 0.3);
      ctx.save(); ctx.translate(X, Y); ctx.rotate(e.rot);
      ctx.globalAlpha = 1 - k;
      G.starPath(ctx, 0, 0, s, s * 0.42, 8);
      ctx.fillStyle = U.rgba(e.color, 0.9); ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = U.rgba(U.shade(e.color, -0.4), 0.7); ctx.stroke();
      G.starPath(ctx, 0, 0, s * 0.55, s * 0.25, 8);
      ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.restore();
    },
    text(ctx, e, k) {
      const X = sx(e.x), Y = sy(e.y) - e.z - k * 40;
      const s = U.easeOutBack(Math.min(1, k * 5));
      ctx.globalAlpha = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
      ctx.save(); ctx.translate(X, Y); ctx.scale(s, s);
      G.text(ctx, e.str, 0, 0, { size: e.size, color: e.color, stroke: C.INK, strokeW: 5, display: true });
      ctx.restore();
    },
    after(ctx, e, k) {
      const f = e.frame;
      const X = sx(e.x), Y = sy(e.y) - e.z;
      ctx.globalAlpha = (1 - k) * 0.55;
      ctx.save(); ctx.translate(X, Y); ctx.scale(e.flip * e.scale, e.scale);
      const tint = NK.CatArt.getTint(f, e.color);
      ctx.drawImage(tint, -f.ox, -f.oy, f.w, f.h);
      ctx.restore();
    },
    spirit(ctx, e, k) {
      const X = sx(e.x) + Math.sin(e.t * 5 + e.wob) * 8, Y = sy(e.y) - e.z - k * 70;
      ctx.globalAlpha = (k < 0.15 ? k / 0.15 : 1 - (k - 0.15) / 0.85) * 0.85;
      NK.CatArt.drawTo(ctx, 'ghostKit', e.team, 'idle1', X, Y, e.scale * 0.9);
    },
    fall(ctx, e, k) {
      const f = e.frame;
      const X = sx(e.x) - e.flip * k * 18, Y = sy(e.y) - e.z - Math.sin(Math.min(1, k * 1.6) * Math.PI) * 22;
      ctx.globalAlpha = k < 0.55 ? 1 : 1 - (k - 0.55) / 0.45;
      ctx.save(); ctx.translate(X, Y); ctx.rotate(-e.flip * U.easeOutCubic(Math.min(1, k * 1.4)) * 1.7); ctx.scale(e.flip, 1);
      ctx.drawImage(f.canvas, -f.ox, -f.oy, f.w, f.h);
      ctx.restore();
    },
    flame(ctx, e, k) {
      // a stream of layered fire puffs from mouth to target
      const X1 = sx(e.x1), Y1 = sy(e.y1) - e.z1, X2 = sx(e.x2), Y2 = sy(e.y2) - e.z2;
      const reach = U.easeOutCubic(Math.min(1, e.t / 0.14));
      const fade = k < 0.6 ? 1 : 1 - (k - 0.6) / 0.4;
      const N = 11;
      const cols = [['#ffffff', '#ffe27a'], ['#ffd24d', '#ff8a4d'], ['#ff9a6b', '#ff4f8f']];
      for (let layer = 2; layer >= 0; layer--) {
        for (let i = 0; i < N; i++) {
          const t = (i / (N - 1)) * reach;
          const wob = Math.sin(e.t * 30 + i * 1.7 + e.seed) * 5 * t;
          const px = U.lerp(X1, X2, t) + wob, py = U.lerp(Y1, Y2, t) + Math.cos(e.t * 26 + i) * 4 * t;
          const r = (6 + 22 * t) * e.size * (0.44 + layer * 0.28) * (0.85 + 0.15 * Math.sin(e.t * 40 + i));
          ctx.globalAlpha = fade * (layer === 2 ? 0.75 : 0.95);
          const g = ctx.createRadialGradient(px, py, r * 0.1, px, py, r);
          g.addColorStop(0, cols[layer][0]); g.addColorStop(1, U.rgba(cols[layer][1], layer === 2 ? 0 : 0.2));
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(px, py, r, 0, TAU); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
    },
    muzzle(ctx, e, k) {
      const X = sx(e.x), Y = sy(e.y) - e.z;
      ctx.save(); ctx.translate(X, Y); ctx.rotate(e.ang);
      ctx.globalAlpha = 1 - k;
      const s = e.size * (0.7 + k);
      G.starPath(ctx, s * 0.5, 0, s, s * 0.35, 6);
      ctx.fillStyle = e.color; ctx.fill();
      G.starPath(ctx, s * 0.5, 0, s * 0.5, s * 0.2, 6); ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(G.tex('glow', '#ffffff'), -s * 0.3, -s * 0.8, s * 1.6, s * 1.6);
      ctx.restore();
      ctx.globalCompositeOperation = 'source-over';
    },
  };

  FX.drawGround = (ctx) => {
    for (const e of effects) {
      if (e.type === 'ring' || e.type === 'shock' || e.type === 'circle') {
        drawers[e.type](ctx, e, e.t / e.life);
      }
    }
    ctx.globalAlpha = 1;
    drawParticles(ctx, 0);
  };
  FX.drawTop = (ctx) => {
    drawParticles(ctx, 1);
    for (const e of effects) {
      if (e.type === 'ring' || e.type === 'shock' || e.type === 'circle') continue;
      drawers[e.type](ctx, e, e.t / e.life);
      ctx.globalAlpha = 1;
    }
  };
  FX.drawNumbers = (ctx) => {
    for (const n of numbers) {
      const k = n.t / n.life;
      const X = sx(n.x), Y = sy(n.y) - n.z - 30 * U.easeOutCubic(k) - 10;
      const pk = n.pop / n.life;
      const pop = pk < 0.15 ? U.lerp(1.6, 1, pk / 0.15) : 1;
      const s = (n.big ? 27 : 18) * pop;
      ctx.globalAlpha = k > 0.6 ? 1 - (k - 0.6) / 0.4 : 1;
      G.text(ctx, (n.heal ? '+' : '') + Math.round(n.val), X, Y, { size: s, color: n.color, stroke: n.heal ? '#1f6b3a' : C.INK, strokeW: n.big ? 6 : 4.5, weight: 900 });
    }
    ctx.globalAlpha = 1;
  };
  FX.drawScreen = (ctx) => {
    if (FX.flash > 0.01) {
      ctx.globalAlpha = Math.min(0.85, FX.flash);
      ctx.fillStyle = FX.flashCol; ctx.fillRect(-2400, -1200, C.VW + 4800, C.VH + 2400);
      ctx.globalAlpha = 1;
    }
    if (FX.vignette > 0.01) {
      const g = ctx.createRadialGradient(C.VW / 2, C.VH * 0.55, C.VH * 0.45, C.VW / 2, C.VH * 0.55, C.VH * 0.95);
      g.addColorStop(0, U.rgba(FX.vignetteCol, 0)); g.addColorStop(1, U.rgba(FX.vignetteCol, Math.min(0.55, FX.vignette)));
      ctx.fillStyle = g; ctx.fillRect(-2400, -1200, C.VW + 4800, C.VH + 2400);
    }
  };

  /* =====================================================================
     Element presets
     ===================================================================== */
  const PAL = {
    fire: ['#ff6b9e', '#ff9a4d', '#ffd166', '#ff7a6b'],
    ice: ['#7fe6ff', '#bff3ff', '#ffffff', '#5fd4f5'],
    lightning: ['#fff27a', '#ffffff', '#ffe066'],
    dark: ['#b27bff', '#7b3fd6', '#e0b8ff', '#5a2a9a'],
    heal: ['#7dff9b', '#ffb3d9', '#c9ffb8', '#ffffff'],
    holy: ['#ffe27a', '#fff6c8', '#ffffff', '#ffd0a0'],
    star: ['#ffe066', '#fff3a3', '#ffffff'],
    arcane: ['#c49bff', '#ff9fe0', '#ffffff', '#8fb8ff'],
    rainbow: ['#ff6b9e', '#ffb86b', '#fff06b', '#7dff9b', '#6bd6ff', '#b58cff'],
    slash: ['#bff3ff', '#ffffff', '#9fe8ff'],
    yarn: ['#ff9ec0', '#9fd8ff', '#fff3a3', '#c9b8ff'],
  };
  FX.PAL = PAL;

  // generic hit by element. power ~ 0.5 (small) .. 2 (huge)
  FX.hit = (el, x, y, z, power = 1, dir = 0) => {
    const pw = power;
    switch (el) {
      case 'slash':
        FX.burst(x, y, z, 5 + pw * 3, { speed: 160 * pw, size: 12, life: 0.3, shape: 'streak', color: PAL.slash, add: true, stretch: 1, g: 0, drag: 5, layer: 1 });
        FX.impact(x, y, z, 16 * pw, '#bff3ff', 0.18);
        break;
      case 'scratch':
        FX.burst(x, y, z, 3, { speed: 90, size: 9, life: 0.25, shape: 'sparkle', color: '#ffffff', add: true, drag: 4 });
        break;
      case 'bonk':
        FX.impact(x, y, z, 26 * pw, '#ffe066', 0.25);
        FX.burst(x, y, z, 6, { speed: 130, size: 14, life: 0.45, shape: 'star', color: PAL.star, add: false, g: 200, vz: 120, vr: 8 });
        FX.burst(x, y, 2, 4, { speed: 60, size: 22, life: 0.6, shape: 'smoke', color: '#fff4ea', drag: 3, layer: 1 });
        break;
      case 'star':
        FX.burst(x, y, z, 4 + pw * 3, { speed: 120 * pw, size: 12, life: 0.4, shape: ['star', 'sparkle'], color: PAL.star, add: true, drag: 4, vr: 6 });
        FX.impact(x, y, z, 14 * pw, '#ffe066', 0.16);
        break;
      case 'arcane':
        FX.ring(x, y, 10, 70 * pw, '#d6a8ff', 0.4, 5);
        FX.burst(x, y, z, 10 * pw, { speed: 170 * pw, size: 14, life: 0.5, shape: ['star', 'sparkle'], color: PAL.arcane, add: true, drag: 3.5, vr: 6 });
        FX.shock(x, y, 60 * pw, '#c49bff', 0.3);
        FX.impact(x, y, z, 22 * pw, '#e0b8ff', 0.2);
        break;
      case 'fire':
        FX.burst(x, y, z, 14 * pw, { speed: 160 * pw, size: 20, life: 0.65, shape: 'glowheart', color: PAL.fire, drag: 3, vz: 90, g: -30 });
        FX.impact(x, y, z, 26 * pw, '#ffb84d', 0.22);
        FX.burst(x, y, z, 4 * pw, { speed: 60, size: 26, life: 0.7, shape: 'smoke', color: '#ffd9e6', drag: 3, vz: 60, g: -40, alpha: 0.8 });
        FX.shock(x, y, 70 * pw, '#ff8a6b', 0.3);
        break;
      case 'ice':
        FX.burst(x, y, z, 10 * pw, { speed: 170 * pw, size: 18, life: 0.6, shape: ['snow', 'shard', 'shard'], color: PAL.ice, add: false, drag: 3, vr: 5, g: 160, vz: 110 });
        FX.impact(x, y, z, 20 * pw, '#bff3ff', 0.2);
        FX.burst(x, y, z, 5, { speed: 90, size: 12, life: 0.4, shape: 'sparkle', color: '#bff3ff', add: true, drag: 4 });
        FX.ring(x, y, 8, 55 * pw, '#9fe8ff', 0.35, 4);
        break;
      case 'lightning':
        FX.burst(x, y, z, 10 * pw, { speed: 260 * pw, size: 12, life: 0.3, shape: 'streak', color: PAL.lightning, add: true, stretch: 1.5, drag: 6 });
        FX.impact(x, y, z, 26 * pw, '#fff27a', 0.2);
        break;
      case 'dark':
        FX.burst(x, y, z, 6 + 4 * pw, { speed: 120 * pw, size: 14, life: 0.55, shape: ['moon', 'sparkle', 'star'], color: PAL.dark, add: true, drag: 3.5, vr: 6 });
        FX.circle(x, y, 26 * pw, '#b27bff', 0.45, { spin: 5, fadeOut: true, points: 5 });
        break;
      case 'holy':
        FX.burst(x, y, z, 6 * pw, { speed: 110, size: 13, life: 0.5, shape: ['star', 'sparkle'], color: PAL.holy, add: true, drag: 4 });
        FX.burst(x, y, z, 2 * pw, { speed: 50, size: 14, life: 0.9, shape: 'feather', color: '#ffffff', drag: 2, g: 30, vz: 60, vr: 3 });
        FX.impact(x, y, z, 16 * pw, '#ffe27a', 0.18);
        break;
      case 'heal':
        FX.burst(x, y, z + 10, 4 * pw, { speed: 40, size: 14, life: 0.9, shape: ['heart', 'sparkle'], color: PAL.heal, add: false, drag: 2, vz: 70, g: -20 });
        break;
      case 'rainbow':
        FX.burst(x, y, z, 8 * pw, { speed: 200 * pw, size: 14, life: 0.5, shape: ['star', 'sparkle', 'glowheart'], color: PAL.rainbow, add: true, drag: 4, vr: 8 });
        FX.impact(x, y, z, 24 * pw, '#ffffff', 0.2);
        break;
      case 'yarn':
        FX.burst(x, y, z, 7, { speed: 120, size: 10, life: 0.45, shape: 'circle', color: PAL.yarn, drag: 4, g: 200, vz: 100 });
        FX.impact(x, y, z, 14, '#ffc2dc', 0.15);
        break;
      case 'boom':
        FX.shock(x, y, 120 * pw, '#ffb86b', 0.35);
        FX.ring(x, y, 20, 110 * pw, '#ffe066', 0.45, 7);
        FX.burst(x, y, z, 14 * pw, { speed: 220 * pw, size: 16, life: 0.6, shape: ['star', 'glowheart'], color: PAL.fire.concat(PAL.star), add: true, drag: 3, vz: 150, g: 250, vr: 8 });
        FX.burst(x, y, 4, 8 * pw, { speed: 110 * pw, size: 36, life: 0.9, shape: 'smoke', color: '#fff0f5', drag: 2.5, vz: 40, g: -20 });
        FX.burst(x, y, z, 5 * pw, { speed: 180, size: 12, life: 0.8, shape: 'debris', color: '#f2e3d2', g: 400, vz: 220, vr: 10 });
        FX.impact(x, y, z + 6, 40 * pw, '#fff3a3', 0.25);
        break;
      default:
        FX.burst(x, y, z, 4, { speed: 100, size: 10, life: 0.3, shape: 'sparkle', color: '#ffffff', add: true });
    }
  };

  // defeat effects
  FX.death = (kind, x, y, z, team, scale = 1, frame = null) => {
    FX.burst(x, y, z + 14 * scale, 5, { speed: 70 * scale, size: 30 * scale, life: 0.7, shape: 'smoke', color: '#ffffff', drag: 3, vz: 40, g: -15 });
    switch (kind) {
      case 'ghost': FX.spirit(x, y, z + 20, team, scale); FX.burst(x, y, z + 20, 6, { speed: 110, size: 12, life: 0.6, shape: 'star', color: PAL.star, add: true, drag: 3, vr: 6 }); break;
      case 'stars': FX.burst(x, y, z + 20, 14 * scale, { speed: 190, size: 15, life: 0.7, shape: ['star', 'sparkle'], color: PAL.star.concat(['#ffb3d9', '#bfe3ff']), add: true, drag: 3, vr: 8, vz: 90, g: 120 }); break;
      case 'feathers': FX.burst(x, y, z + 20, 10, { speed: 90, size: 16, life: 1.3, shape: 'feather', color: '#ffffff', drag: 1.5, vz: 50, g: 25, vr: 3 }); FX.spirit(x, y, z + 20, team, scale); break;
      case 'moons': FX.burst(x, y, z + 20, 10, { speed: 140, size: 15, life: 0.8, shape: ['moon', 'star'], color: PAL.dark, add: true, drag: 3, vr: 6 }); break;
      case 'snow': FX.burst(x, y, z + 20, 12, { speed: 130, size: 15, life: 0.9, shape: ['snow', 'sparkle'], color: PAL.ice, add: false, drag: 2.5, vr: 4, vz: 60, g: 60 }); break;
      case 'hearts': FX.burst(x, y, z + 20, 16, { speed: 200, size: 18, life: 0.9, shape: ['glowheart', 'star', 'sparkle'], color: PAL.rainbow, add: true, drag: 3, vr: 6 }); FX.ring(x, y, 10, 90, '#ff9fd0', 0.5, 6); break;
      case 'tumble': FX.burst(x, y, z + 10, 6, { speed: 90, size: 10, life: 0.5, shape: 'star', color: PAL.star, add: true, drag: 3, vr: 6 }); break;
      default: FX.burst(x, y, z + 14, 8, { speed: 120, size: 12, life: 0.6, shape: 'sparkle', color: '#ffffff', add: true, drag: 3 });
    }
  };

  // magic deploy circle + drop sparkles
  FX.deploy = (x, y, team, r = 30) => {
    const col = NK.C.TEAM[team].glow;
    FX.circle(x, y, r * 1.5, col, 0.9, { spin: 3, fadeOut: true, fill: true });
    FX.burst(x, y, 10, 10, { speed: 120, size: 12, life: 0.6, shape: ['sparkle', 'star'], color: [col, '#ffffff', '#ffe066'], add: true, drag: 3, vz: 100, g: 150 });
  };

  // ambient drifting petals/sparkles over the arena
  FX.ambient = (dt) => {
    if (Math.random() < dt * 3) {
      FX.p({ x: U.rand(0, C.WW), y: U.rand(0, C.WH), z: U.rand(40, 140), vx: U.rand(10, 30), vy: U.rand(-10, 10), vz: -6, g: 0, drag: 0,
        life: U.rand(4, 7), size: U.rand(8, 13), size1: 8, shape: U.pick(['petal', 'petal', 'sparkle']), color: U.pick(['#ffc2dc', '#ffffff', '#fff3a3']),
        vr: U.rand(-1.5, 1.5), alpha: 0.75, fadeIn: 0.15, layer: 1, floor: false });
    }
  };

  return FX;
})();

/* ---- 08_entities.js ---- */
/* =====================================================================
   Entities: Unit (data-driven cat AI), Structure (towers & buildings),
   Projectile (homing / lobbed magic). All read stats from NK.Units etc.
   ===================================================================== */
'use strict';
(() => {
  const U = NK.U, C = NK.C, FX = NK.FX, TAU = U.TAU;
  const sx = C.toScreenX, sy = C.toScreenY;
  const A = () => NK.Audio;
  let NEXT_ID = 1;

  /* shared bits for anything with HP */
  function initHealth(e, hp) {
    e.hp = e.maxHp = hp; e.dispHp = hp; e.trailHp = hp;
    e.hitT = 0; e.lastHit = -99; e.shield = 0; e.shieldMax = 0; e.shieldT = 0;
    e.slowT = 0; e.slowPct = 0; e.stunT = 0; e.dead = false;
  }
  function tickHealthBar(e, dt) {
    e.dispHp = U.damp(e.dispHp, e.hp, 18, dt);
    if (e.trailHp > e.dispHp) e.trailHp = Math.max(e.dispHp, e.trailHp - e.maxHp * dt * 0.6);
    else e.trailHp = e.dispHp;
  }

  /* =================================================================== */
  class Unit {
    constructor(M, key, team, x, y, opts = {}) {
      const def = NK.Units[key];
      this.id = NEXT_ID++;
      this.M = M; this.key = key; this.def = def; this.team = team;
      this.kind = 'unit';
      this.x = x; this.y = y;
      this.air = !!def.air;
      this.baseZ = def.air ? 48 : 0;
      this.z = this.baseZ;
      this.r = def.r; this.mass = def.mass;
      this.size = def.art.size;
      initHealth(this, def.hp);
      this.variant = opts.variant || 0;
      this.state = 'deploy';
      this.deployT = opts.deployT != null ? opts.deployT : 0.9;
      this.deployMax = this.deployT;
      this.dropT = opts.noDrop ? 0 : 0.38;
      this.target = null; this.engaged = false; this.inRange = false;
      this.retarget = Math.random() * 0.15;
      this.atkCd = 0; this.strikeT = 99; this.combo = 0;
      this.vx = 0; this.vy = 0; this.moving = false;
      this.face = team === 0 ? 1 : -1;
      this.animT = Math.random() * 10;
      this.sq = 0; this.sqV = 0;          // squash spring
      this.hurtT = 0; this.hurtCd = 0;
      this.healT = def.heal ? def.heal.every * 0.6 : 0;
      this.summonT = def.summon ? def.summon.every : 0;
      this.dashCd = 0; this.dashing = false; this.afterT = 0;
      this.stepT = 0;
      this.hover = false;
      this.spawnFromSummon = !!opts.summoned;
    }
    get targetable() { return !this.dead && !this.dashing; }
    impulse(v) { this.sqV += v; }

    update(dt) {
      const M = this.M, def = this.def;
      this.animT += dt;
      // squash spring
      this.sqV += (-220 * this.sq - 14 * this.sqV) * dt;
      this.sq += this.sqV * dt;
      this.hitT = Math.max(0, this.hitT - dt);
      this.hurtT = Math.max(0, this.hurtT - dt);
      this.hurtCd = Math.max(0, this.hurtCd - dt);
      this.strikeT += dt;
      tickHealthBar(this, dt);
      if (this.shieldT > 0) { this.shieldT -= dt; if (this.shieldT <= 0) { this.popShield(); } }
      if (this.slowT > 0) { this.slowT -= dt; if (Math.random() < dt * 4) FX.p({ x: this.x + U.rand(-10, 10), y: this.y, z: this.z + 20 + Math.random() * 20, vz: 20, life: 0.8, size: 10, shape: 'snow', color: '#bff3ff', drag: 1, layer: 1 }); }

      if (this.state === 'deploy') {
        this.deployT -= dt;
        const fall = this.deployMax - this.deployT;
        if (this.dropT > 0 && fall < this.dropT) {
          const k = fall / this.dropT;
          this.z = this.baseZ + (1 - k * k) * 260;
        } else {
          if (this.z > this.baseZ + 0.5) { this.land(); }
          this.z = this.baseZ;
        }
        if (this.deployT <= 0) {
          if (this.z > this.baseZ + 0.5) this.land();
          this.z = this.baseZ;
          this.state = 'active';
          if (def.summon && def.summon.onDeploy) this.doSummon();
        }
        return;
      }
      if (this.air) this.z = this.baseZ + Math.sin(this.animT * 3) * 4;

      if (this.stunT > 0) {
        this.stunT -= dt; this.vx = this.vy = 0; this.moving = false;
        return;
      }
      const slowMul = this.slowT > 0 ? 1 - this.slowPct : 1;

      // specials
      if (def.heal) {
        this.healT -= dt;
        if (this.healT <= 0) { this.healT = def.heal.every; this.doHeal(); }
      }
      if (def.summon) {
        this.summonT -= dt * slowMul;
        if (this.summonT <= 0) { this.summonT = def.summon.every; this.doSummon(); }
      }
      this.dashCd = Math.max(0, this.dashCd - dt);

      // target validity
      if (this.target && (this.target.dead || !M.canHit(this, this.target) || (this.target.dashing))) {
        this.target = null; this.engaged = false; this.inRange = false; this.retarget = 0;
      }
      if (this.dashing) { this.updateDash(dt); return; }

      this.retarget -= dt;
      if (!this.engaged && this.retarget <= 0) {
        this.retarget = 0.22 + Math.random() * 0.1;
        const nt = M.findTarget(this);
        if (nt && nt !== this.target) {
          if (!this.target) this.target = nt;
          else {
            const dOld = U.dist(this.x, this.y, this.target.x, this.target.y) - this.target.r;
            const dNew = U.dist(this.x, this.y, nt.x, nt.y) - nt.r;
            const oldIsDefault = this.target.kind !== 'unit' && nt.kind === 'unit';
            if (oldIsDefault || dNew < dOld * 0.8) this.target = nt;
          }
        } else if (!nt) this.target = null;
      }
      const t = this.target;
      if (this.wasMoving && !this.moving) this.impulse(-3 - this.size * 3);   // little wobble when stopping
      this.wasMoving = this.moving;
      if (!t) { this.moving = false; this.vx = this.vy = 0; return; }

      const dist = U.dist(this.x, this.y, t.x, t.y);
      const edge = dist - this.r - t.r;
      const a = def.attack;
      if (edge <= a.range + (this.engaged ? 10 : 0)) {
        // ---- attack ----
        this.engaged = true;
        this.moving = false;
        this.vx = U.damp(this.vx, 0, 12, dt); this.vy = U.damp(this.vy, 0, 12, dt);
        if (Math.abs(t.x - this.x) > 4) this.face = t.x > this.x ? 1 : -1;
        if (!this.inRange) { this.inRange = true; this.atkCd = Math.max(this.atkCd, a.windup); }
        const before = this.atkCd;
        this.atkCd -= dt * slowMul;
        if (before > a.windup && this.atkCd <= a.windup) this.onWindup();
        if (this.atkCd <= 0) {
          this.performAttack();
          this.atkCd = a.rate;
          this.strikeT = 0;
        }
      } else {
        this.inRange = false; this.engaged = false;
        this.atkCd = Math.max(0, this.atkCd - dt);
        // ninja dash
        if (def.dash && this.dashCd <= 0 && !t.air && edge > def.dash.min && edge < def.dash.max && M.sameSideOrBridge(this, t)) {
          this.startDash(); return;
        }
        this.moveToward(t, dt, slowMul);
      }
    }

    moveToward(t, dt, slowMul) {
      const M = this.M;
      const [gx, gy] = M.pathGoal(this, t.x, t.y);
      let dx = gx - this.x, dy = gy - this.y;
      const L = Math.hypot(dx, dy) || 1;
      dx /= L; dy /= L;
      // structure avoidance (steer around towers that aren't our target)
      if (!this.air) {
        for (const s of M.structures) {
          if (s === t || s.dead) continue;
          const ox = s.x - this.x, oy = s.y - this.y;
          const od = Math.hypot(ox, oy);
          const clear = s.r + this.r + 6;
          if (od > clear + 90) continue;
          const along = ox * dx + oy * dy;
          if (along <= 0) continue;
          const perp = ox * dy - oy * dx; // signed
          if (Math.abs(perp) < clear) {
            const side = perp >= 0 ? 1 : -1;
            const w = (1 - Math.abs(perp) / clear) * 1.6;
            // tangent steering away from the obstacle
            const tx = -dy * side, ty = dx * side;
            dx = dx + tx * w; dy = dy + ty * w;
            const l2 = Math.hypot(dx, dy) || 1; dx /= l2; dy /= l2;
          }
        }
      }
      const sp = this.def.speed * slowMul;
      this.vx = U.damp(this.vx, dx * sp, 10, dt);
      this.vy = U.damp(this.vy, dy * sp, 10, dt);
      this.x += this.vx * dt; this.y += this.vy * dt;
      this.moving = true;
      if (Math.abs(this.vx) > 6) this.face = this.vx > 0 ? 1 : -1;
      // footsteps
      if (this.def.footsteps) {
        this.stepT -= dt;
        if (this.stepT <= 0) {
          this.stepT = 0.42;
          FX.burst(this.x + U.rand(-10, 10), this.y + 6, 2, 3, { speed: 40, size: 18, life: 0.5, shape: 'smoke', color: '#fff6ee', drag: 3, vz: 20, g: -10, alpha: 0.8, layer: 0 });
          if (Math.random() < 0.35) A().sfx('step', { x: this.x, vol: 0.35 });
        }
      }
    }

    startDash() {
      this.dashing = true; this.engaged = false;
      this.afterT = 0;
      A().sfx('dash', { x: this.x });
      FX.burst(this.x, this.y, 20, 8, { speed: 80, size: 22, life: 0.4, shape: 'smoke', color: '#d9d2ff', drag: 3 });
    }
    updateDash(dt) {
      const t = this.target;
      if (!t || t.dead) { this.dashing = false; this.dashCd = 0.3; return; }
      const d = U.dist(this.x, this.y, t.x, t.y);
      const edge = d - this.r - t.r;
      const step = this.def.dash.speed * dt;
      this.afterT -= dt;
      if (this.afterT <= 0) {
        this.afterT = 0.035;
        const fr = NK.CatArt.getFrame(this.key, this.def.art, this.team, 'walk0', this.variant);
        FX.afterimage(fr, this.x, this.y, this.z, this.face, C.TEAM[this.team].glow, 0.28, 1);
      }
      if (edge <= this.def.attack.range + step) {
        // arrive + slash
        const k = Math.max(0, (d - this.r - t.r - this.def.attack.range + 2) / (d || 1));
        this.x += (t.x - this.x) * k; this.y += (t.y - this.y) * k;
        this.dashing = false;
        this.dashCd = this.def.dash.cd;
        this.engaged = true; this.inRange = true;
        this.performAttack(this.def.dash.mult);
        this.atkCd = this.def.attack.rate; this.strikeT = 0;
        FX.screenShake(4);
        return;
      }
      const dx = (t.x - this.x) / d, dy = (t.y - this.y) / d;
      this.x += dx * step; this.y += dy * step;
      this.face = dx > 0 ? 1 : -1;
      this.moving = true;
    }

    land() {
      this.impulse(-9);
      const big = this.size > 1.2;
      FX.burst(this.x, this.y, 2, big ? 8 : 5, { speed: big ? 110 : 70, size: big ? 26 : 16, life: 0.5, shape: 'smoke', color: '#ffffff', drag: 3.5, vz: 20, g: -10, layer: 0 });
      FX.ring(this.x, this.y, this.r * 0.6, this.r * 2.2, C.TEAM[this.team].glow, 0.35, 4);
      if (big) { FX.screenShake(3); A().sfx('thud', { x: this.x }); }
      else A().sfx('land', { x: this.x, pitch: 1 / this.size });
    }

    onWindup() {
      const a = this.def.attack;
      if (a.kind === 'beam') {
        // magical girl charge: magic circle + converging sparkles
        FX.circle(this.x, this.y, 40, '#ff9fd0', a.windup + 0.2, { spin: 4, fadeOut: true, fill: true, points: 6 });
        for (let i = 0; i < 14; i++) {
          const ang = Math.random() * TAU, rr = 70;
          FX.p({ x: this.x + Math.cos(ang) * rr, y: this.y + Math.sin(ang) * rr * 1.5, z: this.z + 34, vx: -Math.cos(ang) * rr * 1.6, vy: -Math.sin(ang) * rr * 2.4, drag: 0,
            life: a.windup * 0.9, size: 12, size1: 4, shape: U.pick(['sparkle', 'glowheart', 'star']), color: U.pick(FX.PAL.rainbow), add: true });
        }
        A().sfx('charge', { x: this.x });
      } else if (a.kind === 'breath') {
        FX.burst(this.x + this.face * 14, this.y, this.z + 26, 4, { speed: 30, size: 10, life: 0.3, shape: 'glowheart', color: FX.PAL.fire, add: true, vz: 30 });
      }
      this.impulse(a.heavy ? -7 : -4);   // anticipation: compress before the strike / cast
    }

    muzzle() {
      const s = this.size;
      return [this.x + this.face * 16 * s, this.y + 2, this.z + 32 * s];
    }

    performAttack(mult = 1) {
      const M = this.M, a = this.def.attack, t = this.target;
      if (!t) return;
      if (!this.cutinDone && this.def.cutin) { this.cutinDone = true; M.requestCutin(this); }
      const dmg = a.dmg * mult;
      this.impulse(a.heavy ? 9 : 6);     // release: stretch
      const hz = t.z + (t.kind === 'unit' ? 20 * t.size : t.kind === 'tower' ? 50 : 26);
      switch (a.kind) {
        case 'melee': {
          M.damage(t, dmg, this, { element: a.element, big: mult > 1 });
          const hx = U.lerp(this.x, t.x, 0.6), hy = U.lerp(this.y, t.y, 0.6);
          if (a.element === 'slash') {
            this.combo = (this.combo + 1) % 2;
            const ang = Math.atan2((t.y - this.y) * C.SY, (t.x - this.x) * C.SX);
            FX.slash(hx, hy, hz, ang + (this.combo ? 0.5 : -0.5), 32 * this.size + (mult > 1 ? 16 : 0), mult > 1 ? '#b58cff' : '#6fd6ff', 0.24, this.combo ? -1 : 1);
            FX.hit('slash', t.x, t.y, hz, mult > 1 ? 1.6 : 0.8);
            A().sfx('slash', { x: this.x, pitch: 0.9 + Math.random() * 0.2 });
            if (mult > 1) FX.doHitStop(0.05);
          } else if (a.element === 'scratch') {
            FX.claw(hx, hy, hz, this.face);
            FX.hit('scratch', t.x, t.y, hz, 0.6);
            A().sfx('scratch', { x: this.x });
          } else if (a.element === 'bonk') {
            FX.hit('bonk', hx, hy, hz, 1.2);
            FX.screenShake(3);
            A().sfx('bonk', { x: this.x });
          } else {
            FX.hit(a.element, t.x, t.y, hz, 0.6);
            A().sfx('scratch', { x: this.x, pitch: 0.8 });
          }
          break;
        }
        case 'projectile': {
          const [mx, my, mz] = this.muzzle();
          M.spawnProjectile(a.proj, this.team, mx, my, mz, t, { dmg, splash: a.splash || 0, element: a.element, slow: a.slow, targets: this.def.targets, owner: this });
          FX.muzzle(mx, my, mz, this.face > 0 ? -0.3 : Math.PI + 0.3, FX.PAL[a.element] ? FX.PAL[a.element][0] : '#ffffff', 12);
          A().sfx('shoot_' + a.proj, { x: this.x });
          break;
        }
        case 'breath': {
          const [mx, my, mz] = this.muzzle();
          M.spawnProjectile('fireBreath', this.team, mx, my, mz - 6, t, { dmg, splash: a.splash, element: 'fire', targets: this.def.targets, owner: this });
          FX.flame(mx, my, mz - 4, t.x, t.y, t.z + 18 * (t.size || 1), 1.1);
          FX.screenShake(2);
          A().sfx('fire', { x: this.x });
          break;
        }
        case 'beam': {
          const [mx, my, mz] = this.muzzle();
          const ang = Math.atan2(t.y - my, t.x - mx);
          const len = a.range + this.r + 40;
          const ex = mx + Math.cos(ang) * len, ey = my + Math.sin(ang) * len;
          M.beamDamage(this, mx, my, ex, ey, a.width, dmg, a.element);
          FX.beam(mx, my, mz, ex, ey, 18, 'rainbow', 34, 0.42);
          FX.circle(mx, my, 30, '#ffffff', 0.35, { spin: 8, fadeOut: true });
          for (let i = 0; i < 18; i++) {
            const k = Math.random();
            FX.p({ x: U.lerp(mx, ex, k), y: U.lerp(my, ey, k), z: U.lerp(mz, 18, k), vx: U.rand(-60, 60), vy: U.rand(-60, 60), vz: U.rand(20, 90), life: 0.6, size: 13,
              shape: U.pick(['star', 'sparkle', 'glowheart']), color: U.pick(FX.PAL.rainbow), add: true, drag: 3 });
          }
          FX.screenShake(7); FX.doHitStop(0.06); FX.screenFlash(0.18, '#ffe6f6');
          A().sfx('beam', { x: this.x });
          break;
        }
      }
    }

    doHeal() {
      const M = this.M, h = this.def.heal;
      let healed = 0;
      M.forAllies(this.team, this.x, this.y, h.radius, (e) => {
        if (e.kind !== 'unit' || e.hp >= e.maxHp) return;
        M.heal(e, h.amount);
        healed++;
      });
      FX.ring(this.x, this.y, 20, h.radius, '#ffe27a', 0.6, 5);
      FX.ring(this.x, this.y, 10, h.radius * 0.7, '#ffb3d9', 0.5, 3);
      FX.burst(this.x, this.y, this.z + 10, 8, { speed: 90, size: 14, life: 1.0, shape: ['feather', 'heart', 'sparkle'], color: ['#ffffff', '#ffb3d9', '#ffe27a'], drag: 2, vz: 40, g: 10, vr: 3 });
      if (healed) A().sfx('heal', { x: this.x, vol: 0.6 });
    }

    doSummon() {
      const M = this.M, s = this.def.summon;
      FX.circle(this.x, this.y, 40, '#c07bff', 0.8, { spin: 3, fadeOut: true, fill: true, points: 5 });
      FX.burst(this.x, this.y, 20, 10, { speed: 100, size: 14, life: 0.6, shape: ['moon', 'sparkle'], color: FX.PAL.dark, add: true, drag: 3 });
      for (let i = 0; i < s.count; i++) {
        const ang = (i / s.count) * TAU + Math.random();
        const x = this.x + Math.cos(ang) * 30, y = this.y + Math.sin(ang) * 30;
        const u = M.spawnUnit(s.unit, this.team, x, y, { deployT: 0.45, noDrop: true, summoned: true });
        if (u) u.impulse(-6);
      }
      A().sfx('summon', { x: this.x });
    }

    popShield() {
      if (this.shield > 0 || this.shieldT <= 0) {
        FX.burst(this.x, this.y, this.z + 20 * this.size, 10, { speed: 120, size: 12, life: 0.4, shape: ['ring', 'sparkle'], color: ['#bfe9ff', '#ffffff', '#ffc2f0'], add: true, drag: 4 });
        A().sfx('pop', { x: this.x });
      }
      this.shield = 0; this.shieldT = 0;
    }

    frameName() {
      if (this.state === 'deploy') return this.z > this.baseZ + 2 ? 'hurt' : 'idle0';
      if (this.stunT > 0 || this.hurtT > 0) return 'hurt';
      const a = this.def.attack;
      if (this.engaged || this.strikeT < 0.3) {
        if (this.strikeT < 0.1) return 'atk1';
        if (this.strikeT < 0.24) return 'atk2';
        if (this.engaged && this.atkCd <= a.windup) return 'atk0';
      }
      if (this.moving || this.air) {
        const fps = this.air ? 9 : 10 * (this.def.speed / 66);
        return 'walk' + (Math.floor(this.animT * fps) % 4);
      }
      return (this.animT % 3.2) < 0.13 ? 'idle1' : 'idle0';
    }

    drawShadow(ctx) {
      const X = sx(this.x), Y = sy(this.y);
      const hk = this.air ? 0.75 : 1;
      const z = this.state === 'deploy' ? Math.min(1, (this.z - this.baseZ) / 260) : 0;
      const r = this.r * hk * (1 - z * 0.5);
      ctx.globalAlpha = 0.22 * (1 - z * 0.5);
      ctx.beginPath(); ctx.ellipse(X, Y + 1, r * 1.15, r * 0.55, 0, 0, TAU); ctx.fillStyle = '#3c1e5a'; ctx.fill();
      ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.ellipse(X, Y + 1, r * 1.2, r * 0.6, 0, 0, TAU);
      ctx.lineWidth = 2.5; ctx.strokeStyle = C.TEAM[this.team].ring; ctx.stroke();
      ctx.globalAlpha = 1;
    }

    draw(ctx) {
      const fname = this.frameName();
      const fr = NK.CatArt.getFrame(this.key, this.def.art, this.team, fname, this.variant);
      const X = sx(this.x), Y = sy(this.y) - this.z;
      // procedural squash & stretch
      let scx = 1, scy = 1, rot = 0, bob = 0;
      if (this.moving && !this.air) {
        const ph = this.animT * (this.def.speed / 66) * 10 * Math.PI / 2;
        bob = Math.abs(Math.sin(ph)) * 3 * this.size;
        scy = 1 + Math.sin(ph * 2) * 0.035; scx = 2 - scy;
        rot = Math.sin(ph) * 0.04;
      } else if (!this.air) {
        const b = Math.sin(this.animT * 3.2) * 0.025;
        scy = 1 + b; scx = 1 - b;
      }
      if (this.state === 'deploy' && this.z > this.baseZ + 1) { scy = 1.18; scx = 0.86; }
      const s2 = U.clamp(this.sq * 0.018, -0.3, 0.3);
      scx *= 1 - s2; scy *= 1 + s2;
      if (this.stunT > 0) rot = Math.sin(this.animT * 18) * 0.06;
      ctx.save();
      ctx.translate(X, Y - bob);
      ctx.rotate(rot);
      ctx.scale(this.face * scx, scy);
      if (this.dashing) ctx.globalAlpha = 0.25;
      else if (this.def.hover) ctx.globalAlpha = 0.9;
      ctx.drawImage(fr.canvas, -fr.ox, -fr.oy, fr.w, fr.h);
      if (this.slowT > 0) {
        ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = 0.75;
        ctx.drawImage(NK.CatArt.getTint(fr, '#9fdcff'), -fr.ox, -fr.oy, fr.w, fr.h);
        ctx.globalCompositeOperation = 'source-over';
      }
      if (this.hitT > 0) { ctx.globalAlpha = Math.min(1, this.hitT / 0.1) * 0.7; ctx.drawImage(NK.CatArt.getFlash(fr), -fr.ox, -fr.oy, fr.w, fr.h); }
      ctx.restore();
      ctx.globalAlpha = 1;
      const headY = Y - bob - 52 * this.size;
      if (this.shield > 0) {
        const r = 34 * this.size;
        const wob = Math.sin(this.animT * 5) * 1.5;
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.35;
        ctx.beginPath(); ctx.ellipse(X, Y - bob - 26 * this.size, r + wob, r * 1.05 - wob, 0, 0, TAU);
        const g = ctx.createRadialGradient(X - r * 0.4, Y - bob - 40 * this.size, 2, X, Y - bob - 26 * this.size, r);
        g.addColorStop(0, 'rgba(255,255,255,0.9)'); g.addColorStop(0.6, 'rgba(160,220,255,0.15)'); g.addColorStop(0.85, 'rgba(255,170,240,0.4)'); g.addColorStop(1, 'rgba(160,240,255,0.8)');
        ctx.fillStyle = g; ctx.fill();
        ctx.globalAlpha = 0.8; ctx.lineWidth = 1.5; ctx.strokeStyle = '#dff6ff'; ctx.stroke();
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      }
      if (this.stunT > 0) {
        for (let i = 0; i < 3; i++) {
          const a = this.animT * 6 + (i * TAU) / 3;
          const px = X + Math.cos(a) * 16 * this.size, py = headY - 6 + Math.sin(a) * 5;
          ctx.drawImage(NK.G.tex('star', '#fff27a'), px - 7, py - 7, 14, 14);
        }
      }
    }

    barVisible() { return this.hover || this.hp < this.maxHp - 0.5 || this.shield > 0; }
    drawBar(ctx) {
      if (!this.barVisible() || this.state === 'deploy') return;
      const X = sx(this.x), Y = sy(this.y) - this.z - 62 * this.size - 8;
      const w = Math.max(30, 38 * Math.sqrt(this.size) * (this.maxHp > 1500 ? 1.3 : 1)), h = 7;
      drawHpBar(ctx, X - w / 2, Y, w, h, this, false);
    }
  }

  /* shared hp bar renderer */
  function drawHpBar(ctx, x, y, w, h, e, big) {
    const tc = C.TEAM[e.team];
    const r = h / 2;
    NK.G.roundRect(ctx, x - 2, y - 2, w + 4, h + 4, r + 2);
    ctx.fillStyle = C.INK; ctx.fill();
    NK.G.roundRect(ctx, x, y, w, h, r);
    ctx.fillStyle = '#3b2552'; ctx.fill();
    const f = U.clamp(e.dispHp / e.maxHp, 0, 1), tr = U.clamp(e.trailHp / e.maxHp, 0, 1);
    if (tr > f) { NK.G.roundRect(ctx, x, y, Math.max(h, w * tr), h, r); ctx.fillStyle = '#ffffff'; ctx.fill(); }
    if (f > 0) {
      NK.G.roundRect(ctx, x, y, Math.max(h, w * f), h, r);
      const g = ctx.createLinearGradient(0, y, 0, y + h);
      g.addColorStop(0, U.shade(tc.hp, 0.35)); g.addColorStop(0.5, tc.hp); g.addColorStop(1, tc.hpDark);
      ctx.fillStyle = g; ctx.fill();
    }
    if (e.shield > 0 && e.shieldMax > 0) {
      const sf = U.clamp(e.shield / e.shieldMax, 0, 1);
      NK.G.roundRect(ctx, x, y - h * 0.9, Math.max(3, w * sf), h * 0.7, r);
      ctx.fillStyle = '#bfe9ff'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = C.INK; ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(x + r, y + 1, Math.max(0, w * f - h), h * 0.25);
    if (big) {
      NK.G.text(ctx, String(Math.max(0, Math.ceil(e.hp))), x + w / 2, y + h / 2 + 0.5, { size: h + 3, color: '#ffffff', stroke: C.INK, strokeW: 3.5, weight: 900 });
    }
  }

  /* =================================================================== */
  class Structure {
    constructor(M, sub, team, x, y, lane = -1) {
      this.id = NEXT_ID++;
      this.M = M; this.team = team; this.x = x; this.y = y; this.z = 0;
      this.sub = sub; // outer | king | yarn | shrine
      const defKey = { outer: 'outerTower', king: 'kingTower', yarn: 'yarnCannon', shrine: 'catShrine' }[sub];
      this.def = NK.Structures[defKey];
      this.kind = (sub === 'outer' || sub === 'king') ? 'tower' : 'building';
      this.r = this.def.r; this.mass = 999; this.air = false; this.size = 1.4;
      initHealth(this, this.def.hp);
      this.lane = lane;
      this.target = null; this.atkCd = 0.5; this.atkT = 0;
      this.awake = sub !== 'king'; this.wakeT = 0;
      this.t = Math.random() * 10; this.face = 1; this.aim = team === 0 ? -Math.PI / 2 : Math.PI / 2;
      this.life = this.def.lifetime || 0; this.genT = 0; this.genP = 0;
      this.state = this.kind === 'building' ? 'deploy' : 'active';
      this.deployT = this.kind === 'building' ? 0.6 : 0;
      this.dropZ = this.kind === 'building' ? 200 : 0;
      this.rubble = false;
    }
    get targetable() { return !this.dead; }
    impulse() { this.hitT = Math.max(this.hitT, 0.12); }

    update(dt) {
      const M = this.M;
      this.t += dt;
      this.hitT = Math.max(0, this.hitT - dt);
      this.atkT = Math.max(0, this.atkT - dt);
      tickHealthBar(this, dt);
      if (this.dead) return;
      if (this.state === 'deploy') {
        this.deployT -= dt;
        this.dropZ = Math.max(0, 200 * (this.deployT - 0.25) / 0.35);
        if (this.deployT <= 0.25 && !this.landed) {
          this.landed = true;
          FX.burst(this.x, this.y, 2, 10, { speed: 120, size: 26, life: 0.6, shape: 'smoke', color: '#ffffff', drag: 3.5, vz: 20, layer: 0 });
          FX.ring(this.x, this.y, 20, 90, C.TEAM[this.team].glow, 0.4, 5);
          FX.screenShake(3);
          A().sfx('thud', { x: this.x });
        }
        if (this.deployT <= 0) this.state = 'active';
        return;
      }
      if (this.stunT > 0) { this.stunT -= dt; return; }
      if (this.kind === 'building') {
        this.hp -= (this.maxHp / this.life) * dt;
        if (this.hp <= 0) { M.kill(this, null); return; }
      }
      if (this.def.generate) {
        this.genT += dt;
        this.genP = this.genT / this.def.generate.every;
        if (this.genT >= this.def.generate.every) {
          this.genT = 0;
          M.addNyanergy(this.team, this.def.generate.amount, this.x, this.y);
        }
      }
      if (this.sub === 'king' && !this.awake) {
        if (this.hp < this.maxHp - 1 || M.structures.some((s) => s.team === this.team && s.sub === 'outer' && s.dead)) this.wake();
        else return;
      }
      if (this.awake) this.wakeT += dt;
      const a = this.def.attack;
      if (!a) return;
      // target maintenance
      if (this.target && (this.target.dead || !this.target.targetable || !this.inRange(this.target))) this.target = null;
      if (!this.target) {
        this.scanT = (this.scanT || 0) - dt;
        if (this.scanT <= 0) { this.scanT = 0.1; this.target = M.findStructTarget(this); }
      }
      this.atkCd -= dt * (this.slowT > 0 ? 1 - this.slowPct : 1);
      if (this.slowT > 0) this.slowT -= dt;
      if (this.target) {
        const t = this.target;
        this.face = t.x >= this.x ? 1 : -1;
        const tgtAng = Math.atan2((t.y - this.y) * C.SY - (t.z || 0), (t.x - this.x) * C.SX);
        this.aim = tgtAng;
        if (this.atkCd <= 0) {
          this.atkCd = a.rate;
          this.fire(t);
        }
      } else this.atkCd = Math.max(this.atkCd, a.windup || 0.1);
    }
    inRange(t) { return U.dist(this.x, this.y, t.x, t.y) - t.r - this.r <= this.def.attack.range; }
    wake() {
      if (this.awake) return;
      this.awake = true; this.wakeT = 0; this.atkCd = 0.6;
      FX.burst(this.x, this.y, 110, 16, { speed: 160, size: 16, life: 0.8, shape: ['sparkle', 'star'], color: [C.TEAM[this.team].glow, '#ffffff', '#ffe066'], add: true, drag: 3 });
      FX.ring(this.x, this.y, 30, 200, C.TEAM[this.team].glow, 0.6, 6);
      FX.text(this.x, this.y, 150, this.team === 0 ? 'Castle awake!' : 'Castle awake!', '#ffe066', 22, 1.3);
      A().sfx('wake', {});
    }
    fire(t) {
      const a = this.def.attack;
      this.atkT = 0.25;
      if (a.kind === 'castleBeam') {
        const gz = 140;
        const tz = t.z + (t.kind === 'unit' ? 20 * t.size : 30);
        FX.beam(this.x, this.y - 2, gz, t.x, t.y, tz, 'team' + this.team, 16, 0.22);
        FX.hit('holy', t.x, t.y, tz, 0.9);
        this.M.damage(t, a.dmg, this, { element: 'holy' });
        A().sfx('castleBeam', { x: this.x });
      } else if (this.sub === 'outer') {
        this.M.spawnProjectile('towerStar', this.team, this.x + this.face * 14, this.y, 112, t, { dmg: a.dmg, element: 'star', targets: 'both', owner: this });
        A().sfx('towerShot', { x: this.x });
      } else if (this.sub === 'yarn') {
        const [mx, mz] = [this.x + Math.cos(this.aim) * 30, 40];
        this.M.spawnProjectile('yarnBall', this.team, mx, this.y, mz, t, { dmg: a.dmg, element: 'yarn', targets: 'ground', owner: this });
        FX.muzzle(mx, this.y, mz, this.aim, '#ffc2dc', 14);
        A().sfx('yarn', { x: this.x });
      }
    }

    drawShadow(ctx) {
      if (this.kind === 'building' && this.state === 'deploy') {
        const X = sx(this.x), Y = sy(this.y);
        ctx.globalAlpha = 0.25; ctx.beginPath(); ctx.ellipse(X, Y, this.r * 1.2, this.r * 0.55, 0, 0, TAU); ctx.fillStyle = '#3c1e5a'; ctx.fill(); ctx.globalAlpha = 1;
      }
    }
    draw(ctx) {
      const X = sx(this.x), Y = sy(this.y) - this.dropZ;
      const st = this;
      if (this.dead) {
        if (this.kind === 'tower') NK.StructArt.drawRubble(ctx, X, Y, this.team, this.sub === 'king', this.t);
        return;
      }
      ctx.save();
      if (this.hitT > 0) { ctx.translate(X, Y); ctx.scale(1 + this.hitT * 0.15, 1 - this.hitT * 0.1); ctx.translate(-X, -Y); }
      switch (this.sub) {
        case 'outer': NK.StructArt.drawTower(ctx, X, Y, this.team, { t: this.t, hitT: this.hitT, atkT: this.atkT, face: this.face }); break;
        case 'king': NK.StructArt.drawCastle(ctx, X, Y, this.team, { t: this.t, hitT: this.hitT, atkT: this.atkT, awake: this.awake, wakeT: this.wakeT }); break;
        case 'yarn': NK.StructArt.drawYarnCannon(ctx, X, Y, this.team, { t: this.t, atkT: this.atkT, face: this.face, aim: this.aim }); break;
        case 'shrine': NK.StructArt.drawShrine(ctx, X, Y, this.team, { t: this.t, genP: this.genP }); break;
      }
      ctx.restore();
      if (this.hitT > 0 && this.kind === 'tower') {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = this.hitT * 2;
        const h = this.sub === 'king' ? 110 : 70;
        ctx.drawImage(NK.G.tex('glow', '#ffffff'), X - h * 0.8, Y - h - h * 0.4, h * 1.6, h * 1.4);
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      }
    }
    drawBar(ctx) {
      if (this.dead) return;
      if (this.kind === 'building') {
        if (this.state === 'deploy') return;
        const X = sx(this.x), Y = sy(this.y) - 78;
        drawHpBar(ctx, X - 26, Y, 52, 7, this, false);
        return;
      }
      const king = this.sub === 'king';
      const w = king ? 128 : 88, h = king ? 14 : 12;
      const X = sx(this.x), Y = sy(this.y) + (king ? 44 : 30);
      drawHpBar(ctx, X - w / 2, Y, w, h, this, true);
    }
  }

  /* =================================================================== */
  const PROJ = {
    starArrow: { speed: 760, arc: 0, shape: 'star', color: '#ffe066', size: 18, trail: 'sparkle', trailCol: '#fff3a3', spin: 10 },
    magicOrb: { speed: 560, arc: 0, shape: 'glow', color: '#c49bff', size: 30, core: '#ffffff', trail: 'sparkle', trailCol: '#e0b8ff', swirl: true },
    lightBolt: { speed: 640, arc: 0, shape: 'glow', color: '#ffe27a', size: 26, core: '#fff6c8', trail: 'star', trailCol: '#ffe27a' },
    darkStar: { speed: 540, arc: 0, shape: 'star', color: '#b27bff', size: 20, trail: 'moon', trailCol: '#c07bff', spin: 8 },
    iceShard: { speed: 620, arc: 0, shape: 'shard', color: '#7fe6ff', size: 28, trail: 'snow', trailCol: '#bff3ff', orient: true },
    cannonBall: { speed: 420, arc: 150, shape: 'circle', color: '#ff94bb', size: 22, trail: 'smoke', trailCol: '#fff0f5', lob: true, big: true },
    yarnBall: { speed: 560, arc: 30, shape: 'yarn', color: '#ff9ec0', size: 20, trail: 'circle', trailCol: '#ffc2dc', spin: 12 },
    towerStar: { speed: 820, arc: 0, shape: 'star', color: '#ffffff', size: 18, trail: 'sparkle', teamTint: true, spin: 9 },
    fireBreath: { speed: 900, arc: 0, shape: 'glowheart', color: '#ff7a6b', size: 18, trail: 'glowheart', trailCol: '#ff9a4d', fire: true },
  };

  class Projectile {
    constructor(M, type, team, x, y, z, target, o) {
      this.M = M; this.type = type; this.cfg = PROJ[type];
      this.team = team; this.x = x; this.y = y; this.z = z;
      this.sx0 = x; this.sy0 = y; this.sz0 = z;
      this.target = target;
      this.tx = target.x; this.ty = target.y; this.tz = target.z + (target.kind === 'unit' ? 18 * target.size : target.kind === 'tower' ? 40 : 20);
      this.dmg = o.dmg; this.splash = o.splash || 0; this.element = o.element; this.slow = o.slow; this.targets = o.targets; this.owner = o.owner;
      this.t = 0; this.done = false; this.trailT = 0; this.rot = Math.random() * TAU;
