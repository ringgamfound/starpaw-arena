<script>
/* ---- 00_core.js ---- */
/* =====================================================================
   Starpaw Arena — core: namespace, math utils, config, settings, pools
   ===================================================================== */
'use strict';
const NK = (window.NK = window.NK || {});

/* ---------------- Math & helpers ---------------- */
NK.U = (() => {
  const U = {};
  U.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.invLerp = (a, b, v) => (v - a) / (b - a);
  U.rand = (a = 0, b = 1) => a + Math.random() * (b - a);
  U.randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
  U.pick = (arr) => arr[(Math.random() * arr.length) | 0];
  U.chance = (p) => Math.random() < p;
  U.dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
  U.dist2 = (ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; };
  U.angle = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
  U.sign = (v) => (v < 0 ? -1 : 1);
  U.TAU = Math.PI * 2;
  // exponential smoothing independent of framerate
  U.damp = (a, b, lambda, dt) => U.lerp(a, b, 1 - Math.exp(-lambda * dt));
  U.approach = (v, target, step) => (v < target ? Math.min(v + step, target) : Math.max(v - step, target));
  U.shuffle = (arr) => { for (let i = arr.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };

  /* easing */
  U.easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
  U.easeInCubic = (t) => t * t * t;
  U.easeInOutSine = (t) => -(Math.cos(Math.PI * t) - 1) / 2;
  U.easeOutQuad = (t) => 1 - (1 - t) * (1 - t);
  U.easeInQuad = (t) => t * t;
  U.easeOutBack = (t, s = 1.70158) => { const c3 = s + 1; return 1 + c3 * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
  U.easeOutElastic = (t) => {
    if (t === 0 || t === 1) return t;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1;
  };
  U.pingpong = (t) => 1 - Math.abs(((t % 2) + 2) % 2 - 1);

  /* colors */
  U.hexToRgb = (hex) => {
    let h = hex.replace('#', '');
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  U.rgbToHex = (r, g, b) => '#' + [r, g, b].map((v) => U.clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
  // amt > 0 lighten toward white, < 0 darken toward black
  U.shade = (hex, amt) => {
    const [r, g, b] = U.hexToRgb(hex);
    if (amt >= 0) return U.rgbToHex(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt);
    return U.rgbToHex(r * (1 + amt), g * (1 + amt), b * (1 + amt));
  };
  U.mix = (h1, h2, t) => {
    const a = U.hexToRgb(h1), b = U.hexToRgb(h2);
    return U.rgbToHex(U.lerp(a[0], b[0], t), U.lerp(a[1], b[1], t), U.lerp(a[2], b[2], t));
  };
  U.rgba = (hex, a) => { const [r, g, b] = U.hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; };

  /* distance from point to segment */
  U.distToSeg = (px, py, ax, ay, bx, by) => {
    const dx = bx - ax, dy = by - ay;
    const l2 = dx * dx + dy * dy || 1;
    let t = ((px - ax) * dx + (py - ay) * dy) / l2;
    t = U.clamp(t, 0, 1);
    return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
  };
  U.fmtTime = (s) => {
    s = Math.max(0, Math.ceil(s));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  };
  return U;
})();

/* ---------------- Config ---------------- */
NK.C = {
  VW: 1920, VH: 1080,              // logical view size
  WW: 1100, WH: 1500,              // world size (arena)
  AX: 410, AY: 100,                // screen offset of world origin
  SX: 1.0, SY: 0.51,               // projection scale (angled overhead)
  RIVER_TOP: 712, RIVER_BOT: 788, RIVER_Y: 750,
  BRIDGES: [235, 865], BRIDGE_HW: 64,
  LANE_X: [235, 865],
  KING_Y: [1372, 128],
  OUTER_Y: [1200, 300],
  TILE: 55,
  PLAYER: 0, ENEMY: 1,
  MAX_NRG: 10,
  REGEN_SEC: 2.8,                  // seconds per nyanergy point
  MATCH_TIME: 180, DOUBLE_AT: 60, OVERTIME: 60,
  SIM_DT: 1 / 60,
  TEAM: [
    { name: 'blue', main: '#4b9dff', light: '#a9d6ff', dark: '#2a5fb8', glow: '#79c4ff', ring: 'rgba(75,157,255,0.55)', hp: '#4fb3ff', hpDark: '#2a6fc9' },
    { name: 'rose', main: '#ff5c8d', light: '#ffb6cc', dark: '#b8325e', glow: '#ff8fb5', ring: 'rgba(255,92,141,0.55)', hp: '#ff6b93', hpDark: '#c03460' },
  ],
  FONT_DISPLAY: '"Mochiy Pop One", "M PLUS Rounded 1c", "Arial Rounded MT Bold", system-ui, sans-serif',
  FONT_UI: '"M PLUS Rounded 1c", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif',
  INK: '#4a2d5c',                   // universal outline color
};

/* projection helpers */
NK.C.toScreenX = (wx) => NK.C.AX + wx * NK.C.SX;
NK.C.toScreenY = (wy) => NK.C.AY + wy * NK.C.SY;
NK.C.toWorldX = (sx) => (sx - NK.C.AX) / NK.C.SX;
NK.C.toWorldY = (sy) => (sy - NK.C.AY) / NK.C.SY;
NK.C.sideOf = (y) => (y < NK.C.RIVER_TOP ? 1 : y > NK.C.RIVER_BOT ? 0 : -1); // 1 = enemy half, 0 = player half

/* ---------------- Settings (persisted per-viewer) ---------------- */
NK.Settings = (() => {
  const KEY = 'starpaw-arena-settings-v1';
  const defaults = {
    master: 0.8, music: 0.45, sfx: 0.8,
    shake: !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches), dmgNumbers: true, meows: true,
    difficulty: 1,
    deck: null,
  };
  let data = Object.assign({}, defaults);
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) data = Object.assign(data, JSON.parse(raw));
  } catch (e) { /* storage unavailable */ }
  return {
    get: (k) => data[k],
    set: (k, v) => {
      data[k] = v;
      try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* ignore */ }
      if (NK.Audio && NK.Audio.applyVolumes) NK.Audio.applyVolumes();
    },
    all: () => data,
  };
})();

/* ---------------- Generic object pool ---------------- */
NK.Pool = class Pool {
  constructor(factory, initial = 64) {
    this.factory = factory;
    this.free = [];
    for (let i = 0; i < initial; i++) this.free.push(factory());
  }
  get() { return this.free.length ? this.free.pop() : this.factory(); }
  release(o) { this.free.push(o); }
};

/* ---------------- Spatial hash grid ---------------- */
NK.Grid = class Grid {
  constructor(cell = 110) {
    this.cell = cell;
    this.cols = Math.ceil(NK.C.WW / cell) + 2;
    this.rows = Math.ceil(NK.C.WH / cell) + 2;
    this.buckets = [];
    for (let i = 0; i < this.cols * this.rows; i++) this.buckets.push([]);
  }
  clear() { for (let i = 0; i < this.buckets.length; i++) this.buckets[i].length = 0; }
  idx(x, y) {
    const cx = NK.U.clamp(((x / this.cell) | 0) + 1, 0, this.cols - 1);
    const cy = NK.U.clamp(((y / this.cell) | 0) + 1, 0, this.rows - 1);
    return cy * this.cols + cx;
  }
  insert(e) { this.buckets[this.idx(e.x, e.y)].push(e); }
  // call fn(e) for every entity in cells overlapping the circle
  query(x, y, r, fn) {
    const c = this.cell;
    const x0 = NK.U.clamp(((x - r) / c | 0) + 1, 0, this.cols - 1), x1 = NK.U.clamp(((x + r) / c | 0) + 1, 0, this.cols - 1);
    const y0 = NK.U.clamp(((y - r) / c | 0) + 1, 0, this.rows - 1), y1 = NK.U.clamp(((y + r) / c | 0) + 1, 0, this.rows - 1);
    for (let cy = y0; cy <= y1; cy++) {
      for (let cx = x0; cx <= x1; cx++) {
        const b = this.buckets[cy * this.cols + cx];
        for (let i = 0; i < b.length; i++) fn(b[i]);
      }
    }
  }
};

/* ---- 01_audio.js ---- */
/* =====================================================================
   AudioManager: fully procedural WebAudio — cute synth SFX, synthesized
   meows, and a small step-sequenced soundtrack (menu + battle themes).
   ===================================================================== */
'use strict';
NK.Audio = (() => {
  const U = NK.U;
  let ac = null, master, sfxBus, musicBus, comp, noiseBuf;
  const lastPlay = {};
  const A = {};

  function init() {
    if (ac) return true;
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; return false; }
    buildGraph();
    const len = ac.sampleRate * 1.5;
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    applyVolumes();
    return true;
  }
  // transparent soft-clip limiter (DynamicsCompressor colours/attenuates short sounds heavily)
  let clipCurve = null;
  function softClipCurve() {
    if (clipCurve) return clipCurve;
    const n = 2048; clipCurve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * 2 - 1, ax = Math.abs(x) * 1.6; // input range ±1.6
      const y = ax < 0.6 ? ax : 0.6 + 0.38 * Math.tanh((ax - 0.6) / 0.38);
      clipCurve[i] = Math.sign(x) * y;
    }
    return clipCurve;
  }
  function buildGraph() {
    comp = ac.createWaveShaper();
    comp.curve = softClipCurve(); comp.oversample = '2x';
    const pre = ac.createGain(); pre.gain.value = 1 / 1.6;   // map ±1.6 into the shaper's ±1 domain
    master = ac.createGain(); sfxBus = ac.createGain(); musicBus = ac.createGain();
    sfxBus.connect(master); musicBus.connect(master); master.connect(pre); pre.connect(comp); comp.connect(ac.destination);
    applyVolumes();
  }
  function applyVolumes() {
    if (!ac || !master) return;
    const S = NK.Settings;
    master.gain.value = S.get('master');
    sfxBus.gain.value = S.get('sfx') * 1.5;
    musicBus.gain.value = S.get('music') * 1.3;
  }
  A.applyVolumes = applyVolumes;
  A.resume = () => { if (init() && ac.state === 'suspended') ac.resume(); };
  A.ready = () => !!ac && ac.state === 'running';

  /* ---------------- primitives ---------------- */
  function out(pan, dest) {
    const d = dest || sfxBus;
    if (pan == null || !ac.createStereoPanner) return d;
    const p = ac.createStereoPanner();
    p.pan.value = U.clamp(pan, -0.8, 0.8);
    p.connect(d);
    return p;
  }
  // oscillator voice with pitch glide + AD envelope
  function tone(o) {

      if (S.drums) {
        tone({ f: midi(m), dur: beat * len * 0.95, vol: 0.05, type: 'square', lp: 3200, t, dest, vib: 5, vibAmt: 8 });
        tone({ f: midi(m), dur: beat * len * 0.95, vol: 0.03, type: 'triangle', t, dest, detune: 8 });
      } else {
        tone({ f: midi(m), dur: beat * len * 1.2, vol: 0.05, type: 'triangle', t, dest, attack: 0.02, vib: 5, vibAmt: 10 });
      }
    }
    // drums
    if (S.drums) {
      if (st === 0 || st === 4 || (intensity > 0 && st === 6)) tone({ f: 150, f2: 45, dur: 0.16, vol: 0.2, t, dest });
      if (st === 2 || st === 6) noise({ f: 1800, dur: 0.12, vol: 0.07, q: 0.8, t, dest });
      noise({ ftype: 'highpass', f: 7000, dur: 0.035, vol: st % 2 ? 0.02 : 0.03, t, dest });
      if (intensity > 0) {
        noise({ ftype: 'highpass', f: 8000, dur: 0.03, vol: 0.018, t: t + beat / 2, dest });
        if (st % 2 === 0) bell(midi(chord[(st / 2) % chord.length] + 36), t, beat, 0.018, 0, dest);
      }
    }
  }
  function tick() {
    if (!ac || !songName) return;
    const S = SONGS[songName];
    const beat = 60 / (S.bpm * (intensity > 0 ? 1.06 : 1)) / 2;
    if (nextT < ac.currentTime - 0.25) nextT = ac.currentTime + 0.05; // tab was throttled: skip missed steps
    while (nextT < ac.currentTime + 0.15) {
      scheduleStep(songName, nextT);
      nextT += beat;
      step = (step + 1) % (S.melody.length * 8);
    }
  }
  A.music = (name) => {
    if (!init()) return;
    if (songName === name) return;
    songName = name; step = 0; intensity = 0;
    nextT = ac.currentTime + 0.1;
    if (!timer) timer = setInterval(tick, 30);
  };
  A.stopMusic = () => { songName = null; };
  /* test hook: render sfx/music offline and report levels (not used in play) */
  A._offlineRender = async (seconds, fn) => {
    const saved = [ac, master, sfxBus, musicBus, comp];
    const off = new OfflineAudioContext(2, Math.ceil(44100 * seconds), 44100);
    ac = off;
    buildGraph();
    const nb = noiseBuf; noiseBuf = ac.createBuffer(1, nb.length, 44100); noiseBuf.getChannelData(0).set(nb.getChannelData(0));
    try { fn({ S, scheduleStep, tone, bell, midi, setStep: (v) => { step = v; } }); } catch (e) { ac = saved[0]; [master, sfxBus, musicBus, comp] = saved.slice(1); throw e; }
    const buf = await off.startRendering();
    ac = saved[0]; [master, sfxBus, musicBus, comp] = saved.slice(1); noiseBuf = nb;
    const d = buf.getChannelData(0);
    let peak = 0, sum = 0, last = 0;
    for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (v > peak) peak = v; sum += v * v; if (v > 0.002) last = i; }
    return { peak: +peak.toFixed(3), rms: +Math.sqrt(sum / d.length).toFixed(4), audibleSec: +(last / 44100).toFixed(2) };
  };
  A.setIntensity = (v) => { intensity = v; };
  A.currentSong = () => songName;

  return A;
})();

/* =====================================================================
   Graphics helpers: shape paths, cached particle textures, outlined text
   ===================================================================== */
'use strict';
NK.G = (() => {
  const G = {};
  const U = NK.U;

  G.makeCanvas = (w, h) => {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.ceil(w));
    c.height = Math.max(1, Math.ceil(h));
    return c;
  };

  /* ---------- paths ---------- */
  G.roundRect = (ctx, x, y, w, h, r) => {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  };
  G.starPath = (ctx, x, y, ro, ri, n = 5, rot = -Math.PI / 2) => {
    ctx.beginPath();
    for (let i = 0; i < n * 2; i++) {
      const r = i % 2 === 0 ? ro : ri;
      const a = rot + (i * Math.PI) / n;
      const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  };
  // rounded chubby star (nicer for cute style)
  G.softStarPath = (ctx, x, y, ro, ri, n = 5, rot = -Math.PI / 2) => {
    ctx.beginPath();
    const pts = [];
    for (let i = 0; i < n * 2; i++) {
      const r = i % 2 === 0 ? ro : ri;
      const a = rot + (i * Math.PI) / n;
      pts.push([x + Math.cos(a) * r, y + Math.sin(a) * r]);
    }
    const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    let m = mid(pts[pts.length - 1], pts[0]);
    ctx.moveTo(m[0], m[1]);
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], q = pts[(i + 1) % pts.length];
      const mm = mid(p, q);
      ctx.quadraticCurveTo(p[0], p[1], mm[0], mm[1]);
    }
    ctx.closePath();
  };
  G.heartPath = (ctx, x, y, s) => {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.9);
    ctx.bezierCurveTo(x - s * 1.25, y + s * 0.05, x - s * 0.75, y - s * 1.0, x, y - s * 0.35);
    ctx.bezierCurveTo(x + s * 0.75, y - s * 1.0, x + s * 1.25, y + s * 0.05, x, y + s * 0.9);
    ctx.closePath();
  };
  G.sparklePath = (ctx, x, y, r, thin = 0.22) => {
    ctx.beginPath();
    ctx.moveTo(x, y - r);
    ctx.quadraticCurveTo(x + r * thin, y - r * thin, x + r, y);
    ctx.quadraticCurveTo(x + r * thin, y + r * thin, x, y + r);
    ctx.quadraticCurveTo(x - r * thin, y + r * thin, x - r, y);
    ctx.quadraticCurveTo(x - r * thin, y - r * thin, x, y - r);
    ctx.closePath();
  };
  G.moonPath = (ctx, x, y, r) => {
    ctx.beginPath();
    ctx.arc(x, y, r, Math.PI * 0.35, Math.PI * 1.65, false);
    ctx.arc(x + r * 0.42, y - r * 0.12, r * 0.78, Math.PI * 1.55, Math.PI * 0.45, true);
    ctx.closePath();
  };
  // paw: main pad + 4 toe beans (separate subpaths, fill once)
  G.pawPath = (ctx, x, y, s) => {
    ctx.beginPath();
    ctx.ellipse(x, y + s * 0.28, s * 0.52, s * 0.42, 0, 0, U.TAU);
    const toes = [[-0.62, -0.22, 0.2], [-0.24, -0.58, 0.21], [0.24, -0.58, 0.21], [0.62, -0.22, 0.2]];
    for (const [tx, ty, tr] of toes) {
      ctx.moveTo(x + tx * s + tr * s, y + ty * s);
      ctx.ellipse(x + tx * s, y + ty * s, tr * s, tr * s * 1.18, 0, 0, U.TAU);
    }
  };
  G.flowerPath = (ctx, x, y, r, petals = 5, rot = 0) => {
    ctx.beginPath();
    for (let i = 0; i < petals; i++) {
      const a = rot + (i / petals) * U.TAU;
      const px = x + Math.cos(a) * r * 0.55, py = y + Math.sin(a) * r * 0.55;
      ctx.moveTo(px + r * 0.48, py);
      ctx.ellipse(px, py, r * 0.48, r * 0.48, 0, 0, U.TAU);
    }
  };

  /* ---------- fill + outline convenience ---------- */
  G.fillStroke = (ctx, fill, stroke, lw) => {
    if (stroke && lw > 0) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  };

  /* ---------- particle textures (cached by shape+color) ---------- */
  const texCache = new Map();
  const TEX = 64; // texture size (px), drawn scaled
  const painters = {
    glow(c, col) {
      const g = c.createRadialGradient(TEX / 2, TEX / 2, 0, TEX / 2, TEX / 2, TEX / 2);
      g.addColorStop(0, U.rgba(col, 1)); g.addColorStop(0.25, U.rgba(col, 0.6)); g.addColorStop(0.6, U.rgba(col, 0.15)); g.addColorStop(1, U.rgba(col, 0));
      c.fillStyle = g; c.fillRect(0, 0, TEX, TEX);
    },
    softcircle(c, col) {
      const g = c.createRadialGradient(TEX / 2, TEX / 2, 0, TEX / 2, TEX / 2, TEX / 2);
      g.addColorStop(0, U.rgba(col, 1)); g.addColorStop(0.55, U.rgba(col, 0.9)); g.addColorStop(1, U.rgba(col, 0));
      c.fillStyle = g; c.fillRect(0, 0, TEX, TEX);
    },
    circle(c, col) { c.beginPath(); c.arc(TEX / 2, TEX / 2, TEX / 2 - 2, 0, U.TAU); c.fillStyle = col; c.fill(); },
    star(c, col) {
      c.shadowColor = col; c.shadowBlur = 8;
      G.softStarPath(c, TEX / 2, TEX / 2 + 1, TEX * 0.4, TEX * 0.19);
      c.fillStyle = col; c.fill();
      c.shadowBlur = 0;
      G.softStarPath(c, TEX / 2, TEX / 2 + 1, TEX * 0.2, TEX * 0.09);
      c.fillStyle = 'rgba(255,255,255,0.85)'; c.fill();
    },
    sparkle(c, col) {
      c.shadowColor = col; c.shadowBlur = 10;
      G.sparklePath(c, TEX / 2, TEX / 2, TEX * 0.44, 0.16);
      c.fillStyle = col; c.fill();
      c.shadowBlur = 0;
      G.sparklePath(c, TEX / 2, TEX / 2, TEX * 0.22, 0.16);
      c.fillStyle = '#ffffff'; c.fill();
    },
    heart(c, col) {
      G.heartPath(c, TEX / 2, TEX / 2 + 2, TEX * 0.34);
      c.lineWidth = 3; c.strokeStyle = U.shade(col, -0.35); c.stroke();
      c.fillStyle = col; c.fill();
      c.beginPath(); c.ellipse(TEX / 2 - TEX * 0.14, TEX / 2 - TEX * 0.08, TEX * 0.07, TEX * 0.05, -0.6, 0, U.TAU);
      c.fillStyle = 'rgba(255,255,255,0.8)'; c.fill();
    },
    glowheart(c, col) {
      c.shadowColor = col; c.shadowBlur = 12;
      G.heartPath(c, TEX / 2, TEX / 2 + 2, TEX * 0.3);
      c.fillStyle = col; c.fill(); c.shadowBlur = 0;
      G.heartPath(c, TEX / 2, TEX / 2 + 1, TEX * 0.14);
      c.fillStyle = 'rgba(255,255,240,0.9)'; c.fill();
    },
    petal(c, col) {
      c.beginPath();
      c.moveTo(TEX * 0.5, TEX * 0.12);
      c.bezierCurveTo(TEX * 0.85, TEX * 0.3, TEX * 0.8, TEX * 0.75, TEX * 0.5, TEX * 0.88);
      c.bezierCurveTo(TEX * 0.2, TEX * 0.75, TEX * 0.15, TEX * 0.3, TEX * 0.5, TEX * 0.12);
      c.fillStyle = col; c.fill();
      c.lineWidth = 2; c.strokeStyle = U.shade(col, -0.2); c.stroke();
      c.beginPath(); c.moveTo(TEX * 0.5, TEX * 0.25); c.lineTo(TEX * 0.5, TEX * 0.7);
      c.strokeStyle = 'rgba(255,255,255,0.6)'; c.stroke();
    },
    flower(c, col) {
      G.flowerPath(c, TEX / 2, TEX / 2, TEX * 0.42, 5, -Math.PI / 2);
      c.fillStyle = col; c.fill();
      c.lineWidth = 2; c.strokeStyle = U.shade(col, -0.25); c.stroke();
      c.beginPath(); c.arc(TEX / 2, TEX / 2, TEX * 0.13, 0, U.TAU); c.fillStyle = '#ffe36b'; c.fill();
    },
    feather(c, col) {
      c.save(); c.translate(TEX / 2, TEX / 2); c.rotate(0.5);
      c.beginPath(); c.ellipse(0, 0, TEX * 0.14, TEX * 0.4, 0, 0, U.TAU);
      c.fillStyle = col; c.fill(); c.lineWidth = 2; c.strokeStyle = U.shade(col, -0.25); c.stroke();
      c.beginPath(); c.moveTo(0, -TEX * 0.36); c.lineTo(0, TEX * 0.44); c.strokeStyle = U.shade(col, -0.3); c.stroke();
      c.restore();
    },
    snow(c, col) {
      c.save(); c.translate(TEX / 2, TEX / 2);
      c.strokeStyle = col; c.lineWidth = 4; c.lineCap = 'round';
      c.shadowColor = col; c.shadowBlur = 6;
      for (let i = 0; i < 6; i++) {
        c.rotate(Math.PI / 3);
        c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -TEX * 0.4);
        c.moveTo(0, -TEX * 0.24); c.lineTo(-TEX * 0.1, -TEX * 0.33);
        c.moveTo(0, -TEX * 0.24); c.lineTo(TEX * 0.1, -TEX * 0.33);
        c.stroke();
      }
      c.restore();
    },
    moon(c, col) {
      c.shadowColor = col; c.shadowBlur = 10;
      G.moonPath(c, TEX / 2, TEX / 2, TEX * 0.34);
      c.fillStyle = col; c.fill();
    },
    shard(c, col) {
      c.beginPath();
      c.moveTo(TEX * 0.5, TEX * 0.06); c.lineTo(TEX * 0.72, TEX * 0.5); c.lineTo(TEX * 0.5, TEX * 0.94); c.lineTo(TEX * 0.28, TEX * 0.5); c.closePath();
      c.fillStyle = col; c.fill(); c.lineWidth = 2; c.strokeStyle = '#ffffff'; c.stroke();
      c.beginPath(); c.moveTo(TEX * 0.5, TEX * 0.1); c.lineTo(TEX * 0.6, TEX * 0.5); c.lineTo(TEX * 0.5, TEX * 0.5); c.closePath();
      c.fillStyle = 'rgba(255,255,255,0.7)'; c.fill();
    },
    smoke(c, col) {
      const blobs = [[0.5, 0.56, 0.3], [0.32, 0.6, 0.2], [0.68, 0.6, 0.2], [0.42, 0.4, 0.2], [0.6, 0.42, 0.18]];
      c.beginPath();
      for (const [x, y, r] of blobs) { c.moveTo(TEX * x + TEX * r, TEX * y); c.arc(TEX * x, TEX * y, TEX * r, 0, U.TAU); }
      c.lineWidth = 3; c.strokeStyle = U.shade(col, -0.18); c.stroke();
      c.fillStyle = col; c.fill();
      c.beginPath(); c.arc(TEX * 0.42, TEX * 0.38, TEX * 0.08, 0, U.TAU); c.fillStyle = 'rgba(255,255,255,0.7)'; c.fill();
    },
    confetti(c, col) {
      c.fillStyle = col; G.roundRect(c, TEX * 0.3, TEX * 0.15, TEX * 0.4, TEX * 0.7, 6); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.35)'; c.fillRect(TEX * 0.3, TEX * 0.15, TEX * 0.14, TEX * 0.7);
    },
    debris(c, col) {
      c.beginPath();
      c.moveTo(TEX * 0.2, TEX * 0.35); c.lineTo(TEX * 0.55, TEX * 0.16); c.lineTo(TEX * 0.84, TEX * 0.4);
      c.lineTo(TEX * 0.72, TEX * 0.8); c.lineTo(TEX * 0.3, TEX * 0.78); c.closePath();
      c.fillStyle = col; c.fill(); c.lineWidth = 3; c.strokeStyle = U.shade(col, -0.4); c.stroke();
      c.beginPath(); c.moveTo(TEX * 0.3, TEX * 0.38); c.lineTo(TEX * 0.55, TEX * 0.24); c.strokeStyle = 'rgba(255,255,255,0.6)'; c.stroke();
    },
    ring(c, col) {
      c.beginPath(); c.arc(TEX / 2, TEX / 2, TEX * 0.42, 0, U.TAU);
      c.lineWidth = 5; c.strokeStyle = col; c.shadowColor = col; c.shadowBlur = 6; c.stroke();
    },
    streak(c, col) {
      const g = c.createLinearGradient(0, 0, TEX, 0);
      g.addColorStop(0, U.rgba(col, 0)); g.addColorStop(0.7, U.rgba(col, 0.9)); g.addColorStop(1, '#ffffff');
      c.fillStyle = g;
      c.beginPath(); c.ellipse(TEX / 2, TEX / 2, TEX / 2, TEX * 0.08, 0, 0, U.TAU); c.fill();
    },
    note(c, col) {
      c.fillStyle = col; c.strokeStyle = U.shade(col, -0.35); c.lineWidth = 2.5;
      c.beginPath(); c.ellipse(TEX * 0.38, TEX * 0.7, TEX * 0.14, TEX * 0.1, -0.4, 0, U.TAU); c.fill(); c.stroke();
      c.fillRect(TEX * 0.49, TEX * 0.18, TEX * 0.05, TEX * 0.52);
      c.beginPath(); c.moveTo(TEX * 0.52, TEX * 0.18); c.quadraticCurveTo(TEX * 0.75, TEX * 0.25, TEX * 0.72, TEX * 0.42); c.lineWidth = 5; c.strokeStyle = col; c.stroke();
    },
    leaf(c, col) {
      c.beginPath(); c.moveTo(TEX * 0.15, TEX * 0.5);
      c.quadraticCurveTo(TEX * 0.5, TEX * 0.1, TEX * 0.85, TEX * 0.5);
      c.quadraticCurveTo(TEX * 0.5, TEX * 0.9, TEX * 0.15, TEX * 0.5);
      c.fillStyle = col; c.fill(); c.lineWidth = 2; c.strokeStyle = U.shade(col, -0.3); c.stroke();
    },
    yarn(c, col) {
      c.beginPath(); c.arc(TEX / 2, TEX / 2, TEX * 0.36, 0, U.TAU);
      c.fillStyle = col; c.fill(); c.lineWidth = 3; c.strokeStyle = U.shade(col, -0.4); c.stroke();
      c.save(); c.clip();
      c.strokeStyle = U.shade(col, -0.2); c.lineWidth = 2;
      for (let i = -3; i <= 3; i++) { c.beginPath(); c.ellipse(TEX / 2 + i * 7, TEX / 2, TEX * 0.12, TEX * 0.4, 0.5, 0, U.TAU); c.stroke(); }
      c.restore();
    },
  };

  G.tex = (shape, color) => {
    const key = shape + color;
    let c = texCache.get(key);
    if (!c) {
      c = G.makeCanvas(TEX, TEX);
      const ctx = c.getContext('2d');
      (painters[shape] || painters.circle)(ctx, color);
      texCache.set(key, c);
    }
    return c;
  };
  G.TEX = TEX;

  /* ---------- text ---------- */
  G.font = (size, weight = 800, display = false) => `${weight} ${size}px ${display ? NK.C.FONT_DISPLAY : NK.C.FONT_UI}`;
  G.text = (ctx, str, x, y, o = {}) => {
    ctx.font = o.font || G.font(o.size || 20, o.weight || 800, o.display);
    ctx.textAlign = o.align || 'center';
    ctx.textBaseline = o.baseline || 'middle';
    if (o.shadow) {
      ctx.fillStyle = o.shadow;
      ctx.fillText(str, x, y + (o.shadowOff || 3));
    }
    if (o.stroke) {
      ctx.lineJoin = 'round';
      ctx.lineWidth = o.strokeW || 5;
      ctx.strokeStyle = o.stroke;
      if (o.shadow) { ctx.strokeStyle = o.shadow; ctx.strokeText(str, x, y + (o.shadowOff || 3)); ctx.strokeStyle = o.stroke; }
      ctx.strokeText(str, x, y);
    }
    ctx.fillStyle = o.color || '#ffffff';
    ctx.fillText(str, x, y);
  };
  // wrap text into lines by width
  G.wrap = (ctx, str, maxW) => {
    const words = str.split(' ');
    const lines = [];
    let line = '';
    for (const w of words) {
      const t = line ? line + ' ' + w : w;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
    }
    if (line) lines.push(line);
    return lines;
  };

  /* ---------- icons (class / card-type) ---------- */
  G.icon = (ctx, name, x, y, s, color = '#ffffff', outline = NK.C.INK) => {
    ctx.save();
    ctx.translate(x, y);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const lw = Math.max(1.5, s * 0.14);
    const fs = () => G.fillStroke(ctx, color, outline, lw);
    switch (name) {
      case 'sword':
        ctx.rotate(-Math.PI / 4);
        ctx.beginPath(); ctx.moveTo(-s * 0.12, s * 0.2); ctx.lineTo(-s * 0.12, -s * 0.7); ctx.lineTo(0, -s * 0.9); ctx.lineTo(s * 0.12, -s * 0.7); ctx.lineTo(s * 0.12, s * 0.2); ctx.closePath(); fs();
        ctx.beginPath(); G.roundRect(ctx, -s * 0.38, s * 0.18, s * 0.76, s * 0.16, s * 0.06); fs();
        ctx.beginPath(); G.roundRect(ctx, -s * 0.08, s * 0.32, s * 0.16, s * 0.42, s * 0.06); fs();
        break;
      case 'bow':
        ctx.beginPath(); ctx.arc(-s * 0.2, 0, s * 0.72, -1.1, 1.1); ctx.lineWidth = lw * 2.4; ctx.strokeStyle = outline; ctx.stroke(); ctx.lineWidth = lw * 1.1; ctx.strokeStyle = color; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(s * 0.12, -s * 0.64); ctx.lineTo(s * 0.12, s * 0.64); ctx.lineWidth = lw * 0.7; ctx.strokeStyle = outline; ctx.stroke();
        G.softStarPath(ctx, s * 0.5, 0, s * 0.34, s * 0.16); fs();
        break;
      case 'shield':
        ctx.beginPath(); ctx.moveTo(0, -s * 0.8); ctx.quadraticCurveTo(s * 0.7, -s * 0.7, s * 0.66, -s * 0.2); ctx.quadraticCurveTo(s * 0.55, s * 0.5, 0, s * 0.85);
        ctx.quadraticCurveTo(-s * 0.55, s * 0.5, -s * 0.66, -s * 0.2); ctx.quadraticCurveTo(-s * 0.7, -s * 0.7, 0, -s * 0.8); ctx.closePath(); fs();
        G.pawPath(ctx, 0, 0, s * 0.36); ctx.fillStyle = outline; ctx.fill();
        break;
      case 'wand':
        ctx.beginPath(); ctx.moveTo(-s * 0.55, s * 0.6); ctx.lineTo(s * 0.1, -s * 0.05); ctx.lineWidth = lw * 2.6; ctx.strokeStyle = outline; ctx.stroke(); ctx.lineWidth = lw * 1.2; ctx.strokeStyle = color; ctx.stroke();
        G.softStarPath(ctx, s * 0.25, -s * 0.25, s * 0.55, s * 0.26); fs();
        break;
      case 'dash':
        for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-s * 0.8, -s * 0.4 + i * s * 0.4); ctx.lineTo(s * 0.1 - i * s * 0.15, -s * 0.4 + i * s * 0.4); ctx.lineWidth = lw * 2.2; ctx.strokeStyle = outline; ctx.stroke(); ctx.lineWidth = lw; ctx.strokeStyle = color; ctx.stroke(); }
        G.starPath(ctx, s * 0.45, 0, s * 0.45, s * 0.14, 4); fs();
        break;
      case 'wing':
        ctx.beginPath(); ctx.moveTo(-s * 0.6, s * 0.3); ctx.quadraticCurveTo(-s * 0.4, -s * 0.8, s * 0.7, -s * 0.6);
        ctx.quadraticCurveTo(s * 0.4, -s * 0.3, s * 0.55, -s * 0.2); ctx.quadraticCurveTo(s * 0.2, 0, s * 0.35, s * 0.15); ctx.quadraticCurveTo(0, s * 0.3, -s * 0.6, s * 0.3); fs();
        break;
      case 'flame':
        ctx.beginPath(); ctx.moveTo(0, s * 0.8); ctx.bezierCurveTo(-s * 0.8, s * 0.6, -s * 0.5, -s * 0.2, 0, -s * 0.85);
        ctx.bezierCurveTo(s * 0.1, -s * 0.3, s * 0.7, -s * 0.2, s * 0.55, s * 0.3); ctx.quadraticCurveTo(s * 0.45, s * 0.75, 0, s * 0.8); fs();
        G.heartPath(ctx, 0, s * 0.3, s * 0.25); ctx.fillStyle = '#fff3a0'; ctx.fill();
        break;
      case 'moon': G.moonPath(ctx, 0, 0, s * 0.75); fs(); break;
      case 'cannon':
        ctx.beginPath(); ctx.arc(-s * 0.1, s * 0.3, s * 0.45, 0, U.TAU); fs();
        ctx.save(); ctx.rotate(-0.6); G.roundRect(ctx, -s * 0.1, -s * 0.3, s * 0.95, s * 0.6, s * 0.2); fs(); ctx.restore();
        break;
      case 'paws':
        G.pawPath(ctx, -s * 0.35, s * 0.25, s * 0.42); fs(); G.pawPath(ctx, s * 0.35, -s * 0.25, s * 0.42); fs();
        break;
      case 'snow': {
        ctx.strokeStyle = outline; ctx.lineWidth = lw * 2.4;
        const drawFlake = () => { for (let i = 0; i < 6; i++) { ctx.save(); ctx.rotate((i * Math.PI) / 3); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -s * 0.8); ctx.moveTo(0, -s * 0.45); ctx.lineTo(-s * 0.2, -s * 0.62); ctx.moveTo(0, -s * 0.45); ctx.lineTo(s * 0.2, -s * 0.62); ctx.stroke(); ctx.restore(); } };
        drawFlake(); ctx.strokeStyle = color; ctx.lineWidth = lw; drawFlake();
        break;
      }
      case 'heart': G.heartPath(ctx, 0, 0, s * 0.7); fs(); break;
      case 'star': G.softStarPath(ctx, 0, s * 0.05, s * 0.9, s * 0.45); fs(); break;
      case 'flower': G.flowerPath(ctx, 0, 0, s * 0.9, 5, -Math.PI / 2); fs(); ctx.beginPath(); ctx.arc(0, 0, s * 0.25, 0, U.TAU); ctx.fillStyle = '#ffe36b'; ctx.fill(); break;
      case 'bolt':
        ctx.beginPath(); ctx.moveTo(s * 0.15, -s * 0.9); ctx.lineTo(-s * 0.45, s * 0.1); ctx.lineTo(-s * 0.02, s * 0.1); ctx.lineTo(-s * 0.2, s * 0.9); ctx.lineTo(s * 0.5, -s * 0.15); ctx.lineTo(s * 0.06, -s * 0.15); ctx.closePath(); fs();
        break;
      case 'bubble':
        ctx.beginPath(); ctx.arc(0, 0, s * 0.75, 0, U.TAU); ctx.fillStyle = U.rgba('#bfe9ff', 0.6); ctx.fill(); ctx.lineWidth = lw; ctx.strokeStyle = outline; ctx.stroke();
        ctx.beginPath(); ctx.arc(-s * 0.25, -s * 0.28, s * 0.18, 0, U.TAU); ctx.fillStyle = '#ffffff'; ctx.fill();
        break;
      case 'yarn': {
        ctx.beginPath(); ctx.arc(0, 0, s * 0.7, 0, U.TAU); fs();
        ctx.save(); ctx.beginPath(); ctx.arc(0, 0, s * 0.7, 0, U.TAU); ctx.clip();
        ctx.lineWidth = lw * 0.8; ctx.strokeStyle = outline;
        for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.ellipse(i * s * 0.3, 0, s * 0.15, s * 0.8, 0.5, 0, U.TAU); ctx.stroke(); }
        ctx.restore();
        break;
      }
      case 'shrine':
        ctx.beginPath(); G.roundRect(ctx, -s * 0.85, -s * 0.7, s * 1.7, s * 0.28, s * 0.1); fs();
        ctx.beginPath(); G.roundRect(ctx, -s * 0.6, -s * 0.42, s * 0.2, s * 1.2, s * 0.06); fs();
        ctx.beginPath(); G.roundRect(ctx, s * 0.4, -s * 0.42, s * 0.2, s * 1.2, s * 0.06); fs();
        ctx.beginPath(); G.roundRect(ctx, -s * 0.7, -s * 0.25, s * 1.4, s * 0.16, s * 0.05); fs();
        break;
      case 'drop':
        ctx.beginPath(); ctx.moveTo(0, -s * 0.9); ctx.bezierCurveTo(s * 0.35, -s * 0.45, s * 0.75, -s * 0.05, s * 0.7, s * 0.3);
        ctx.arc(0, s * 0.3, s * 0.7, 0, Math.PI); ctx.bezierCurveTo(-s * 0.75, -s * 0.05, -s * 0.35, -s * 0.45, 0, -s * 0.9); ctx.closePath(); fs();
        break;
      case 'crown':
        ctx.beginPath(); ctx.moveTo(-s * 0.8, s * 0.5); ctx.lineTo(-s * 0.85, -s * 0.35); ctx.lineTo(-s * 0.4, 0); ctx.lineTo(0, -s * 0.6);
        ctx.lineTo(s * 0.4, 0); ctx.lineTo(s * 0.85, -s * 0.35); ctx.lineTo(s * 0.8, s * 0.5); ctx.closePath(); fs();
        break;
      default:
        ctx.beginPath(); ctx.arc(0, 0, s * 0.6, 0, U.TAU); fs();
    }
    ctx.restore();
  };

  return G;
})();

/* ---- 03_catart.js ---- */
/* =====================================================================
   Procedural chibi cat renderer + sprite cache
   Every cat = bean body + oversized head + stubby paws + class accessories.
   Frames are rendered once into offscreen canvases (idle/walk/attack/hurt)
   and animated at runtime with squash/stretch transforms.
   ===================================================================== */
'use strict';
NK.CatArt = (() => {
  const U = NK.U, G = NK.G, TAU = U.TAU;
  const INK = NK.C.INK;
  let RES = 2;                         // cache resolution multiplier (matched to display scale)
  const BOX_W = 170, BOX_H = 170, ORG_X = 85, ORG_Y = 138;
  const cache = new Map();

  const FRAMES = ['idle0', 'idle1', 'walk0', 'walk1', 'walk2', 'walk3', 'atk0', 'atk1', 'atk2', 'hurt'];

  /* ---------- pose table ---------- */
  function poseFor(frame) {
    const p = { legL: [0, 0], legR: [0, 0], bodyY: 0, headY: 0, tail: 0, eyes: 'open', mouth: 'w', arm: 'idle', wing: 0, lean: 0, pawBob: 0 };
    switch (frame) {
      case 'idle1': p.eyes = 'blink'; break;
      case 'walk0': p.legL = [-1, -4]; p.legR = [1, 0]; p.bodyY = -1.5; p.tail = -0.25; p.wing = 1; p.pawBob = -1.5; break;
      case 'walk1': p.bodyY = 0.5; p.headY = 0.8; p.tail = 0; p.wing = 0.5; break;
      case 'walk2': p.legL = [-1, 0]; p.legR = [1, -4]; p.bodyY = -1.5; p.tail = 0.25; p.wing = 0; p.pawBob = 1.5; break;
      case 'walk3': p.bodyY = 0.5; p.headY = 0.8; p.tail = 0; p.wing = 0.5; break;
      case 'atk0': p.arm = 'wind'; p.eyes = 'focus'; p.mouth = 'line'; p.lean = -1; p.tail = -0.35; p.wing = 1; break;
      case 'atk1': p.arm = 'strike'; p.eyes = 'focus'; p.mouth = 'open'; p.lean = 1.5; p.tail = 0.3; p.wing = 0; break;
      case 'atk2': p.arm = 'follow'; p.eyes = 'open'; p.mouth = 'open'; p.lean = 0.5; p.tail = 0.15; p.wing = 0.4; break;
      case 'hurt': p.eyes = 'hurt'; p.mouth = 'wavy'; p.headY = 1; p.tail = 0.4; p.wing = 0.3; break;
      default: break;
    }
    return p;
  }

  /* ---------- small helpers ---------- */
  function ell(ctx, x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); }
  function shaded(ctx, base, x, y, r) {
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.45, r * 0.1, x, y, r * 1.1);
    g.addColorStop(0, U.shade(base, 0.45));
    g.addColorStop(0.45, base);
    g.addColorStop(1, U.shade(base, -0.12));
    return g;
  }
  function outlined(ctx, fill, lw, stroke = INK) {
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke();
    ctx.fillStyle = fill; ctx.fill();
  }
  function shine(ctx, x, y, rx, ry, rot = -0.5, a = 0.55) {
    ell(ctx, x, y, rx, ry, rot); ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fill();
  }

  /* ---------- body parts ---------- */
  function drawTail(ctx, art, p, lw, opts = {}) {
    const sw = p.tail * 7;
    const tx = opts.x || 12, ty = opts.y || -12;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(tx + 17, ty + 3 + sw * 0.3, tx + 15 + sw, ty - 22);
    ctx.lineCap = 'round';
    ctx.lineWidth = 7.5 + lw * 2; ctx.strokeStyle = INK; ctx.stroke();
    ctx.lineWidth = 7.5; ctx.strokeStyle = art.body; ctx.stroke();
    if (art.pattern === 'tabby' || art.pattern === 'calico') {
      // tail tip
      ctx.beginPath();
      ctx.moveTo(tx + 16 + sw * 0.9, ty - 16);
      ctx.lineTo(tx + 15 + sw, ty - 22);
      ctx.lineWidth = 7.5; ctx.strokeStyle = art.stripe; ctx.stroke();
    }
    if (opts.heartTip) {
      G.heartPath(ctx, tx + 15 + sw, ty - 26, 5.5);
      outlined(ctx, art.stripe, lw);
    }
  }

  function drawFeet(ctx, art, p, lw, flying) {
    const footCol = art.pattern === 'socks' ? art.belly : U.shade(art.body, 0.05);
    if (flying) {
      ell(ctx, -6, -6 + p.legL[1] * 0.3, 4.5, 4); outlined(ctx, footCol, lw);
      ell(ctx, 6, -6 + p.legR[1] * 0.3, 4.5, 4); outlined(ctx, footCol, lw);
      return;
    }
    ell(ctx, -8.5 + p.legL[0], -4 + p.legL[1], 6.8, 5); outlined(ctx, footCol, lw);
    ell(ctx, 8.5 + p.legR[0], -4 + p.legR[1], 6.8, 5); outlined(ctx, footCol, lw);
    // toe lines
    ctx.lineWidth = lw * 0.5; ctx.strokeStyle = U.rgba(INK, 0.45);
    for (const [fx, fy] of [[-8.5 + p.legL[0], -4 + p.legL[1]], [8.5 + p.legR[0], -4 + p.legR[1]]]) {
      ctx.beginPath(); ctx.moveTo(fx - 2, fy + 1.5); ctx.lineTo(fx - 2, fy + 4); ctx.moveTo(fx + 2, fy + 1.5); ctx.lineTo(fx + 2, fy + 4); ctx.stroke();
    }
  }

  function drawBody(ctx, art, p, lw, rx = 16.5, ry = 13.5) {
    const by = -16 + p.bodyY;
    ell(ctx, 0, by, rx, ry);
    outlined(ctx, shaded(ctx, art.body, 0, by, rx), lw);
    ell(ctx, 0, by + 3, rx * 0.6, ry * 0.6);
    ctx.fillStyle = art.belly; ctx.fill();
    if (art.pattern === 'tabby') {
      ctx.lineWidth = 2.6; ctx.strokeStyle = art.stripe; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-rx + 2, by - 3); ctx.lineTo(-rx + 6, by - 1); ctx.moveTo(rx - 2, by - 3); ctx.lineTo(rx - 6, by - 1); ctx.stroke();
    }
    return by;
  }

  function drawPaw(ctx, art, x, y, lw, r = 5.2) {
    ell(ctx, x, y, r, r * 0.92);
    outlined(ctx, art.pattern === 'socks' ? art.belly : U.shade(art.body, 0.12), lw);
  }

  function drawEar(ctx, art, side, hx, hy, lw, col, innerCol) {
    const s = side;
    ctx.beginPath();
    ctx.moveTo(hx + s * 25, hy - 4);
    ctx.quadraticCurveTo(hx + s * 26, hy - 24, hx + s * 21, hy - 31);
    ctx.quadraticCurveTo(hx + s * 12, hy - 27, hx + s * 4, hy - 20);
    ctx.closePath();
    outlined(ctx, col || art.body, lw);
    ctx.beginPath();
    ctx.moveTo(hx + s * 21, hy - 9);
    ctx.quadraticCurveTo(hx + s * 22, hy - 22, hx + s * 19.5, hy - 26);
    ctx.quadraticCurveTo(hx + s * 13, hy - 23, hx + s * 8, hy - 18);
    ctx.closePath();
    ctx.fillStyle = innerCol || '#ffb3c7'; ctx.fill();
  }

  function drawEye(ctx, art, x, y, state, side, opts = {}) {
    const rx = opts.rx || 6.2, ry = opts.ry || 7.8;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (state === 'blink' || state === 'happy') {
      ctx.beginPath(); ctx.arc(x, y + 2.5, 5, Math.PI * 1.12, Math.PI * 1.88);
      ctx.lineWidth = 2.6; ctx.strokeStyle = INK; ctx.stroke();
      return;
    }
    if (state === 'hurt') {
      ctx.beginPath();
      ctx.moveTo(x - side * 5, y - 5); ctx.lineTo(x + side * 3, y); ctx.lineTo(x - side * 5, y + 5);
      ctx.lineWidth = 2.8; ctx.strokeStyle = INK; ctx.stroke();
      return;
    }
    // open / focus
    ell(ctx, x, y, rx, ry);
    const g = ctx.createLinearGradient(x, y - ry, x, y + ry);
    g.addColorStop(0, '#2a1838'); g.addColorStop(0.45, '#3a2150'); g.addColorStop(1, art.eye);
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 1.4; ctx.strokeStyle = INK; ctx.stroke();
    if (opts.starShine) {
      G.softStarPath(ctx, x - 1.8, y - 2.6, 3.4, 1.6); ctx.fillStyle = '#ffffff'; ctx.fill();
    } else {
      ell(ctx, x - 2, y - 3, 2.7, 2.9); ctx.fillStyle = '#ffffff'; ctx.fill();
    }
    ell(ctx, x + 2.3, y + 3, 1.3, 1.3); ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fill();
    if (state === 'focus') {
      // determined lid
      ctx.save();
      ell(ctx, x, y, rx + 0.8, ry + 0.8); ctx.clip();
      ctx.beginPath();
      ctx.moveTo(x - rx - 2, y - ry - 2 + (side < 0 ? 0 : 4));
      ctx.lineTo(x + rx + 2, y - ry - 2 + (side < 0 ? 4 : 0));
      ctx.lineTo(x + rx + 2, y - ry * 0.25 + (side < 0 ? 4 : 0));
      ctx.lineTo(x - rx - 2, y - ry * 0.25 + (side < 0 ? 0 : 4));
      ctx.closePath();
      ctx.fillStyle = opts.lidCol || art.body; ctx.fill();
      ctx.restore();
      ctx.beginPath();
      ctx.moveTo(x - rx, y - ry * 0.3 + (side < 0 ? -0.5 : 3.5));
      ctx.lineTo(x + rx, y - ry * 0.3 + (side < 0 ? 3.5 : -0.5));
      ctx.lineWidth = 2.2; ctx.strokeStyle = INK; ctx.stroke();
    }
  }

  function drawMouth(ctx, x, y, state) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = INK; ctx.lineWidth = 1.7;
    if (state === 'open') {
      ctx.beginPath(); ctx.moveTo(x - 4, y); ctx.quadraticCurveTo(x, y + 7.5, x + 4, y); ctx.closePath();
      ctx.fillStyle = '#8a2f55'; ctx.fill(); ctx.stroke();
      ell(ctx, x, y + 3.6, 2.2, 1.4); ctx.fillStyle = '#ff8fb0'; ctx.fill();
    } else if (state === 'wavy') {
      ctx.beginPath(); ctx.moveTo(x - 4.5, y + 2); ctx.lineTo(x - 2, y); ctx.lineTo(x, y + 2); ctx.lineTo(x + 2, y); ctx.lineTo(x + 4.5, y + 2); ctx.stroke();
    } else if (state === 'line') {
      ctx.beginPath(); ctx.moveTo(x - 3, y + 1.2); ctx.quadraticCurveTo(x, y - 0.5, x + 3, y + 1.2); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(x - 2.6, y, 2.6, 0.1, Math.PI - 0.1); ctx.moveTo(x + 5.2, y); ctx.arc(x + 2.6, y, 2.6, 0.1, Math.PI - 0.1); ctx.stroke();
    }
  }

  function drawFace(ctx, art, p, hx, hy, opts = {}) {
    const ey = hy + 1;
    if (!opts.noBlush) {
      ell(ctx, hx - 17, hy + 9, 4.6, 2.7); ctx.fillStyle = 'rgba(255,120,160,0.45)'; ctx.fill();
      ell(ctx, hx + 17, hy + 9, 4.6, 2.7); ctx.fill();
    }
    let eyes = p.eyes;
    if (opts.alwaysFocus && eyes === 'open') eyes = 'focus';
    drawEye(ctx, art, hx - 10.5, ey, eyes, -1, opts);
    drawEye(ctx, art, hx + 10.5, ey, eyes, 1, opts);
    if (opts.brows && eyes !== 'hurt' && eyes !== 'focus') {
      ctx.lineWidth = 2.2; ctx.strokeStyle = INK; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(hx - 15, ey - 11); ctx.lineTo(hx - 7, ey - 9); ctx.moveTo(hx + 15, ey - 11); ctx.lineTo(hx + 7, ey - 9); ctx.stroke();
    }
    if (!opts.noMouth) {
      ell(ctx, hx, hy + 6, 2.1, 1.5); ctx.fillStyle = '#ff7fa3'; ctx.fill();
      drawMouth(ctx, hx, hy + 8.5, p.mouth);
    }
    if (!opts.noWhiskers) {
      ctx.lineWidth = 1.1; ctx.strokeStyle = U.rgba(INK, 0.55); ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(hx - 21, hy + 5); ctx.lineTo(hx - 31, hy + 3);
      ctx.moveTo(hx - 21, hy + 8); ctx.lineTo(hx - 30, hy + 10);
      ctx.moveTo(hx + 21, hy + 5); ctx.lineTo(hx + 31, hy + 3);
      ctx.moveTo(hx + 21, hy + 8); ctx.lineTo(hx + 30, hy + 10);
      ctx.stroke();
    }
  }

  function drawHeadPattern(ctx, art, hx, hy) {
    if (art.pattern === 'tabby') {
      ctx.lineWidth = 3; ctx.strokeStyle = art.stripe; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(hx - 6.5, hy - 20); ctx.lineTo(hx - 5, hy - 14);
      ctx.moveTo(hx, hy - 21.5); ctx.lineTo(hx, hy - 14.5);
      ctx.moveTo(hx + 6.5, hy - 20); ctx.lineTo(hx + 5, hy - 14);
      ctx.moveTo(hx - 25, hy - 2); ctx.lineTo(hx - 20, hy - 1);
      ctx.moveTo(hx + 25, hy - 2); ctx.lineTo(hx + 20, hy - 1);
      ctx.stroke();
    } else if (art.pattern === 'patch' || art.pattern === 'calico') {
      ctx.save();
      ell(ctx, hx, hy, 26, 22.5); ctx.clip();
      ell(ctx, hx + 15, hy - 12, 13, 11, 0.4); ctx.fillStyle = art.stripe; ctx.fill();
      if (art.pattern === 'calico') { ell(ctx, hx - 17, hy - 14, 9, 8, -0.3); ctx.fillStyle = '#6b4a3a'; ctx.fill(); }
      ctx.restore();
    }
  }

  function drawHead(ctx, art, p, lw, opts = {}) {
    const hx = (opts.hx || 0) + p.lean * 0.6, hy = (opts.hy || -42) + p.headY;
    if (!opts.noEars) {
      drawEar(ctx, art, -1, hx, hy, lw, opts.earCol, opts.earInner);
      drawEar(ctx, art, 1, hx, hy, lw, opts.earCol, opts.earInner);
    }
    ell(ctx, hx, hy, 26, 22.5);
    outlined(ctx, shaded(ctx, opts.headCol || art.body, hx, hy, 26), lw);
    drawHeadPattern(ctx, art, hx, hy);
    shine(ctx, hx - 10, hy - 13, 7, 3.4, -0.45, 0.5);
    if (opts.beforeFace) opts.beforeFace(hx, hy);
    drawFace(ctx, art, p, hx, hy, opts);
    return [hx, hy];
  }

  function drawCollar(ctx, team, lw, y = -19.5) {
    const tc = NK.C.TEAM[team];
    ctx.beginPath();
    ctx.moveTo(-12, y - 1.5); ctx.quadraticCurveTo(0, y + 5, 12, y - 1.5);
    ctx.lineCap = 'round';
    ctx.lineWidth = 5 + lw * 2; ctx.strokeStyle = INK; ctx.stroke();
    ctx.lineWidth = 5; ctx.strokeStyle = tc.main; ctx.stroke();
    ell(ctx, 0, y + 3.5, 3.4, 3.4); outlined(ctx, '#ffd84a', lw * 0.7);
    ell(ctx, -1, y + 2.5, 1, 1); ctx.fillStyle = '#fff'; ctx.fill();
  }

  function drawScarf(ctx, team, lw, p, knot = -1, y = -20) {
    const tc = NK.C.TEAM[team];
    ctx.beginPath();
    ctx.moveTo(-14, y - 2); ctx.quadraticCurveTo(0, y + 7, 14, y - 2);
    ctx.lineCap = 'round';
    ctx.lineWidth = 7 + lw * 2; ctx.strokeStyle = INK; ctx.stroke();
    ctx.lineWidth = 7; ctx.strokeStyle = tc.main; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-10, y + 1); ctx.quadraticCurveTo(0, y + 6, 10, y + 1);
    ctx.lineWidth = 1.5; ctx.strokeStyle = tc.light; ctx.stroke();
    ell(ctx, knot * 11, y + 1, 4.2, 3.6); outlined(ctx, tc.main, lw);
  }
  function drawScarfTails(ctx, team, lw, p, len = 1) {
    const tc = NK.C.TEAM[team];
    const w = p.tail * 5;
    for (let i = 0; i < 2; i++) {
      const oy = i * 5;
      ctx.beginPath();
      ctx.moveTo(-10, -19 + oy);
      ctx.quadraticCurveTo(-22 * len, -22 + oy + w, -34 * len, -16 + oy - w);
      ctx.lineCap = 'round';
      ctx.lineWidth = 5.5 + lw * 2; ctx.strokeStyle = INK; ctx.stroke();
      ctx.lineWidth = 5.5; ctx.strokeStyle = i ? tc.dark : tc.main; ctx.stroke();
    }
  }

  /* ---------- weapons ---------- */
  function drawSword(ctx, x, y, ang, lw, glow = '#9fe8ff') {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(ang);
    // handle
    ctx.beginPath(); G.roundRect(ctx, -7, -2.2, 9, 4.4, 2); outlined(ctx, '#9b6a4a', lw * 0.8);
    // guard
    ctx.beginPath(); G.roundRect(ctx, 1.5, -6.5, 4, 13, 2); outlined(ctx, '#ffd35a', lw * 0.8);
    // blade
    ctx.shadowColor = glow; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.moveTo(5.5, -3.2); ctx.lineTo(30, -2.2); ctx.lineTo(36, 0); ctx.lineTo(30, 2.2); ctx.lineTo(5.5, 3.2); ctx.closePath();
    const g = ctx.createLinearGradient(5, -3, 5, 3);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#a9ecff');
    outlined(ctx, g, lw * 0.8);
    ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.moveTo(8, -0.6); ctx.lineTo(29, -0.6); ctx.lineWidth = 1.2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
    ctx.restore();
  }

  function drawStarWand(ctx, x, y, ang, lw, col = '#ffd84a', size = 1) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -20 * size);
    ctx.lineCap = 'round'; ctx.lineWidth = 3.4 + lw * 2; ctx.strokeStyle = INK; ctx.stroke();
    ctx.lineWidth = 3.4; ctx.strokeStyle = '#fff3d6'; ctx.stroke();
    ctx.shadowColor = col; ctx.shadowBlur = 12;
    G.softStarPath(ctx, 0, -25 * size, 9.5 * size, 4.8 * size);
    outlined(ctx, col, lw);
    ctx.shadowBlur = 0;
    G.softStarPath(ctx, -1.5 * size, -26.5 * size, 3.5 * size, 1.8 * size); ctx.fillStyle = '#fffbe8'; ctx.fill();
    ctx.restore();
  }

  /* ---------- per-class accessories ---------- */
  const KINDS = {};

  KINDS.sword = {
    back(ctx, art, p, lw, team) { drawScarfTails(ctx, team, lw, p, 0.9); },
    neck(ctx, art, p, lw, team) { drawScarf(ctx, team, lw, p, -1); },
    faceOpts: { brows: true },
    hand(ctx, art, p, lw) {
      let px = 15, py = -15, ang = -1.15;
      if (p.arm === 'wind') { px = 8; py = -32; ang = -2.5; }
      else if (p.arm === 'strike') { px = 21; py = -12; ang = 0.55; }
      else if (p.arm === 'follow') { px = 18; py = -13; ang = 0.05; }
      px += p.pawBob * 0.3;
      drawSword(ctx, px, py, ang, lw);
      drawPaw(ctx, art, px, py, lw);
    },
  };

  KINDS.archer = {
    back(ctx, art, p, lw) {
      // quiver
      ctx.save(); ctx.translate(14, -30); ctx.rotate(0.45);
      ctx.beginPath(); G.roundRect(ctx, -5, -10, 10, 20, 3); outlined(ctx, '#a8744f', lw);
      for (let i = -1; i <= 1; i++) { G.softStarPath(ctx, i * 3.5, -13 - Math.abs(i) * -2, 3.4, 1.6); outlined(ctx, '#ffe066', lw * 0.6); }
      ctx.restore();
    },
    head(ctx, art, p, lw, hx, hy) {
      // leaf hair clip
      for (let i = 0; i < 2; i++) {
        ctx.save(); ctx.translate(hx - 16, hy - 20); ctx.rotate(-0.6 + i * 0.9);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(5, -6, 12, -1); ctx.quadraticCurveTo(5, 4, 0, 0);
        outlined(ctx, i ? '#9be07a' : '#6cc95a', lw * 0.8);
        ctx.restore();
      }
      ell(ctx, hx - 16, hy - 20, 2.6, 2.6); outlined(ctx, '#ffd84a', lw * 0.6);
    },
    hand(ctx, art, p, lw) {
      const bx = -26 + (p.arm === 'strike' ? -1 : 0), by = -14;
      const pull = p.arm === 'wind' ? 9 : p.arm === 'follow' ? 2 : 0;
      // bow
      ctx.beginPath(); ctx.arc(bx + 12, by, 15, Math.PI * 0.62, Math.PI * 1.38);
      ctx.lineCap = 'round'; ctx.lineWidth = 3.8 + lw * 2; ctx.strokeStyle = INK; ctx.stroke();
      ctx.lineWidth = 3.8; ctx.strokeStyle = '#8fd46e'; ctx.stroke();
      const ty = by - 15 * Math.sin(Math.PI * 0.38), tx = bx + 12 + 15 * Math.cos(Math.PI * 0.62);
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(bx + 1 + pull, by); ctx.lineTo(tx, by + (by - ty));
      ctx.lineWidth = 1; ctx.strokeStyle = '#fff'; ctx.stroke();
      if (p.arm === 'wind') {
        ctx.beginPath(); ctx.moveTo(bx + 1 + pull, by); ctx.lineTo(bx - 14, by);
        ctx.lineWidth = 2; ctx.strokeStyle = '#a8744f'; ctx.stroke();
        ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 8;
        G.softStarPath(ctx, bx - 16, by, 5, 2.4); outlined(ctx, '#ffe066', lw * 0.6);
        ctx.shadowBlur = 0;
        drawPaw(ctx, art, bx + 1 + pull, by, lw, 4.6);
      }
      drawPaw(ctx, art, bx - 3, by + 1, lw);
      drawPaw(ctx, art, 14, -14 + p.pawBob * 0.5, lw);
    },
  };

  KINDS.tank = {
    bodyR: [19.5, 15.5],
    head(ctx, art, p, lw, hx, hy) {
      // tiny knight helmet
      ctx.beginPath();
      ctx.moveTo(hx - 15, hy - 14);
      ctx.quadraticCurveTo(hx - 15, hy - 31, hx, hy - 31);
      ctx.quadraticCurveTo(hx + 15, hy - 31, hx + 15, hy - 14);
      ctx.quadraticCurveTo(hx, hy - 18, hx - 15, hy - 14);
      const g = ctx.createLinearGradient(hx - 15, hy - 30, hx + 15, hy - 14);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#cfd6e8'); g.addColorStop(1, '#8e98b8');
      outlined(ctx, g, lw);
      ctx.beginPath(); ctx.moveTo(hx, hy - 30); ctx.lineTo(hx, hy - 17); ctx.lineWidth = 2; ctx.strokeStyle = '#8e98b8'; ctx.stroke();
      // plume
      ctx.beginPath(); ctx.moveTo(hx - 2, hy - 30); ctx.quadraticCurveTo(hx - 4, hy - 44, hx + 10, hy - 42 + p.tail * 3);
      ctx.quadraticCurveTo(hx + 4, hy - 36, hx + 3, hy - 30); ctx.closePath();
      outlined(ctx, '#ff9ec0', lw);
    },
    front(ctx, art, p, lw, team) {
      const tc = NK.C.TEAM[team];
      let sx = -11, sy = -22, rot = -0.08, sc = 1;
      if (p.arm === 'wind') { sx = -15; sy = -25; rot = -0.2; }
      else if (p.arm === 'strike') { sx = -3; sy = -18; rot = 0.18; sc = 1.06; }
      else if (p.arm === 'follow') { sx = -7; sy = -20; rot = 0.08; }
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(rot); ctx.scale(sc, sc);
      ctx.beginPath();
      ctx.moveTo(0, -21); ctx.quadraticCurveTo(17, -20, 17, -8); ctx.quadraticCurveTo(16, 12, 0, 22);
      ctx.quadraticCurveTo(-16, 12, -17, -8); ctx.quadraticCurveTo(-17, -20, 0, -21); ctx.closePath();
      const g = ctx.createLinearGradient(-17, -20, 17, 20);
      g.addColorStop(0, tc.light); g.addColorStop(0.5, tc.main); g.addColorStop(1, tc.dark);
      outlined(ctx, g, lw * 1.1);
      ctx.beginPath();
      ctx.moveTo(0, -16.5); ctx.quadraticCurveTo(13, -16, 13, -7); ctx.quadraticCurveTo(12, 9, 0, 17);
      ctx.quadraticCurveTo(-12, 9, -13, -7); ctx.quadraticCurveTo(-13, -16, 0, -16.5); ctx.closePath();
      ctx.lineWidth = 3; ctx.strokeStyle = '#ffd84a'; ctx.stroke();
      G.pawPath(ctx, 0, 0, 7.5); ctx.fillStyle = '#ffffff'; ctx.fill();

      ell(ctx, hx + 2, hy - 33, 4.5, 4.5); outlined(ctx, '#ffffff', lw * 0.7);
      G.softStarPath(ctx, hx, hy - 20, 5.5, 2.6); ctx.fillStyle = '#ffe066'; ctx.fill();
    },
    hand(ctx, art, p, lw) {
      let wx = 24, wy = -14, ang = 0.35;
      if (p.arm === 'wind') { wx = 22; wy = -26; ang = 0.0; }
      else if (p.arm === 'strike') { wx = 22; wy = -22; ang = 1.0; }
      drawStarWand(ctx, wx, wy, ang, lw, '#ffe066', 0.7);
      drawPaw(ctx, art, wx, wy, lw);
      drawPaw(ctx, art, -13, -14, lw);
    },
  };

  /* ---------- cannon cat: a totally different silhouette ---------- */
  function drawCannonCat(ctx, art, p, lw, team) {
    const tc = NK.C.TEAM[team];
    const recoil = p.arm === 'strike' ? -4 : p.arm === 'follow' ? -2 : 0;
    const squash = p.arm === 'wind' ? 1.5 : 0;
    // back wheel
    ell(ctx, 18, -11, 10.5, 10.5); outlined(ctx, '#a8744f', lw);
    ell(ctx, 18, -11, 4, 4); outlined(ctx, tc.main, lw * 0.6);
    // barrel
    ctx.save(); ctx.translate(4 + recoil, -30 + squash); ctx.rotate(-0.62);
    ctx.beginPath(); G.roundRect(ctx, 0, -11, 40, 22, 9);
    const g = ctx.createLinearGradient(0, -11, 0, 11);
    g.addColorStop(0, '#fff0a8'); g.addColorStop(0.5, '#f7c64a'); g.addColorStop(1, '#d99a2a');
    outlined(ctx, g, lw);
    ctx.beginPath(); G.roundRect(ctx, 34, -13.5, 9, 27, 4); outlined(ctx, tc.main, lw);
    ctx.beginPath(); G.roundRect(ctx, 14, -11.5, 5, 23, 2); ctx.fillStyle = tc.main; ctx.fill();
    ell(ctx, 43, 0, 2.6, 8); ctx.fillStyle = '#3a2748'; ctx.fill();
    shine(ctx, 22, -5, 10, 2.2, 0, 0.55);
    ctx.restore();
    // round body (pot)
    ell(ctx, -4, -24 + squash * 0.5, 23, 20 - squash * 0.4);
    const g2 = ctx.createRadialGradient(-12, -34, 3, -4, -24, 26);
    g2.addColorStop(0, '#ffc9dd'); g2.addColorStop(0.5, '#ff94bb'); g2.addColorStop(1, '#e0628f');
    outlined(ctx, g2, lw);
    ctx.beginPath(); ctx.moveTo(-26, -24); ctx.quadraticCurveTo(-4, -16, 18, -24); ctx.lineWidth = 4; ctx.strokeStyle = tc.main; ctx.stroke();
    G.softStarPath(ctx, -4, -14, 6, 3); outlined(ctx, '#ffe066', lw * 0.6);
    // front wheel
    ell(ctx, -16, -10, 10.5, 10.5); outlined(ctx, '#b98358', lw);
    ctx.lineWidth = 1.6; ctx.strokeStyle = '#7a5236';
    for (let i = 0; i < 3; i++) { const a = i * Math.PI / 3 + (p.legL[1] ? 0.5 : 0); ctx.beginPath(); ctx.moveTo(-16 + Math.cos(a) * 9, -10 + Math.sin(a) * 9); ctx.lineTo(-16 - Math.cos(a) * 9, -10 - Math.sin(a) * 9); ctx.stroke(); }
    ell(ctx, -16, -10, 3.6, 3.6); outlined(ctx, tc.main, lw * 0.6);
    // hatch rim
    ell(ctx, -6, -40 + squash, 15, 5); outlined(ctx, '#d0628f', lw);
    // cat head poking out
    ctx.save(); ctx.translate(-6, -41 + squash); ctx.scale(0.72, 0.72);
    const hp = Object.assign({}, p);
    if (p.arm === 'strike') { hp.eyes = 'hurt'; hp.mouth = 'open'; }
    drawHead(ctx, art, hp, lw / 0.72, { hy: -18 });
    ctx.restore();
    // paws on rim
    drawPaw(ctx, art, -15, -39 + squash, lw, 4.4);
    drawPaw(ctx, art, 3, -39 + squash, lw, 4.4);
  }

  /* ---------- main draw ---------- */
  function drawCat(ctx, art, frame, team, variant = 0) {
    const p = poseFor(frame);
    const K = KINDS[art.kind] || {};
    const lw = 2.7 * (0.55 + 0.45 / art.size);
    art = variant ? Object.assign({}, art, VARIANTS[art.kind][variant % VARIANTS[art.kind].length]) : art;
    if (K.alpha) ctx.globalAlpha = K.alpha;
    if (art.kind === 'cannon') { drawCannonCat(ctx, art, p, lw, team); ctx.globalAlpha = 1; return; }
    const flying = !!K.flying;
    if (flying) { p.legL = [0, p.legL[1] * 0.3]; p.legR = [0, p.legR[1] * 0.3]; }
    ctx.save();
    ctx.translate(p.lean, 0);
    if (K.back) K.back(ctx, art, p, lw, team);
    if (!K.noTail) drawTail(ctx, art, p, lw, K.tail || {});
    const bodyArt = K.suit ? Object.assign({}, art, { body: K.suit, belly: K.suitBelly, pattern: 'none' }) : art;
    if (!K.noFeet) drawFeet(ctx, bodyArt, p, lw, flying);
    let by;
    if (K.customBody) { K.customBody(ctx, art, p, lw); by = -14; }
    else by = drawBody(ctx, bodyArt, p, lw, ...(K.bodyR || [16.5, 13.5]));
    if (K.body) K.body(ctx, art, p, lw, by);
    if (K.neck) K.neck(ctx, art, p, lw, team);
    const faceOpts = Object.assign({ noEars: K.noEars, earCol: K.earCol, earInner: K.earInner }, K.faceOpts || {});
    if (K.beforeFace) faceOpts.beforeFace = (hx, hy) => K.beforeFace(ctx, art, p, lw, hx, hy);
    const [hx, hy] = drawHead(ctx, art, p, lw, faceOpts);
    if (!K.neck && art.kind !== 'ghost' && art.kind !== 'kitten') drawCollar(ctx, team, lw);
    if (K.head) K.head(ctx, art, p, lw, hx, hy, team);
    if (K.hand) K.hand(ctx, bodyArt, p, lw, team);
    else { drawPaw(ctx, bodyArt, -13, -14, lw); drawPaw(ctx, bodyArt, 13, -14, lw); }
    if (K.front) K.front(ctx, art, p, lw, team);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  const VARIANTS = {
    kitten: [
      {},
      { body: '#cfd0de', belly: '#f4f4fb', stripe: '#9fa1b8' },
      { body: '#fff4e6', belly: '#ffffff', stripe: '#f4a45c', pattern: 'calico' },
      { body: '#4f4a63', belly: '#8d88a8', stripe: '#3a3650', pattern: 'socks', eye: '#ffd43b' },
    ],
  };

  /* ---------- cache ---------- */
  function getFrame(artKey, art, team, frame, variant = 0) {
    const key = artKey + '|' + team + '|' + frame + '|' + variant;
    let c = cache.get(key);
    if (c) return c;
    const s = art.size;
    const w = Math.ceil(BOX_W * s * RES), h = Math.ceil(BOX_H * s * RES);
    const canvas = G.makeCanvas(w, h);
    const ctx = canvas.getContext('2d');
    ctx.translate(ORG_X * s * RES, ORG_Y * s * RES);
    ctx.scale(s * RES, s * RES);
    drawCat(ctx, art, frame, team, variant);
    c = trim({ canvas, ox: ORG_X * s, oy: ORG_Y * s, w: BOX_W * s, h: BOX_H * s });
    cache.set(key, c);
    return c;
  }
  // crop transparent padding so every blit rasterizes as few pixels as possible
  function trim(fr) {
    const cv = fr.canvas, W = cv.width, H = cv.height;
    let data;
    try { data = cv.getContext('2d').getImageData(0, 0, W, H).data; } catch (e) { return fr; }
    let x0 = W, y0 = H, x1 = -1, y1 = -1;
    for (let y = 0; y < H; y++) {
      const row = y * W * 4;
      for (let x = 0; x < W; x++) {
        if (data[row + x * 4 + 3] > 2) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      }
    }
    if (x1 < 0) return fr;
    x0 = Math.max(0, x0 - 2); y0 = Math.max(0, y0 - 2); x1 = Math.min(W - 1, x1 + 2); y1 = Math.min(H - 1, y1 + 2);
    const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
    const out = G.makeCanvas(cw, ch);
    out.getContext('2d').drawImage(cv, x0, y0, cw, ch, 0, 0, cw, ch);
    const k = fr.w / W; // logical px per canvas px
    return { canvas: out, ox: fr.ox - x0 * k, oy: fr.oy - y0 * k, w: cw * k, h: ch * k };
  }
  // white silhouette for hit flash
  function getFlash(frameObj) {
    if (frameObj.flash) return frameObj.flash;
    const c = G.makeCanvas(frameObj.canvas.width, frameObj.canvas.height);
    const ctx = c.getContext('2d');
    ctx.drawImage(frameObj.canvas, 0, 0);
    ctx.globalCompositeOperation = 'source-in';
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, c.width, c.height);
    frameObj.flash = c;
    return c;
  }
  // tint silhouette (e.g., frozen = light blue) cached per color
  function getTint(frameObj, color) {
    frameObj.tints = frameObj.tints || {};
    if (frameObj.tints[color]) return frameObj.tints[color];
    const c = G.makeCanvas(frameObj.canvas.width, frameObj.canvas.height);
    const ctx = c.getContext('2d');
    ctx.drawImage(frameObj.canvas, 0, 0);
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, c.width, c.height);
    frameObj.tints[color] = c;
    return c;
  }

  // warm the cache for a unit type (avoids hitches on first deploy)
  function prewarm(unitKey, team) {
    const def = NK.Units[unitKey];
    if (!def) return;
    const nv = VARIANTS[def.art.kind] ? VARIANTS[def.art.kind].length : 1;
    for (let v = 0; v < nv; v++) for (const f of FRAMES) getFrame(unitKey, def.art, team, f, v);
  }

  /* draw a unit sprite directly to a context (used for UI portraits/menus) */
  function drawTo(ctx, unitKey, team, frame, x, y, scale = 1, variant = 0) {
    const def = NK.Units[unitKey] || GUARD;
    const fr = getFrame(unitKey, def.art, team, frame, variant);
    ctx.drawImage(fr.canvas, x - fr.ox * scale, y - fr.oy * scale, fr.w * scale, fr.h * scale);
  }

  const GUARD = { art: { kind: 'guard', body: '#fff3e2', belly: '#ffffff', stripe: '#f2b77a', pattern: 'none', eye: '#4f8fe8', size: 0.8 } };
  NK.Units.__guard = GUARD;

  function setRes(r) {
    r = Math.max(1, Math.min(2.5, Math.round(r * 4) / 4));
    if (r !== RES) { RES = r; cache.clear(); }
  }
  return { getFrame, getFlash, getTint, prewarm, drawTo, drawCat, setRes, FRAMES, VARIANTS, get RES() { return RES; } };
})();

/* ---- 04_structart.js ---- */
/* =====================================================================
   Structure art: Paw Towers, Nyan Castle, Yarn Cannon, Cat Shrine, rubble
   Static bodies are cached per team; faces/flags/guards animate live.
   ===================================================================== */
'use strict';
NK.StructArt = (() => {
  const U = NK.U, G = NK.G, TAU = U.TAU, INK = NK.C.INK;
  const cache = new Map();
  const RES = 2;

  function ell(ctx, x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); }
  function outlined(ctx, fill, lw = 3) { ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.stroke(); ctx.fillStyle = fill; ctx.fill(); }

  function cached(key, w, h, ox, oy, painter) {
    let c = cache.get(key);
    if (c) return c;
    const canvas = G.makeCanvas(w * RES, h * RES);
    const ctx = canvas.getContext('2d');
    ctx.scale(RES, RES); ctx.translate(ox, oy);
    painter(ctx);
    c = { canvas, ox, oy, w, h };
    cache.set(key, c);
    return c;
  }
  function blit(ctx, c, x, y, sx = 1, sy = 1) {
    ctx.drawImage(c.canvas, x - c.ox * sx, y - c.oy * sy, c.w * sx, c.h * sy);
  }

  /* ---------------- stone cylinder helper ---------------- */
  function cylinder(ctx, rx, ry, h, stone, stoneDark, rows = 4) {
    // body
    ctx.beginPath();
    ctx.moveTo(-rx, -h); ctx.lineTo(-rx, 0); ctx.ellipse(0, 0, rx, ry, 0, Math.PI, 0, true); ctx.lineTo(rx, -h);
    ctx.ellipse(0, -h, rx, ry, 0, 0, Math.PI, true); ctx.closePath();
    const g = ctx.createLinearGradient(-rx, 0, rx, 0);
    g.addColorStop(0, U.shade(stone, -0.08)); g.addColorStop(0.35, U.shade(stone, 0.25)); g.addColorStop(0.7, stone); g.addColorStop(1, stoneDark);
    outlined(ctx, g, 3.2);
    // brick rows
    ctx.save();
    ctx.beginPath(); ctx.moveTo(-rx, -h); ctx.lineTo(-rx, 0); ctx.ellipse(0, 0, rx, ry, 0, Math.PI, 0, true); ctx.lineTo(rx, -h); ctx.closePath(); ctx.clip();
    ctx.strokeStyle = U.rgba(stoneDark, 0.55); ctx.lineWidth = 1.6;
    for (let i = 1; i <= rows; i++) {
      const y = -h + (h / (rows + 1)) * i;
      ctx.beginPath(); ctx.ellipse(0, y, rx, ry, 0, 0, Math.PI); ctx.stroke();
      const off = i % 2 ? 0 : 0.5;
      for (let k = 0; k < 5; k++) {
        const t = (k + off) / 5;
        const bx = -rx + t * rx * 2;
        const yy = y + Math.sqrt(Math.max(0, 1 - (bx * bx) / (rx * rx))) * ry;
        ctx.beginPath(); ctx.moveTo(bx, yy); ctx.lineTo(bx, yy - h / (rows + 1)); ctx.stroke();
      }
    }
    ctx.restore();
  }

  /* ---------------- Paw Tower ---------------- */
  function towerBody(team) {
    const tc = NK.C.TEAM[team];
    return cached('tower' + team, 140, 170, 70, 130, (ctx) => {
      // foundation
      ell(ctx, 0, 4, 54, 24); outlined(ctx, '#d9c7e6', 3);
      ell(ctx, 0, 1, 48, 20); ctx.fillStyle = '#eadcf2'; ctx.fill();
      cylinder(ctx, 40, 16, 64, '#fbeede', '#d7bfa9', 4);
      // parapet ring
      ctx.save(); ctx.translate(0, -64);
      ctx.beginPath();
      ctx.moveTo(-47, -6); ctx.lineTo(-47, 4); ctx.ellipse(0, 4, 47, 18, 0, Math.PI, 0, true); ctx.lineTo(47, -6);
      ctx.ellipse(0, -6, 47, 18, 0, 0, Math.PI, true); ctx.closePath();
      const g = ctx.createLinearGradient(-47, 0, 47, 0);
      g.addColorStop(0, '#eadbc8'); g.addColorStop(0.35, '#fff7ec'); g.addColorStop(1, '#d4bca6');
      outlined(ctx, g, 3.2);
      ell(ctx, 0, -6, 47, 18); outlined(ctx, '#f3e6f7', 3);
      ell(ctx, 0, -6, 38, 13); ctx.fillStyle = '#e2d0ec'; ctx.fill();
      // merlons along front
      for (let i = -2; i <= 2; i++) {
        const mx = i * 19;
        const my = -6 + Math.sqrt(1 - (mx * mx) / (47 * 47)) * 18;
        ctx.beginPath(); G.roundRect(ctx, mx - 7, my - 13, 14, 14, 4); outlined(ctx, '#fff4e8', 2.6);
        ctx.beginPath(); G.roundRect(ctx, mx - 7, my - 13, 14, 5, 3); ctx.fillStyle = tc.main; ctx.fill();
      }
      ctx.restore();
      // banner
      ctx.beginPath();
      ctx.moveTo(-15, -52); ctx.lineTo(15, -52); ctx.lineTo(15, -18); ctx.lineTo(0, -10); ctx.lineTo(-15, -18); ctx.closePath();
      const bg = ctx.createLinearGradient(0, -52, 0, -10);
      bg.addColorStop(0, tc.light); bg.addColorStop(1, tc.main);
      outlined(ctx, bg, 2.8);
      G.pawPath(ctx, 0, -32, 8); ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.beginPath(); G.roundRect(ctx, -18, -56, 36, 6, 3); outlined(ctx, '#ffd84a', 2.4);
      // little window arches
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(s * 28 - 4, -30); ctx.lineTo(s * 28 - 4, -38); ctx.arc(s * 28, -38, 4, Math.PI, 0); ctx.lineTo(s * 28 + 4, -30); ctx.closePath();
        outlined(ctx, '#6e5a8a', 2);
      }
    });
  }

  function drawTower(ctx, x, y, team, st) {
    const body = towerBody(team);
    const sq = 1 + (st.hitT > 0 ? Math.sin(st.hitT * 40) * 0.02 : 0);
    blit(ctx, body, x, y, sq, 2 - sq);
    // flags on poles
    const tc = NK.C.TEAM[team];
    for (const s of [-1, 1]) {
      const px = x + s * 44, py = y - 82;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py - 30); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
      const w = Math.sin(st.t * 4 + s) * 3;
      ctx.beginPath(); ctx.moveTo(px, py - 30); ctx.quadraticCurveTo(px + s * 10, py - 30 + w, px + s * 18, py - 25 + w); ctx.lineTo(px, py - 19); ctx.closePath();
      outlined(ctx, tc.main, 2.2);
      ell(ctx, px, py - 31, 2.5, 2.5); ctx.fillStyle = '#ffd84a'; ctx.fill();
    }
    // guard cat
    const bob = Math.sin(st.t * 3) * 1.2;
    const frame = st.atkT > 0 ? (st.atkT > 0.12 ? 'atk0' : 'atk1') : (Math.sin(st.t * 0.9 + x) > 0.97 ? 'idle1' : 'idle0');
    const flip = st.face < 0 ? -1 : 1;
    ctx.save(); ctx.translate(x, y - 76 + bob); ctx.scale(flip, 1);
    NK.CatArt.drawTo(ctx, '__guard', team, frame, 0, 0, 0.95);
    ctx.restore();
  }

  /* ---------------- Nyan Castle ---------------- */
  function castleBody(team) {
    const tc = NK.C.TEAM[team];
    return cached('castle' + team, 240, 230, 120, 170, (ctx) => {
      ell(ctx, 0, 6, 98, 36); outlined(ctx, '#d9c7e6', 3);
      ell(ctx, 0, 3, 90, 31); ctx.fillStyle = '#eadcf2'; ctx.fill();
      // ear turrets (behind)
      for (const s of [-1, 1]) {
        ctx.save(); ctx.translate(s * 62, -72);
        cylinder(ctx, 20, 8, 44, '#fbe7ee', '#dcb8c8', 2);
        ctx.beginPath(); ctx.moveTo(-25, -44); ctx.quadraticCurveTo(-18 + s * 4, -82, s * 6, -96); ctx.quadraticCurveTo(14 + s * 4, -74, 25, -44);
        ctx.ellipse(0, -44, 25, 9, 0, 0, Math.PI, false); ctx.closePath();
        const g = ctx.createLinearGradient(-25, -90, 25, -44);
        g.addColorStop(0, tc.light); g.addColorStop(1, tc.dark);
        outlined(ctx, g, 3);
        ctx.beginPath(); ctx.moveTo(-12, -48); ctx.quadraticCurveTo(-6 + s * 3, -70, s * 4, -80); ctx.quadraticCurveTo(4 + s * 3, -64, 10, -48); ctx.closePath();
        ctx.fillStyle = '#ffc2d6'; ctx.fill();
        ctx.restore();
      }
      // main wall (rounded front)
      ctx.beginPath();
      ctx.moveTo(-86, -104); ctx.lineTo(-86, 0); ctx.ellipse(0, 0, 86, 30, 0, Math.PI, 0, true); ctx.lineTo(86, -104);
      ctx.ellipse(0, -104, 86, 30, 0, 0, Math.PI, true); ctx.closePath();
      const wg = ctx.createLinearGradient(-86, 0, 86, 0);
      wg.addColorStop(0, '#f1d6e2'); wg.addColorStop(0.3, '#fff3f7'); wg.addColorStop(0.75, '#fbe3ec'); wg.addColorStop(1, '#dcb2c6');
      outlined(ctx, wg, 3.4);
      // stones
      ctx.save();
      ctx.beginPath(); ctx.moveTo(-86, -104); ctx.lineTo(-86, 0); ctx.ellipse(0, 0, 86, 30, 0, Math.PI, 0, true); ctx.lineTo(86, -104); ctx.closePath(); ctx.clip();
      ctx.strokeStyle = 'rgba(200,150,175,0.45)'; ctx.lineWidth = 1.6;
      for (let i = 1; i < 6; i++) { ctx.beginPath(); ctx.ellipse(0, -104 + i * 19, 86, 30, 0, 0, Math.PI); ctx.stroke(); }
      ctx.restore();
      // top rim + crenellations
      ell(ctx, 0, -104, 86, 30); outlined(ctx, '#f6e8f8', 3);
      ell(ctx, 0, -104, 72, 23); ctx.fillStyle = '#e6d4ee'; ctx.fill();
      for (let i = -3; i <= 3; i++) {
        const mx = i * 24;
        const my = -104 + Math.sqrt(1 - (mx * mx) / (86 * 86)) * 30;
        ctx.beginPath(); G.roundRect(ctx, mx - 9, my - 15, 18, 16, 5); outlined(ctx, '#fff4f8', 2.6);
        ctx.beginPath(); G.roundRect(ctx, mx - 9, my - 15, 18, 6, 4); ctx.fillStyle = tc.main; ctx.fill();
      }
      // gate
      ctx.beginPath(); ctx.moveTo(-17, 26); ctx.lineTo(-17, 6); ctx.arc(0, 6, 17, Math.PI, 0); ctx.lineTo(17, 26); ctx.quadraticCurveTo(0, 30, -17, 26); ctx.closePath();
      outlined(ctx, '#7a5a8e', 3);
      ctx.strokeStyle = '#5a3f70'; ctx.lineWidth = 1.6;
      for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * 7, -8); ctx.lineTo(i * 7, 27); ctx.stroke(); }
      // side banners
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(s * 72 - 11, -84); ctx.lineTo(s * 72 + 11, -84); ctx.lineTo(s * 72 + 11, -40); ctx.lineTo(s * 72, -32); ctx.lineTo(s * 72 - 11, -40); ctx.closePath();
        outlined(ctx, tc.main, 2.6);
        G.softStarPath(ctx, s * 72, -60, 7, 3.4); ctx.fillStyle = '#ffe36b'; ctx.fill();
      }
      // whiskers painted
      ctx.strokeStyle = U.rgba(INK, 0.5); ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(s * 40, -34); ctx.lineTo(s * 58, -38); ctx.moveTo(s * 40, -28); ctx.lineTo(s * 57, -25); ctx.stroke();
      }
    });
  }

  function drawCastle(ctx, x, y, team, st) {
    const body = castleBody(team);
    const hit = st.hitT > 0 ? Math.sin(st.hitT * 40) * 0.015 : 0;
    blit(ctx, body, x, y, 1 + hit, 1 - hit);
    const tc = NK.C.TEAM[team];
    // face
    const fy = y - 56;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // blush
    ctx.fillStyle = 'rgba(255,120,160,0.4)';
    ell(ctx, x - 44, fy + 14, 11, 6); ctx.fill(); ell(ctx, x + 44, fy + 14, 11, 6); ctx.fill();
    const open = st.awake ? U.clamp(st.wakeT * 3, 0, 1) : 0;
    for (const s of [-1, 1]) {
      const ex = x + s * 26;
      if (open < 0.05) {
        ctx.beginPath(); ctx.arc(ex, fy - 2, 10, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
      } else {
        const ry = 13 * open;
        ell(ctx, ex, fy, 11, ry);
        const g = ctx.createLinearGradient(ex, fy - ry, ex, fy + ry);
        g.addColorStop(0, '#2a1838'); g.addColorStop(1, team === 0 ? '#4fb3ff' : '#ff6b93');
        ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
        ell(ctx, ex - 3.5, fy - 4 * open, 4, 4 * open); ctx.fillStyle = '#fff'; ctx.fill();
        ell(ctx, ex + 4, fy + 5 * open, 2, 2 * open); ctx.fill();
        // determined brows
        ctx.beginPath(); ctx.moveTo(ex - s * 12, fy - 18); ctx.lineTo(ex + s * 9, fy - 14); ctx.lineWidth = 3.4; ctx.strokeStyle = INK; ctx.stroke();
      }
    }
    // mouth ω
    ctx.beginPath(); ctx.arc(x - 5, fy + 12, 5, 0.1, Math.PI - 0.1); ctx.moveTo(x + 10, fy + 12); ctx.arc(x + 5, fy + 12, 5, 0.1, Math.PI - 0.1);
    ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
    ell(ctx, x, fy + 6, 3.4, 2.4); ctx.fillStyle = '#ff7fa3'; ctx.fill();
    // crown gem on top
    const gy = y - 140 + Math.sin(st.t * 2) * 2;
    ctx.beginPath();
    ctx.moveTo(x - 22, gy + 10); ctx.lineTo(x - 24, gy - 8); ctx.lineTo(x - 11, gy + 1); ctx.lineTo(x, gy - 14); ctx.lineTo(x + 11, gy + 1); ctx.lineTo(x + 24, gy - 8); ctx.lineTo(x + 22, gy + 10); ctx.closePath();
    outlined(ctx, '#ffd84a', 3);
    const glow = st.awake ? 0.6 + Math.sin(st.t * 6) * 0.2 + (st.atkT > 0 ? 0.6 : 0) : 0.15;
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(G.tex('glow', tc.glow), x - 30, gy - 30, 60, 60);

    ctx.drawImage(G.tex('glow', '#ffffff'), x - 22, gy - 22, 44, 44);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    if (!st.awake) {

      }

  }

  /* ---------------- rubble ---------------- */
  function drawRubble(ctx, x, y, team, big, t) {
    const tc = NK.C.TEAM[team];
    const s = big ? 1.5 : 1;
    ell(ctx, x, y + 2, 50 * s, 20 * s); ctx.fillStyle = 'rgba(90,60,110,0.18)'; ctx.fill();
    const rocks = [[-26, -4, 16, 11], [0, -10, 20, 14], [24, -3, 15, 10], [-10, 4, 14, 9], [14, 6, 13, 8], [-34, 6, 10, 7], [34, 6, 10, 7]];
    for (const [rx, ry, w, h] of rocks) {
      ell(ctx, x + rx * s, y + ry * s, w * s, h * s);
      outlined(ctx, big ? '#f4dde8' : '#f2e3d2', 2.6);
      ell(ctx, x + rx * s - w * 0.3 * s, y + ry * s - h * 0.35 * s, w * 0.35 * s, h * 0.25 * s); ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
    }
    // bent flag
    ctx.beginPath(); ctx.moveTo(x + 6 * s, y - 14 * s); ctx.lineTo(x + 16 * s, y - 42 * s); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 16 * s, y - 42 * s); ctx.quadraticCurveTo(x + 26 * s, y - 40 * s + Math.sin(t * 3) * 2, x + 32 * s, y - 32 * s); ctx.lineTo(x + 13 * s, y - 32 * s); ctx.closePath();
    outlined(ctx, tc.main, 2);
  }

  /* ---------------- Yarn Cannon (deployable) ---------------- */
  function drawYarnCannon(ctx, x, y, team, st) {
    const tc = NK.C.TEAM[team];
    ell(ctx, x, y + 2, 36, 15); ctx.fillStyle = 'rgba(90,60,110,0.2)'; ctx.fill();
    // wooden drum
    ctx.save(); ctx.translate(x, y);
    const sq = st.atkT > 0.1 ? 1.05 : 1;
    ctx.scale(sq, 2 - sq);
    cylinder(ctx, 28, 11, 24, '#f6c89a', '#c98f5f', 1);
    ell(ctx, 0, -24, 28, 11); outlined(ctx, '#ffe3c4', 2.8);
    ctx.beginPath(); ctx.ellipse(0, -10, 28, 11, 0, 0, Math.PI); ctx.lineWidth = 5; ctx.strokeStyle = tc.main; ctx.stroke();
    // yarn basket balls
    for (const [bx, by, c] of [[-16, -28, '#ff9ec0'], [16, -27, '#9fd8ff']]) {

    }

    const ang = st.aim;
    const hy = -40;

    const recoil = st.atkT > 0.05 ? -5 : 0;
    ctx.save(); ctx.translate(0, hy); ctx.rotate(ang);
    ctx.beginPath(); G.roundRect(ctx, 4 + recoil, -7, 30, 14, 6);
    outlined(ctx, '#ffe8a8', 2.8);
    ctx.beginPath(); G.roundRect(ctx, 26 + recoil, -9, 8, 18, 4); outlined(ctx, tc.main, 2.4);
    ctx.restore();
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(s * 16, hy - 8); ctx.lineTo(s * 13, hy - 26); ctx.lineTo(s * 4, hy - 15); ctx.closePath(); outlined(ctx, '#fff1f6', 2.6);
      ctx.beginPath(); ctx.moveTo(s * 13, hy - 12); ctx.lineTo(s * 12, hy - 21); ctx.lineTo(s * 7, hy - 15); ctx.closePath(); ctx.fillStyle = '#ffb3c7'; ctx.fill();
    }
    ell(ctx, 0, hy, 19, 16); outlined(ctx, '#fff1f6', 2.8);
    ell(ctx, -6, hy - 7, 5, 2.5); ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fill();
    // face
    ctx.fillStyle = INK;
    for (const s of [-1, 1]) { ell(ctx, s * 6 + face * 3, hy + 1, 2.6, 3.4); ctx.fill(); }
    ctx.beginPath(); ctx.arc(face * 3 - 2, hy + 6, 2, 0.1, Math.PI - 0.1); ctx.moveTo(face * 3 + 4, hy + 6); ctx.arc(face * 3 + 2, hy + 6, 2, 0.1, Math.PI - 0.1);
    ctx.lineWidth = 1.4; ctx.strokeStyle = INK; ctx.stroke();
    ctx.restore();
  }

  /* ---------------- Cat Shrine (deployable) ---------------- */
  function drawShrine(ctx, x, y, team, st) {
    const tc = NK.C.TEAM[team];
    ell(ctx, x, y + 2, 40, 16); ctx.fillStyle = 'rgba(90,60,110,0.2)'; ctx.fill();
    ctx.save(); ctx.translate(x, y);
    // platform
    cylinder(ctx, 34, 13, 8, '#efe4f5', '#c9b4d8', 0);
    ell(ctx, 0, -8, 34, 13); outlined(ctx, '#faf3ff', 2.6);
    // pillars
    for (const s of [-1, 1]) {
      ctx.beginPath(); G.roundRect(ctx, s * 24 - 4, -58, 8, 52, 3); outlined(ctx, tc.main, 2.6);
    }
    // statue: round golden cat waving
    const wave = Math.sin(st.t * 5) * 0.5;
    ell(ctx, 0, -20, 13, 11); outlined(ctx, '#ffe07a', 2.4);
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * 11, -34); ctx.lineTo(s * 9, -46); ctx.lineTo(s * 3, -38); ctx.closePath(); outlined(ctx, '#ffe07a', 2.2); }
    ell(ctx, 0, -35, 12, 10); outlined(ctx, '#ffe07a', 2.4);
    ell(ctx, -4, -39, 4, 2); ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fill();
    ctx.beginPath(); ctx.arc(-4, -35, 2.5, Math.PI * 1.1, Math.PI * 1.9); ctx.moveTo(6.5, -35); ctx.arc(4, -35, 2.5, Math.PI * 1.1, Math.PI * 1.9);
    ctx.lineWidth = 1.6; ctx.strokeStyle = INK; ctx.stroke();
    ctx.save(); ctx.translate(11, -26); ctx.rotate(-1.2 + wave);
    ctx.beginPath(); G.roundRect(ctx, -3, -12, 7, 13, 3.5); outlined(ctx, '#ffe07a', 2); ctx.restore();
    ell(ctx, 0, -18, 6, 4.5); ctx.fillStyle = tc.main; ctx.fill();
    // roof
    ctx.beginPath();
    ctx.moveTo(-40, -58); ctx.quadraticCurveTo(0, -52, 40, -58); ctx.lineTo(36, -66); ctx.quadraticCurveTo(0, -62, -36, -66); ctx.closePath();
    outlined(ctx, '#ff7a8a', 2.8);
    ctx.beginPath(); G.roundRect(ctx, -30, -54, 60, 5, 2.5); outlined(ctx, '#ff9aa6', 2.2);
    // bell rope
    ctx.beginPath(); ctx.moveTo(0, -53); ctx.lineTo(0, -48); ctx.lineWidth = 2; ctx.strokeStyle = '#c9632a'; ctx.stroke();
    ell(ctx, 0, -46, 3, 3); outlined(ctx, '#ffd84a', 1.6);
    ctx.restore();
    // floating nyanergy orb charging
    const p = st.genP || 0;
    const oy = y - 88 + Math.sin(st.t * 2.5) * 3;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.5 + p * 0.5;
    ctx.drawImage(G.tex('glow', '#ff7fd0'), x - 20 - p * 8, oy - 20 - p * 8, 40 + p * 16, 40 + p * 16);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    G.icon(ctx, 'drop', x, oy, 9 + p * 3, '#ff8fd6', INK);
  }

  return { drawTower, drawCastle, drawRubble, drawYarnCannon, drawShrine, towerBody, castleBody };
})();

/* ---- 05_arenaart.js ---- */
/* =====================================================================
   Arena art: pre-rendered floating garden island in a pastel sky,
   candy-stone paths, magical river, bridges, flowers, statues.
   ===================================================================== */
'use strict';
NK.ArenaArt = (() => {
  const U = NK.U, G = NK.G, C = NK.C, TAU = U.TAU, INK = C.INK;
  let bg = null, bgScale = 0;
  const FIELD = { x: C.AX, y: C.AY, w: C.WW * C.SX, h: C.WH * C.SY };
  const ISLAND = { x: FIELD.x - 52, y: FIELD.y - 44, w: FIELD.w + 104, h: FIELD.h + 72 };

  function rng(seed) {
    return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function ell(ctx, x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); }
  function outlined(ctx, fill, lw = 3, stroke = INK) { ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); ctx.fillStyle = fill; ctx.fill(); }
  const toWorld = (ctx) => ctx.transform(C.SX, 0, 0, C.SY, C.AX, C.AY);

  /* ---------- sky & side scenery ---------- */
  function drawSky(ctx) {
    const g = ctx.createLinearGradient(0, 0, 0, C.VH);
    g.addColorStop(0, '#c9b8ff'); g.addColorStop(0.45, '#ffd6ec'); g.addColorStop(1, '#bfe8ff');
    ctx.fillStyle = g; ctx.fillRect(0, 0, C.VW, C.VH);
    const r = rng(7);
    // faint rainbow arcs on sides
    ctx.save(); ctx.globalAlpha = 0.18;
    const cols = ['#ff8fb5', '#ffc36b', '#fff28a', '#9fe89a', '#8fd0ff', '#b69cff'];
    for (const side of [-1, 1]) {
      const cx = side < 0 ? 120 : C.VW - 120, cy = 760;
